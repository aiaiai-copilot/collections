      }).join('');
      const results = elementRows ? `<section class="start-search-section"><h2>Элементы</h2>${elementRows}</section>` : '';
      const empty = !results ? `<p class="start-search-empty">${queryTags.length ? 'По этим тегам ничего не найдено.' : state.startCollections.length ? 'В выбранной области пока нет элементов.' : 'Коллекций пока нет.'}</p>` : '';
      return `<section class="start-flow"><header class="start-flow-header centered-flow-header"><button class="start-flow-back" type="button" data-cancel-start-search aria-label="Назад">←</button><span class="start-flow-header-title">Поиск</span><span aria-hidden="true"></span></header><main class="start-flow-main list-screen"><div class="start-context-search"><h1>Поиск по тегам</h1><p class="start-search-scope">${scopeText}</p>${baseTags}<label class="start-search-field"><span>Уточняющие теги</span><input type="search" value="${escapeHTML(state.startSearchQuery)}" data-start-search-tags autocomplete="off" placeholder="Например, спокойное, до 100 минут" autofocus></label><div class="start-search-options"><label class="start-search-option"><input type="checkbox" data-start-search-global ${global ? 'checked' : ''} ${hasContext ? '' : 'disabled'}><span>Искать во всех коллекциях</span></label></div>${results}${empty}</div></main></section>`;
    }

    function createStartElement(title) {
      const collection = activeStartCollection();
      const normalizedTitle = title.trim();
      if (!collection || !normalizedTitle) return false;
      const selection = activeStartSelection();
      const element = {
        id: `element-${state.nextStartElementId++}`,
        title: normalizedTitle,
        tags: state.startElementReturnStage === 'selection' && selection && selection.mode !== 'manual' ? [...selection.tags] : []
      };
      collection.elements.push(element);
      if (state.startElementReturnStage === 'selection' && selection?.mode === 'manual') selection.memberIds.push(element.id);
      state.startElementName = '';
      state.startElementSearch = '';
      state.appStage = state.startElementReturnStage === 'selection' ? 'selection' : 'collection';
      syncStartingFlowRoute();
      render();
      return true;
    }

    function deleteStartElement(id) {
      const collection = activeStartCollection();
      const index = collection?.elements.findIndex(item => item.id === id) ?? -1;
      if (!collection || index < 0) return;
      collection.elements.splice(index, 1);
      collection.selections.filter(selection => selection.mode === 'manual').forEach(selection => {
        selection.memberIds = selection.memberIds.filter(memberId => memberId !== id);
      });
      state.activeStartElementId = null;
      state.startElementName = '';
      state.startElementTags = '';
      state.pendingStartElementDeleteId = null;
      state.appStage = 'selection';
      syncStartingFlowRoute();
      render();
    }

    function startingFlowMarkup() {
      if (state.appStage === 'search') return startSearchScreenMarkup();
      if (state.appStage === 'new-selection') {
        const collection = activeStartCollection();
        if (!collection) return '';
        const automatic = state.startSelectionMode === 'automatic';
        const filterField = automatic ? `<label><span>Фильтр по тегам</span><input type="text" name="tags" value="${escapeHTML(state.startSelectionTags)}" maxlength="240" autocomplete="off" placeholder="Например, спокойное, до 130 минут"></label><p class="start-form-help">Несколько тегов указываются через запятую. В подборку попадут элементы со всеми выбранными тегами.</p>` : `<p class="start-form-help">Состав ручной подборки задаётся добавлением элементов после её создания.</p>`;
        return `<section class="start-flow"><header class="start-flow-header centered-flow-header"><button class="start-flow-back" type="button" data-cancel-new-start-selection aria-label="Назад">←</button><span class="start-flow-header-title">Создание подборки</span><span aria-hidden="true"></span></header><main class="start-flow-main"><form class="start-collection-form" data-new-start-selection-form><h1>Новая подборка из «${escapeHTML(collection.name)}»</h1><label><span>Название</span><input type="text" name="name" value="${escapeHTML(state.startSelectionName)}" maxlength="80" autocomplete="off" placeholder="Например, На вечер" required autofocus></label><fieldset class="start-selection-mode"><legend>Тип подборки</legend><label><input type="radio" name="mode" value="automatic" ${automatic ? 'checked' : ''}><span>Автоматическая</span></label><label><input type="radio" name="mode" value="manual" ${automatic ? '' : 'checked'}><span>Ручная</span></label></fieldset>${filterField}<button class="primary-button" type="submit">Создать подборку</button></form></main></section>`;
      }
      if (state.appStage === 'edit-selection') {
        const selection = activeStartSelection();
        if (!selection || selection.system) return '';
        const deleteConfirmation = state.pendingStartSelectionDeleteId === selection.id ? `<div class="start-delete-confirm" role="alertdialog" aria-modal="true" aria-labelledby="start-delete-selection-title"><strong id="start-delete-selection-title">Удалить «${escapeHTML(selection.name)}»?</strong><p>Удалится только подборка. Элементы останутся в коллекции и других подходящих подборках.</p><div class="start-delete-actions"><button class="filter-delete-cancel" type="button" data-cancel-delete-start-selection>Отмена</button><button class="filter-delete-submit" type="button" data-confirm-delete-start-selection="${escapeHTML(selection.id)}">Удалить</button></div></div>` : '';
        const pendingFilterChange = state.pendingStartSelectionFilterChange?.selectionId === selection.id ? state.pendingStartSelectionFilterChange : null;
        const removedCount = pendingFilterChange?.removedIds.length || 0;
        const removedLead = removedCount === 1 ? 'Из подборки исчезнет 1 элемент.' : `Из подборки исчезнут ${pluralElements(removedCount)}.`;
        const filterConfirmation = pendingFilterChange ? `<div class="start-delete-confirm" role="alertdialog" aria-modal="true" aria-labelledby="start-filter-change-title"><strong id="start-filter-change-title">Состав подборки изменится</strong><p>${removedLead} ${removedCount === 1 ? 'Он останется' : 'Они останутся'} в коллекции и других подходящих подборках. Не попавшие больше ни в одну подборку появятся в «Без подборки».</p><div class="start-delete-actions"><button class="filter-delete-cancel" type="button" data-cancel-start-selection-filter-change>Отмена</button><button class="primary-button" type="button" data-confirm-start-selection-filter-change>Сохранить</button></div></div>` : '';
        const selectionRule = selection.mode === 'manual'
          ? `<div><span class="start-manual-badge">Ручная</span></div>${selection.originTags?.length ? `<p class="start-form-help">Исходный фильтр: ${selection.originTags.map(tag => `#${escapeHTML(tag)}`).join(' · ')}. Состав меняется только вручную.</p>` : '<p class="start-form-help">Состав меняется только вручную.</p>'}`
          : `<label><span>Фильтр по тегам</span><input type="text" name="tags" value="${escapeHTML(state.startSelectionTags)}" maxlength="240" autocomplete="off" placeholder="Например, спокойное, до 130 минут"></label><p class="start-form-help">Несколько тегов соединяются пересечением. Изменение фильтра пересчитает состав подборки.</p>`;
        return `<section class="start-flow"><header class="start-flow-header centered-flow-header"><button class="start-flow-back" type="button" data-cancel-edit-start-selection aria-label="Назад">←</button><span class="start-flow-header-title">Редактирование подборки</span><span aria-hidden="true"></span></header><main class="start-flow-main"><form class="start-collection-form" data-edit-start-selection-form><label><span>Название</span><input type="text" name="name" value="${escapeHTML(state.startSelectionName)}" maxlength="80" autocomplete="off" required autofocus></label>${selectionRule}<div class="start-edit-actions"><button class="primary-button" type="submit">Сохранить</button><button class="start-danger-button" type="button" data-request-delete-start-selection="${escapeHTML(selection.id)}">Удалить</button></div></form></main>${filterConfirmation || deleteConfirmation}</section>`;
      }
      if (state.appStage === 'edit-element') {
        const element = activeStartElement();
        if (!element) return '';
        const confirmation = state.pendingStartElementDeleteId === element.id ? `<div class="start-delete-confirm" role="alertdialog" aria-modal="true" aria-labelledby="start-delete-element-title"><strong id="start-delete-element-title">Удалить «${escapeHTML(element.title)}»?</strong><p>Элемент полностью удалится из коллекции и всех подборок, сделанных из неё.</p><div class="start-delete-actions"><button class="filter-delete-cancel" type="button" data-cancel-delete-start-element>Отмена</button><button class="filter-delete-submit" type="button" data-confirm-delete-start-element="${escapeHTML(element.id)}">Удалить</button></div></div>` : '';
        return `<section class="start-flow"><header class="start-flow-header centered-flow-header"><button class="start-flow-back" type="button" data-cancel-edit-start-element aria-label="Назад">←</button><span class="start-flow-header-title">Редактирование элемента</span><span aria-hidden="true"></span></header><main class="start-flow-main"><form class="start-collection-form" data-edit-start-element-form><label><span>Название</span><input type="text" name="title" value="${escapeHTML(state.startElementName)}" maxlength="120" autocomplete="off" required autofocus></label><label><span>Теги</span><input type="text" name="tags" value="${escapeHTML(state.startElementTags)}" maxlength="240" autocomplete="off" placeholder="Например, спокойное, триллеры"></label><p class="start-form-help">Несколько тегов указываются через запятую. Состав автоматических подборок обновится по фильтрам; ручные не изменятся.</p><div class="start-edit-actions"><button class="primary-button" type="submit">Сохранить</button><button class="start-danger-button" type="button" data-request-delete-start-element="${escapeHTML(element.id)}">Удалить</button></div></form></main>${confirmation}</section>`;
      }
      if (state.appStage === 'new-element') {
        const collection = activeStartCollection();
        const selection = activeStartSelection();
        if (!collection || !selection) return '';
        const addingToSelection = !selection.system;
        const title = addingToSelection ? 'Добавление в подборку' : 'Добавление в коллекцию';
        const newElementForm = `<form class="start-collection-form" data-new-start-element-form><label><span>Название элемента</span><input type="text" name="title" value="${escapeHTML(state.startElementName)}" maxlength="120" autocomplete="off" required autofocus></label><button class="primary-button" type="submit">Добавить</button></form>`;
        if (!addingToSelection) return `<section class="start-flow"><header class="start-flow-header centered-flow-header"><button class="start-flow-back" type="button" data-cancel-new-start-element aria-label="Назад">←</button><span class="start-flow-header-title">${title}</span><span aria-hidden="true"></span></header><main class="start-flow-main">${newElementForm}</main></section>`;
        const memberIds = new Set(elementsForStartSelection(collection, selection).map(element => element.id));
        const query = normalizeTag(state.startElementSearch);
        const matches = matchingStartElements(collection, state.startElementSearch);
        const rows = matches.map(element => {
          const alreadyMember = memberIds.has(element.id);
          return `<button class="start-existing-element-row" type="button" ${alreadyMember ? 'disabled' : `data-add-existing-start-element="${escapeHTML(element.id)}"`}><strong>${escapeHTML(element.title)}</strong><small>${alreadyMember ? 'В подборке' : 'Добавить'}</small></button>`;
        }).join('');
        const results = !query
          ? collection.elements.length ? '' : '<p class="start-search-empty">В коллекции пока нет элементов.</p>'
          : rows || `<p class="start-search-empty">Ничего не найдено. Enter — создать «${escapeHTML(state.startElementSearch.trim())}».</p>`;
        return `<section class="start-flow"><header class="start-flow-header centered-flow-header"><button class="start-flow-back" type="button" data-cancel-new-start-element aria-label="Назад">←</button><span class="start-flow-header-title">${title}</span><span aria-hidden="true"></span></header><main class="start-flow-main list-screen"><div class="start-add-screen"><section class="start-existing-search" aria-labelledby="start-existing-search-title"><h1 id="start-existing-search-title">Найти в коллекции</h1><label class="start-search-field"><span>Название элемента</span><input type="search" value="${escapeHTML(state.startElementSearch)}" data-start-element-search autocomplete="off" placeholder="Начните вводить название" autofocus></label>${results ? `<div class="start-search-results">${results}</div>` : ''}</section></div></main>${manualConversionConfirmationMarkup()}</section>`;
      }
      if (state.appStage === 'rename-collection') {
        const collection = activeStartCollection();
        if (!collection) return '';
        return `<section class="start-flow"><header class="start-flow-header centered-flow-header"><button class="start-flow-back" type="button" data-cancel-rename-start-collection aria-label="Назад">←</button><span class="start-flow-header-title">Переименование коллекции</span><span aria-hidden="true"></span></header><main class="start-flow-main"><form class="start-collection-form" data-rename-start-collection-form><h1>Новое название</h1><label><span>Название</span><input type="text" name="name" value="${escapeHTML(collection.name)}" maxlength="80" autocomplete="off" required autofocus></label><button class="primary-button" type="submit">Сохранить</button></form></main></section>`;
      }
      if (state.appStage === 'new-collection') {
        return `<section class="start-flow"><header class="start-flow-header centered-flow-header"><button class="start-flow-back" type="button" data-cancel-first-collection aria-label="Назад">←</button><span class="start-flow-header-title">Создание коллекции</span><span aria-hidden="true"></span></header><main class="start-flow-main"><form class="start-collection-form" data-first-collection-form><h1>Как назовём коллекцию?</h1><label><span>Название</span><input type="text" name="name" value="${escapeHTML(state.firstCollectionName)}" maxlength="80" autocomplete="off" placeholder="Например, Фильмы" required autofocus></label><button class="primary-button" type="submit">Создать</button></form></main></section>`;
      }
      if (state.appStage === 'collections') {
        const rows = state.startCollections.map(collection => {
          const selectionCount = collection.selections.filter(selection => !selection.system).length;
          return `<button class="start-collection-row" type="button" data-open-start-collection="${collection.id}"><span><strong>${escapeHTML(collection.name)}</strong><small>${pluralSelections(selectionCount)}</small></span><span aria-hidden="true">›</span></button>`;
        }).join('');
        const breadcrumbs = startBreadcrumbsMarkup([{ label: 'Коллекции', href: startingFlowURL('collections') }]);
        return `<section class="start-flow"><header class="start-flow-header centered-flow-header">${startBrandMarkup()}<button class="icon-button" type="button" data-start-next-collection aria-label="Создать коллекцию">+</button></header><main class="start-flow-main list-screen">${breadcrumbs}<div class="start-collections"><h1>Коллекции</h1><div class="start-collections-list">${rows}</div></div></main></section>`;
      }
      if (state.appStage === 'collection' || state.appStage === 'collection-empty') {
        const collection = activeStartCollection();
        if (!collection) return '';
        const menu = state.startCollectionMenuOpen ? `<div class="start-collection-menu"><button type="button" data-start-new-selection>Добавить подборку</button><button type="button" data-rename-start-collection>Переименовать коллекцию</button><button class="danger" type="button" data-request-delete-start-collection="${collection.id}">Удалить коллекцию</button></div>` : '';
        const pendingDelete = state.startCollections.find(item => item.id === state.pendingStartCollectionDeleteId);
        const confirmation = pendingDelete ? `<div class="start-delete-confirm" role="alertdialog" aria-modal="true" aria-labelledby="start-delete-title"><strong id="start-delete-title">Удалить «${escapeHTML(pendingDelete.name)}»?</strong><p>Коллекция и всё внутри неё будут удалены.</p><div class="start-delete-actions"><button class="filter-delete-cancel" type="button" data-cancel-delete-start-collection>Отмена</button><button class="filter-delete-submit" type="button" data-confirm-delete-start-collection="${pendingDelete.id}">Удалить</button></div></div>` : '';
        const selectionRow = selection => {
          const count = elementsForStartSelection(collection, selection).length;
          const rule = selection.mode === 'manual' ? 'состав задан вручную' : selection.tags.length ? selection.tags.map(tag => `#${tag}`).join(' · ') : 'без условий';
          return `<button class="start-selection-row ${selection.mode === 'manual' ? 'start-manual-row' : ''}" type="button" data-open-start-selection="${selection.id}"><span><span class="start-selection-name-line"><strong>${escapeHTML(selection.name)}</strong>${manualBadgeMarkup(selection)}</span><small>${pluralElements(count)} · ${escapeHTML(rule)}</small></span><span aria-hidden="true">›</span></button>`;
        };
        const automaticRows = collection.selections.filter(selection => !selection.system && selection.mode !== 'manual').map(selectionRow).join('');
        const manualRows = collection.selections.filter(selection => !selection.system && selection.mode === 'manual').map(selectionRow).join('');
        const rows = `${automaticRows ? `<div class="start-selection-group"><p class="start-selection-group-label">Автоматические</p>${automaticRows}</div>` : ''}${manualRows ? `<div class="start-selection-group start-manual-group"><p class="start-selection-group-label">Ручные</p>${manualRows}</div>` : ''}`;
        const unassignedElements = unassignedStartElements(collection);
        const unassignedRow = unassignedElements.length ? `<button class="start-selection-row start-unassigned-row" type="button" data-open-start-selection="${START_UNASSIGNED_SELECTION_ID}"><span><strong>Без подборки</strong><small>${pluralElements(unassignedElements.length)} · не входят в подборки</small></span><span aria-hidden="true">›</span></button>` : '';
        const selectionList = `${rows}${unassignedRow}` || '<div class="start-selection-empty"><h2>Пока нет подборок</h2></div>';
        const breadcrumbs = startBreadcrumbsMarkup([
          { label: 'Коллекции', href: startingFlowURL('collections') },
          { label: collection.name, href: startingFlowURL(activeStartCollectionStage(), { collectionId: collection.id }) }
        ], `<button class="start-breadcrumb-add" type="button" data-start-new-selection aria-label="Добавить подборку" title="Добавить подборку">+</button>`);
        return `<section class="start-flow"><header class="start-flow-header collection-level-header"><button class="start-flow-back" type="button" data-open-start-collections aria-label="К списку коллекций">←</button><strong class="start-level-title start-context-title">Подборки из коллекции <span class="start-context-name">${escapeHTML(collection.name)}</span></strong><button class="start-collection-more" type="button" data-toggle-start-collection-menu aria-label="Действия с коллекцией «${escapeHTML(collection.name)}»" aria-expanded="${state.startCollectionMenuOpen}">⋯</button>${menu}</header><main class="start-flow-main list-screen">${breadcrumbs}<div class="start-list-screen"><div class="start-collections-list">${selectionList}</div></div></main>${confirmation}</section>`;
      }
      if (state.appStage === 'selection') {
        const collection = activeStartCollection();
        const selection = activeStartSelection();
        if (!collection || !selection) return '';
        const selectionAction = selection.system ? '<span aria-hidden="true"></span>' : `<button class="start-collection-more" type="button" data-edit-start-selection aria-label="Редактировать подборку «${escapeHTML(selection.name)}»" title="Редактировать">✎</button>`;
        const elements = elementsForStartSelection(collection, selection);
        const rows = elements.map(element => `<button class="start-element-row" type="button" data-open-start-element="${element.id}"><span>${escapeHTML(element.title)}</span><span aria-hidden="true">›</span></button>`).join('');
        const tags = selection.tags.length ? `${selection.mode === 'manual' ? '<p class="start-selection-tags-label">Исходный фильтр</p>' : ''}<div class="start-selection-tags">${selection.tags.map(tag => `<span>#${escapeHTML(tag)}</span>`).join('')}</div>` : '';
        const emptyMessage = selection.derived === 'unassigned' ? 'Все элементы входят хотя бы в одну подборку.' : selection.system ? 'Добавьте первый элемент коллекции.' : 'Ни один элемент пока не соответствует фильтру.';
        const empty = `<div class="start-selection-empty"><h2>Пока здесь пусто</h2><p>${emptyMessage}</p></div>`;
        const breadcrumbs = startBreadcrumbsMarkup([
          { label: 'Коллекции', href: startingFlowURL('collections') },
          { label: collection.name, href: startingFlowURL(activeStartCollectionStage(), { collectionId: collection.id }) },
          { label: selection.name, href: startingFlowURL('selection', { collectionId: collection.id, selectionId: selection.id }) }
        ]);
        const addLabel = selection.system ? 'Добавить в коллекцию' : 'Добавить в подборку';
        const manualNote = selection.mode === 'manual' ? '<p class="start-manual-note">Состав задан вручную и не обновляется по фильтру.</p>' : '';
        return `<section class="start-flow"><header class="start-flow-header centered-flow-header"><button class="start-flow-back" type="button" data-open-start-parent-collection aria-label="К подборкам коллекции">←</button><span class="start-flow-header-title start-context-title">Подборка <span class="start-context-name">${escapeHTML(selection.name)}</span> из коллекции <span class="start-context-name">${escapeHTML(collection.name)}</span></span>${selectionAction}</header><main class="start-flow-main list-screen">${breadcrumbs}<div class="start-list-screen"><div class="start-list-head"><div class="start-list-title-copy"><div class="start-selection-title-line"><h1>${escapeHTML(selection.name)}</h1>${manualBadgeMarkup(selection)}</div><small>${pluralElements(elements.length)}</small></div><button class="start-context-add" type="button" data-start-first-element>${addLabel}</button></div>${manualNote}${tags}${elements.length ? `<div class="start-elements-list">${rows}</div>` : empty}</div></main></section>`;
      }
      if (state.appStage === 'element') {
        const collection = activeStartCollection();
        const selection = activeStartSelection();
        const element = activeStartElement();
        if (!collection || !selection || !element) return '';
        const breadcrumbs = startBreadcrumbsMarkup([
          { label: 'Коллекции', href: startingFlowURL('collections') },
          { label: collection.name, href: startingFlowURL(activeStartCollectionStage(), { collectionId: collection.id }) },
          { label: selection.name, href: startingFlowURL('selection', { collectionId: collection.id, selectionId: selection.id }) },
          { label: element.title, href: startingFlowURL('element', { collectionId: collection.id, selectionId: selection.id, elementId: element.id }) }
        ]);
        const tags = element.tags.length ? element.tags.map(tag => `#${escapeHTML(tag)}`).join(' · ') : 'Теги пока не добавлены';
        const removeFromSelection = !selection.system ? `<button class="start-selection-remove" type="button" data-remove-start-element-from-selection="${escapeHTML(element.id)}">Убрать из подборки</button>` : '';
        return `<section class="start-flow"><header class="start-flow-header centered-flow-header"><button class="start-flow-back" type="button" data-open-start-parent-selection aria-label="К элементам подборки">←</button><span class="start-flow-header-title">${escapeHTML(element.title)}</span><button class="start-collection-more" type="button" data-edit-start-element aria-label="Редактировать элемент «${escapeHTML(element.title)}»" title="Редактировать">✎</button></header><main class="start-flow-main list-screen">${breadcrumbs}<div class="start-list-screen"><article class="start-element-detail"><p class="eyebrow">Элемент</p><h1>${escapeHTML(element.title)}</h1><p>${tags}</p>${removeFromSelection}</article></div></main>${manualConversionConfirmationMarkup()}</section>`;
      }
      return `<section class="start-flow"><header class="start-flow-header centered-flow-header">${startBrandMarkup()}<span aria-hidden="true"></span></header><main class="start-flow-main"><div class="start-flow-card"><div class="start-empty-mark" aria-hidden="true"><span></span><span></span><span>К</span></div><h1>Пока нет коллекций</h1><button class="primary-button large" type="button" data-start-first-collection>Создать коллекцию</button></div></main></section>`;
    }

    function syncStartingFlowRoute() {
      const url = new URL(location.href);
      url.search = '';
      if (state.appStage !== 'empty') url.searchParams.set('stage', state.appStage);
      if (state.startCollections.length) url.searchParams.set('collections', JSON.stringify(state.startCollections));
      if (state.activeStartCollectionId) url.searchParams.set('activeCollection', state.activeStartCollectionId);
      if (['selection', 'edit-selection', 'element', 'edit-element', 'new-element', 'search'].includes(state.appStage) && state.activeStartSelectionId) url.searchParams.set('activeSelection', state.activeStartSelectionId);
      if (['element', 'edit-element', 'search'].includes(state.appStage) && state.activeStartElementId) url.searchParams.set('activeElement', state.activeStartElementId);
      if (state.appStage === 'search') {
        url.searchParams.set('searchOrigin', state.startSearchReturnStage);
        if (state.startSearchQuery) url.searchParams.set('searchTags', state.startSearchQuery);
        if (state.startSearchGlobal) url.searchParams.set('searchGlobal', '1');
      }
      history.replaceState({}, '', url);
    }

    function beginStartSearch() {
      if (state.appStage === 'search') return;
      state.startSearchReturnStage = state.appStage;
      state.startSearchQuery = '';
      state.startSearchGlobal = !startSearchScope().contextual;
      state.startCollectionMenuOpen = false;
      state.appStage = 'search';
      syncStartingFlowRoute();
      render();
    }

    function closeStartSearch() {
      state.appStage = startSearchOriginStages.includes(state.startSearchReturnStage) ? state.startSearchReturnStage : activeStartCollectionStage();
      syncStartingFlowRoute();
      render();
    }

    function beginStartCollectionCreation(returnStage) {
      state.startReturnStage = returnStage;
      state.firstCollectionName = '';
      state.startCollectionMenuOpen = false;
      state.pendingStartCollectionDeleteId = null;
      state.appStage = 'new-collection';
      syncStartingFlowRoute();
      render();
    }

    function beginStartSelectionCreation() {
      if (!activeStartCollection()) return;
      state.startSelectionName = '';
      state.startSelectionTags = '';
      state.startSelectionMode = 'automatic';
      state.startCollectionMenuOpen = false;
      state.appStage = 'new-selection';
      syncStartingFlowRoute();
      render();
    }

    function deleteStartSelection(id) {
      const collection = activeStartCollection();
      const index = collection?.selections.findIndex(item => item.id === id && !item.system) ?? -1;
      if (!collection || index < 0) return;
      collection.selections.splice(index, 1);
      state.activeStartSelectionId = collection.selections.find(item => item.system)?.id || null;
      state.activeStartElementId = null;
      state.startSelectionName = '';
      state.startSelectionTags = '';
      state.pendingStartSelectionDeleteId = null;
      state.pendingStartSelectionFilterChange = null;
      state.appStage = activeStartCollectionStage();
      syncStartingFlowRoute();
      render();
    }

    function applyStartSelectionChange(selection, name, tags) {
      selection.name = name;
      if (selection.mode !== 'manual') selection.tags = [...tags];
      state.startSelectionName = '';
      state.startSelectionTags = '';
      state.pendingStartSelectionDeleteId = null;
      state.pendingStartSelectionFilterChange = null;
      state.appStage = 'selection';
      syncStartingFlowRoute();
      render();
    }

    function convertStartSelectionToManual() {
      const collection = activeStartCollection();
      const selection = activeStartSelection();
      const pending = state.pendingStartManualConversion;
      if (!collection || !selection || selection.system || selection.mode === 'manual' || !pending || pending.selectionId !== selection.id) return;
      const memberIds = elementsForStartSelection(collection, selection).map(element => element.id);
      if (pending.action === 'add' && !memberIds.includes(pending.elementId)) memberIds.push(pending.elementId);
      if (pending.action === 'remove') memberIds.splice(0, memberIds.length, ...memberIds.filter(id => id !== pending.elementId));
      selection.mode = 'manual';
      selection.originTags = [...selection.tags];
      selection.memberIds = memberIds;
      state.pendingStartManualConversion = null;
      if (pending.action === 'remove') {
        state.activeStartElementId = null;
        state.appStage = 'selection';
      }
      syncStartingFlowRoute();
      render();
      showToast('Подборка стала ручной');
    }

    function deleteStartCollection(id) {
      const index = state.startCollections.findIndex(item => item.id === id);
      if (index < 0) return;
      state.startCollections.splice(index, 1);
      state.startCollectionMenuOpen = false;
      state.pendingStartCollectionDeleteId = null;
      if (!state.startCollections.length) {
        state.activeStartCollectionId = null;
        state.activeStartSelectionId = null;
        state.activeStartElementId = null;
        state.appStage = 'empty';
      } else {
        state.activeStartCollectionId = state.startCollections[0].id;
        state.activeStartSelectionId = state.startCollections[0].selections[0]?.id || null;
        state.activeStartElementId = null;
        state.appStage = 'collections';
      }
      syncStartingFlowRoute();
      render();
    }

    function focusStartingFlowPrimaryField() {
      const selector = state.appStage === 'new-collection'
        ? '[data-first-collection-form] [name="name"]'
        : state.appStage === 'search'
          ? '[data-start-search-tags]'
        : state.appStage === 'new-selection'
          ? '[data-new-start-selection-form] [name="name"]'
          : state.appStage === 'edit-selection'
            ? '[data-edit-start-selection-form] [name="name"]'
          : state.appStage === 'edit-element'
            ? '[data-edit-start-element-form] [name="title"]'
          : state.appStage === 'new-element'
            ? activeStartSelection()?.system
              ? '[data-new-start-element-form] [name="title"]'
              : '[data-start-element-search]'
            : null;
      if (selector) requestAnimationFrame(() => document.querySelector(selector)?.focus());
    }

    function renderStartingFlow() {
      document.body.dataset.stage = state.appStage;
      document.body.dataset.variant = 'A';
      document.body.dataset.integration = 'C';
      document.body.classList.remove('duel-open', 'glossary-open', 'collection-open', 'filter-open', 'object-detail-open', 'priorities-open');
      [duelBackdrop, glossaryBackdrop, collectionBackdrop, filterBackdrop, priorityBackdrop, objectDetailBackdrop].forEach(backdrop => {
        backdrop.classList.remove('open');
        backdrop.setAttribute('aria-hidden', 'true');
        backdrop.innerHTML = '';
      });
      app.innerHTML = `${startingFlowMarkup()}${startBottomNavigationMarkup()}`;
      focusStartingFlowPrimaryField();
      stateOutput.textContent = JSON.stringify({ appStage: state.appStage, activeCollectionId: state.activeStartCollectionId, activeSelectionId: state.activeStartSelectionId, activeElementId: state.activeStartElementId, search: { returnStage: state.startSearchReturnStage, query: state.startSearchQuery, global: state.startSearchGlobal }, collections: state.startCollections }, null, 2);
    }

    function render() {
      if (state.appStage !== 'workspace') {
        renderStartingFlow();
        return;
      }
      document.body.dataset.stage = 'workspace';
      document.body.dataset.variant = 'A';
      document.body.dataset.integration = 'C';
      app.innerHTML = renderVariantA();
      renderDuel();
      renderGlossary();
      renderCollections();
      renderFilterPanel();
      renderPriorityPanel();
      renderObjectDetail();
      renderState();
      wireDragAndDrop();
      wireSavedFilterDragAndDrop();
      wirePointerReorder('.order-drag-handle', '[data-order-id]', 'orderId', moveRelative);
      wirePointerReorder('.filter-drag-handle', '[data-saved-filter-id]', 'savedFilterId', moveSavedFilterRelative);
    }

    function setFilter(id) {
      const source = savedFilters.find(filter => filter.id === id);
      if (!source) return;
      state.activeFilterId = id;
      state.currentFilter = currentFilterFrom(source);
      state.draftOrders.current = [...state.draftOrders[source.id]];
      state.draftUnordered.current = [...state.draftUnordered[source.id]];
      state.taskProgress.current = state.taskProgress[source.id] ?? null;
      state.maxRemainingComparisons.current = state.maxRemainingComparisons[source.id] ?? 0;
      state.priorityReviewRemaining.current = state.priorityReviewRemaining[source.id] ?? 0;
      state.equalGroups.current = (state.equalGroups[source.id] || []).map(group => [...group]);
      state.taskVersions.current = state.taskVersions[source.id] ? { ...state.taskVersions[source.id], objectIds: [...state.taskVersions[source.id].objectIds] } : null;
      state.priorityDecisionHistory.current = [...(state.priorityDecisionHistory[source.id] || [])];
      state.duel.pairIndex = 0;
      state.filterEditorOpen = false;
      state.newFilterIntent = false;
      state.filterTagQuery = '';
      state.expandedTags = false;
      state.filterPanelOpen = false;
      state.filterActionMenuId = null;
      state.pendingDeleteFilterId = null;
      state.priorityPanelOpen = false;
      state.priorityReviewConfirmation = false;
      state.priorityResultOpen = false;
      render();
    }

    function toggleFilterOrder() {
      if (state.filterOrderMode === 'activity') {
        state.filterOrder = orderedSavedFilters().map(filter => filter.id);
        state.filterOrderMode = 'pinned';
        showToast('Порядок сохранённых фильтров закреплён');
      } else {
        state.filterOrderMode = 'activity';
        showToast('Автоматический порядок по активности включён');
      }
      render();
    }

    function ensurePinnedFilterOrder() {
      if (state.filterOrderMode === 'pinned') return;
      state.filterOrder = orderedSavedFilters().map(filter => filter.id);
      state.filterOrderMode = 'pinned';
    }

    function reorderRelative(order, id, targetId, after = false) {
      if (id === targetId) return false;
      const from = order.indexOf(id);
      if (from < 0 || !order.includes(targetId)) return false;
      const [moved] = order.splice(from, 1);
      const target = order.indexOf(targetId);
      order.splice(target + (after ? 1 : 0), 0, moved);
      return true;
    }

    function moveSavedFilterRelative(id, targetId, after = false) {
      if (id === targetId) return;
      ensurePinnedFilterOrder();
      if (!reorderRelative(state.filterOrder, id, targetId, after)) return;
      showToast('Перетаскивание закрепило новый порядок фильтров');
      render();
    }

    function sameTags(left, right) {
      return left.length === right.length && left.every(tag => right.includes(tag));
    }

    function filterDiffersFromSource(filter, source) {
      if (!source) return true;
      const nameVisibilityDiffers = Boolean(filter.showName) !== Boolean(source.showName);
      const visibleNameDiffers = Boolean(filter.showName) && filter.name !== source.name;
      return !sameTags(filter.tags, source.tags) || nameVisibilityDiffers || visibleNameDiffers;
    }

    function renameCurrentFilter(value) {
      const filter = activeFilter();
      const source = savedFilters.find(item => item.id === filter.sourceId);
      if (!source) return;
      const name = value.trim();
      filter.showName = Boolean(name);
      filter.name = name || (sameTags(filter.tags, source.tags) ? source.name : 'Несохранённый фильтр');
      filter.dirty = filterDiffersFromSource(filter, source);
    }

    function startNewFilter() {
      const filter = activeFilter();
      if (!filter.dirty) {
        const source = savedFilters.find(item => item.system);
        if (!source) return;
        state.activeFilterId = source.id;
        state.currentFilter = currentFilterFrom(source);
        state.draftOrders.current = [...state.draftOrders[source.id]];
        state.draftUnordered.current = [...state.draftUnordered[source.id]];
        state.taskProgress.current = state.taskProgress[source.id] ?? null;
        state.maxRemainingComparisons.current = state.maxRemainingComparisons[source.id] ?? 0;
        state.priorityReviewRemaining.current = state.priorityReviewRemaining[source.id] ?? 0;
        state.equalGroups.current = (state.equalGroups[source.id] || []).map(group => [...group]);
        state.taskVersions.current = state.taskVersions[source.id] ? { ...state.taskVersions[source.id], objectIds: [...state.taskVersions[source.id].objectIds] } : null;
        state.priorityDecisionHistory.current = [...(state.priorityDecisionHistory[source.id] || [])];
      }
      state.filterActionMenuId = null;
      state.pendingDeleteFilterId = null;
      state.filterPanelOpen = false;
      state.filterEditorOpen = true;
      state.newFilterIntent = true;
      state.filterTagQuery = '';
      render();
      requestAnimationFrame(() => document.querySelector('[data-current-filter-name]')?.focus());
    }

    function toggleFilterActionMenu(id) {
      const filter = savedFilters.find(item => item.id === id && !item.system);
      if (!filter) return;
      state.pendingDeleteFilterId = null;
      state.filterActionMenuId = state.filterActionMenuId === id ? null : id;
      render();
    }

    function requestDeleteFilter(id) {
      const filter = savedFilters.find(item => item.id === id && !item.system);
      if (!filter) return;
      state.filterActionMenuId = null;
      state.pendingDeleteFilterId = id;
      render();
    }

    function deleteSavedFilter(id) {
      const index = savedFilters.findIndex(item => item.id === id && !item.system);
      if (index < 0) return;
      const [deletedFilter] = savedFilters.splice(index, 1);
      const current = activeFilter();
      const deletedCurrentSource = current.sourceId === id;
      state.filterOrder = state.filterOrder.filter(filterId => filterId !== id);
      ['draftOrders', 'draftUnordered', 'taskProgress', 'maxRemainingComparisons', 'priorityReviewRemaining', 'equalGroups', 'taskVersions', 'priorityDecisionHistory'].forEach(key => delete state[key][id]);
      if (deletedCurrentSource) {
        const all = savedFilters.find(item => item.system);
        state.activeFilterId = all.id;
        current.sourceId = all.id;
        current.dirty = filterDiffersFromSource(current, all);
        state.newFilterIntent = false;
      }
      state.filterActionMenuId = null;
      state.pendingDeleteFilterId = null;
      render();
      showToast(`Фильтр «${deletedFilter.name}» удалён`);
    }

    function saveCurrentFilter() {
      const filter = activeFilter();
      if (!filter.dirty) {
        showToast('Укажите название или добавьте тег');
        return;
      }
      let suffix = savedFilters.length;
      while (savedFilters.some(item => item.id === `custom-${suffix}`)) suffix += 1;
      const id = `custom-${suffix}`;
      const saved = {
        id,
        name: filter.name,
        showName: Boolean(filter.showName),
        tags: [...filter.tags],
        objectIds: [...filter.objectIds],
        unorderedIds: [...state.draftUnordered[filter.id]],
        maxRemainingComparisons: state.maxRemainingComparisons[filter.id] ?? 0,
        activity: Math.min(100, Math.max(0, ...userSavedFilters().map(item => item.activity)) + 1),
        task: filter.task ? { ...filter.task } : null,
        result: filter.result && filter.result.objectIds.length === filter.objectIds.length && filter.result.objectIds.every(objectId => filter.objectIds.includes(objectId)) ? { ...filter.result, objectIds: [...filter.result.objectIds] } : null
      };
      savedFilters.push(saved);
      state.activeFilterId = id;
      state.filterOrder.push(id);
      state.draftOrders[id] = [...state.draftOrders[filter.id]];
      state.draftUnordered[id] = [...state.draftUnordered[filter.id]];
      state.taskProgress[id] = state.taskProgress[filter.id] ?? null;
      state.maxRemainingComparisons[id] = state.maxRemainingComparisons[filter.id] ?? 0;
      state.priorityReviewRemaining[id] = state.priorityReviewRemaining[filter.id] ?? 0;
      state.equalGroups[id] = equalGroupsFor(filter).map(group => [...group]);
      state.taskVersions[id] = taskVersionFor(filter) ? { ...taskVersionFor(filter), objectIds: [...taskVersionFor(filter).objectIds] } : null;
      state.priorityDecisionHistory[id] = [...state.priorityDecisionHistory[filter.id]];
      state.currentFilter = currentFilterFrom(saved);
      state.draftOrders.current = [...state.draftOrders[id]];
      state.draftUnordered.current = [...state.draftUnordered[id]];
      state.taskProgress.current = state.taskProgress[id];
      state.maxRemainingComparisons.current = state.maxRemainingComparisons[id];
      state.priorityReviewRemaining.current = state.priorityReviewRemaining[id];
      state.equalGroups.current = state.equalGroups[id].map(group => [...group]);
      state.taskVersions.current = state.taskVersions[id] ? { ...state.taskVersions[id], objectIds: [...state.taskVersions[id].objectIds] } : null;
      state.priorityDecisionHistory.current = [...state.priorityDecisionHistory[id]];
      state.filterEditorOpen = false;
      state.newFilterIntent = false;
      state.filterActionMenuId = null;
      state.pendingDeleteFilterId = null;
      render();
      showToast(`Фильтр «${saved.name}» сохранён`);
    }

    function syncCurrentDraftToSource() {
      const filter = activeFilter();
      if (filter.dirty) return;
      state.draftOrders[filter.sourceId] = [...state.draftOrders[filter.id]];
      state.draftUnordered[filter.sourceId] = [...state.draftUnordered[filter.id]];
      state.maxRemainingComparisons[filter.sourceId] = state.maxRemainingComparisons[filter.id] ?? 0;
      const source = savedFilters.find(item => item.id === filter.sourceId);
      if (source) {
        source.unorderedIds = [...state.draftUnordered[filter.id]];
        source.maxRemainingComparisons = state.maxRemainingComparisons[filter.id] ?? 0;
      }
    }

    function projectCompletedOrderToSavedFilters(filter) {
      const completedIds = new Set(filter.objectIds);
      const completedOrder = (state.draftOrders[filter.id] || []).filter(id => completedIds.has(id));
      if (completedOrder.length !== completedIds.size) return;
      const completedEqualGroups = equalGroupsFor(filter);

      savedFilters.forEach(target => {
        if (!target.objectIds.every(id => completedIds.has(id))) return;
        const targetIds = new Set(target.objectIds);
        const projectedOrder = completedOrder.filter(id => targetIds.has(id));
        if (projectedOrder.length !== targetIds.size) return;
        state.draftOrders[target.id] = projectedOrder;
        state.draftUnordered[target.id] = [];
        state.maxRemainingComparisons[target.id] = 0;
        state.equalGroups[target.id] = completedEqualGroups
          .map(group => group.filter(id => targetIds.has(id)))
          .filter(group => group.length > 1);
        if (state.taskProgress[target.id] != null) state.taskProgress[target.id] = 100;
        target.unorderedIds = [];
        target.maxRemainingComparisons = 0;
      });

      state.draftUnordered[filter.id] = [];
      state.maxRemainingComparisons[filter.id] = 0;
      if (state.taskProgress[filter.id] != null) state.taskProgress[filter.id] = 100;
      filter.unorderedIds = [];
    }

    function toggleActiveFilterTag(tag) {
      const filter = activeFilter();
      const wasDirty = filter.dirty;
      filter.tags = filter.tags.includes(tag) ? filter.tags.filter(value => value !== tag) : [...filter.tags, tag];
      const source = savedFilters.find(item => item.id === filter.sourceId);
      filter.dirty = filterDiffersFromSource(filter, source);
      if (!filter.dirty) {
        filter.name = source.name;
        filter.showName = Boolean(source.showName);
      } else if (!wasDirty && !filter.showName) {
        filter.name = 'Несохранённый фильтр';
        filter.showName = false;
      }
      if (!filter.dirty) {
        filter.objectIds = [...source.objectIds];
        filter.unorderedIds = [...source.unorderedIds];
        filter.task = source.task ? { ...source.task } : null;
        filter.result = source.result ? { ...source.result, objectIds: [...source.result.objectIds] } : null;
        state.draftOrders[filter.id] = [...state.draftOrders[source.id]];
        state.draftUnordered[filter.id] = [...state.draftUnordered[source.id]];
        state.taskProgress[filter.id] = state.taskProgress[source.id] ?? null;
        state.maxRemainingComparisons[filter.id] = state.maxRemainingComparisons[source.id] ?? 0;
        state.priorityReviewRemaining[filter.id] = state.priorityReviewRemaining[source.id] ?? 0;
        state.equalGroups[filter.id] = (state.equalGroups[source.id] || []).map(group => [...group]);
        state.taskVersions[filter.id] = state.taskVersions[source.id] ? { ...state.taskVersions[source.id], objectIds: [...state.taskVersions[source.id].objectIds] } : null;
        state.priorityDecisionHistory[filter.id] = [...(state.priorityDecisionHistory[source.id] || [])];
        state.expandedTags = false;
        showToast('Текущий фильтр снова совпадает с исходным');
        render();
        return;
      }
      const newIds = objects.filter(item => filter.tags.every(value => item.tags.includes(value))).map(item => item.id);
      const previousOrdered = state.draftOrders[filter.id] ?? [];
      const nextOrdered = previousOrdered.filter(id => newIds.includes(id));
      const nextUnordered = newIds.filter(id => !nextOrdered.includes(id));
      filter.objectIds = newIds;
      if (newIds.length <= 1) {
        state.draftOrders[filter.id] = [...newIds];
        state.draftUnordered[filter.id] = [];
      } else {
        state.draftOrders[filter.id] = nextOrdered;
        state.draftUnordered[filter.id] = nextUnordered;
      }
      filter.unorderedIds = [...state.draftUnordered[filter.id]];
      filter.task = null;
      state.taskProgress[filter.id] = null;
      state.priorityReviewRemaining[filter.id] = 0;
      state.taskVersions[filter.id] = null;
      state.priorityDecisionHistory[filter.id] = [];
      state.equalGroups[filter.id] = equalGroupsFor(filter).map(group => group.filter(id => newIds.includes(id))).filter(group => group.length > 1);
      state.maxRemainingComparisons[filter.id] = estimateRemainingComparisonUpperBound(filter.objectIds, state.draftUnordered[filter.id]);
      state.expandedTags = false;
      showToast('Текущий фильтр изменён; прежнее сравнение осталось у прежней версии среза');
      render();
    }

    function moveOrdered(id, direction) {
      const order = state.draftOrders[activeFilter().id];
      const index = order.indexOf(Number(id));
      const target = Math.max(0, Math.min(order.length - 1, index + Number(direction)));
      if (index < 0 || index === target) return;
      const [moved] = order.splice(index, 1);
      order.splice(target, 0, moved);
      syncCurrentDraftToSource();
      showToast('Черновая расстановка изменена');
      render();
    }

    function moveRelative(id, targetId, after = false) {
      const order = state.draftOrders[activeFilter().id];
      if (!reorderRelative(order, Number(id), Number(targetId), after)) return;
      syncCurrentDraftToSource();
      showToast('Черновая расстановка изменена');
      render();
    }

    function placeUnordered(id) {
      const numericId = Number(id);
      const filterId = activeFilter().id;
      const unordered = state.draftUnordered[filterId];
      const index = unordered.indexOf(numericId);
      if (index < 0) return;
      unordered.splice(index, 1);
      state.draftOrders[filterId].push(numericId);
      state.maxRemainingComparisons[filterId] = estimateRemainingComparisonUpperBound(activeFilter().objectIds, unordered);
      syncCurrentDraftToSource();
      showToast('Объект добавлен в черновую расстановку');
      render();
    }

    function wireDragAndDrop() {
      document.querySelectorAll('[data-order-id]').forEach(card => {
        card.addEventListener('dragstart', event => {
          draggedId = Number(card.dataset.orderId);
          card.classList.add('is-dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', String(draggedId));
        });
        card.addEventListener('dragend', () => { draggedId = null; card.classList.remove('is-dragging'); });
        card.addEventListener('dragover', event => { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; });
        card.addEventListener('drop', event => {
          event.preventDefault();
          const bounds = card.getBoundingClientRect();
          const after = state.variant === 'A' && event.clientY > bounds.top + bounds.height / 2;
          if (draggedId != null) moveRelative(draggedId, Number(card.dataset.orderId), after);
        });
      });
    }

    function wireSavedFilterDragAndDrop() {
      document.querySelectorAll('[data-saved-filter-id]').forEach(row => {
        row.addEventListener('dragstart', event => {
          draggedSavedFilterId = row.dataset.savedFilterId;
          row.classList.add('is-dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', draggedSavedFilterId);
        });
        row.addEventListener('dragend', () => { draggedSavedFilterId = null; row.classList.remove('is-dragging'); });
        row.addEventListener('dragover', event => { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; });
        row.addEventListener('drop', event => {
          event.preventDefault();
          const bounds = row.getBoundingClientRect();
          if (draggedSavedFilterId != null) moveSavedFilterRelative(draggedSavedFilterId, row.dataset.savedFilterId, event.clientY > bounds.top + bounds.height / 2);
        });
      });
    }

    function wirePointerReorder(handleSelector, rowSelector, dataKey, onDrop) {
      document.querySelectorAll(handleSelector).forEach(handle => {
        handle.addEventListener('pointerdown', event => {
          if (event.pointerType === 'mouse' && event.button !== 0) return;
          const row = handle.closest(rowSelector);
          if (!row) return;
          event.preventDefault();
          handle.setPointerCapture(event.pointerId);
          const startY = event.clientY;
          const scrollArea = row.closest('.a-filter-list, .a-order');
          let targetRow = null;
          let after = false;
          let moved = false;
          row.classList.add('is-dragging');
          row.style.position = 'relative';
          row.style.zIndex = '2';

          const update = moveEvent => {
            const delta = moveEvent.clientY - startY;
            moved ||= Math.abs(delta) > 5;
            row.style.transform = `translateY(${delta}px)`;
            if (scrollArea) {
              const scrollBounds = scrollArea.getBoundingClientRect();
              if (moveEvent.clientY < scrollBounds.top + 48) scrollArea.scrollTop -= 14;
              else if (moveEvent.clientY > scrollBounds.bottom - 48) scrollArea.scrollTop += 14;
            }
            targetRow?.classList.remove('drag-target');
            const candidates = [...document.querySelectorAll(rowSelector)].filter(candidate => candidate !== row);
            targetRow = candidates.reduce((nearest, candidate) => {
              const center = candidate.getBoundingClientRect().top + candidate.getBoundingClientRect().height / 2;
              const distance = Math.abs(moveEvent.clientY - center);
              return !nearest || distance < nearest.distance ? { candidate, center, distance } : nearest;
            }, null)?.candidate ?? null;
            if (targetRow) {
              const bounds = targetRow.getBoundingClientRect();
              after = moveEvent.clientY > bounds.top + bounds.height / 2;
              targetRow.classList.add('drag-target');
            }
          };

          const finish = finishEvent => {
            handle.removeEventListener('pointermove', update);
            handle.removeEventListener('pointerup', finish);
            handle.removeEventListener('pointercancel', finish);
            targetRow?.classList.remove('drag-target');
            row.classList.remove('is-dragging');
            row.style.removeProperty('position');
            row.style.removeProperty('z-index');
            row.style.removeProperty('transform');
            if (handle.hasPointerCapture(finishEvent.pointerId)) handle.releasePointerCapture(finishEvent.pointerId);
            if (moved && targetRow) {
              suppressNextClick = true;
              setTimeout(() => { suppressNextClick = false; }, 0);
              onDrop(row.dataset[dataKey], targetRow.dataset[dataKey], after);
            }
          };

          handle.addEventListener('pointermove', update);
          handle.addEventListener('pointerup', finish);
          handle.addEventListener('pointercancel', finish);
        });
      });
    }

    document.addEventListener('click', event => {
      if (suppressNextClick) { event.preventDefault(); suppressNextClick = false; return; }
      const objectCard = event.target.closest('[data-open-object-id]');
      if (objectCard && !event.target.closest('.drag-handle')) {
        openObjectDetail(objectCard.dataset.openObjectId);
        return;
      }
      const target = event.target.closest('button');
      if (state.startCollectionMenuOpen && !event.target.closest('.start-collection-menu, [data-toggle-start-collection-menu]')) {
        state.startCollectionMenuOpen = false;
        if (!target) { render(); return; }
      }
      if (!target) return;
      if (target.matches('[data-copy-share-link]')) copyShareLink(target.dataset.copyShareLink);
      else if (target.matches('[data-open-start-search]')) beginStartSearch();
      else if (target.matches('[data-cancel-start-search]')) closeStartSearch();
      else if (target.matches('[data-open-start-search-element]')) {
        const collection = state.startCollections.find(item => item.id === target.dataset.searchCollectionId);
        const selectionId = target.dataset.searchSelectionId || 'all';
        const selection = selectionId === START_UNASSIGNED_SELECTION_ID
          ? { id: START_UNASSIGNED_SELECTION_ID, derived: 'unassigned' }
          : collection?.selections.find(item => item.id === selectionId);
        const element = collection?.elements.find(item => item.id === target.dataset.openStartSearchElement);
        if (!collection || !selection || !element) return;
        state.activeStartCollectionId = collection.id;
        state.activeStartSelectionId = selectionId;
        state.activeStartElementId = element.id;
        state.appStage = 'element';
        syncStartingFlowRoute();
        render();
      }
      else if (target.matches('[data-start-first-collection]')) beginStartCollectionCreation('empty');
      else if (target.matches('[data-start-next-collection]')) beginStartCollectionCreation(state.appStage);
      else if (target.matches('[data-start-new-selection]')) beginStartSelectionCreation();
      else if (target.matches('[data-cancel-new-start-selection]')) {
        state.startSelectionName = '';
        state.startSelectionTags = '';
        state.startSelectionMode = 'automatic';
        state.appStage = activeStartCollectionStage();
        syncStartingFlowRoute();
        render();
      }
      else if (target.matches('[data-cancel-edit-start-selection]')) {
        state.startSelectionName = '';
        state.startSelectionTags = '';
        state.pendingStartSelectionDeleteId = null;
        state.pendingStartSelectionFilterChange = null;
        state.appStage = 'selection';
        syncStartingFlowRoute();
        render();
      }
      else if (target.matches('[data-cancel-edit-start-element]')) {
        state.startElementName = '';
        state.startElementTags = '';
        state.pendingStartElementDeleteId = null;
        state.appStage = 'element';
        syncStartingFlowRoute();
        render();
      }
      else if (target.matches('[data-start-first-element]')) {
        if (!activeStartCollection()) return;
        state.startElementName = '';
        state.startElementSearch = '';
        state.pendingStartManualConversion = null;
        state.startElementReturnStage = state.appStage === 'selection' ? 'selection' : activeStartCollectionStage();
        state.startCollectionMenuOpen = false;
        state.appStage = 'new-element';
        syncStartingFlowRoute();
        render();
      }
      else if (target.matches('[data-add-existing-start-element]')) {
        const collection = activeStartCollection();
        const selection = activeStartSelection();
        const element = collection?.elements.find(item => item.id === target.dataset.addExistingStartElement);
        if (!collection || !selection || selection.system || !element) return;
        if (selection.mode === 'manual') {
          if (!selection.memberIds.includes(element.id)) selection.memberIds.push(element.id);
          syncStartingFlowRoute();
          render();
          showToast('Добавлено в ручную подборку');
        } else {
          state.pendingStartManualConversion = { selectionId: selection.id, elementId: element.id, action: 'add' };
          render();
        }

      else if (target.matches('[data-cancel-new-start-element]')) {
        state.startElementName = '';
        state.startElementSearch = '';
        state.pendingStartManualConversion = null;
        state.appStage = state.startElementReturnStage;
        syncStartingFlowRoute();
        render();

          ? { id: START_UNASSIGNED_SELECTION_ID, name: 'Без подборки', tags: [], system: true, derived: 'unassigned' }
          : collection?.selections.find(item => item.id === target.dataset.openStartSelection);

      else if (target.matches('[data-remove-start-element-from-selection]')) {
        const selection = activeStartSelection();
        const elementId = target.dataset.removeStartElementFromSelection;
        if (!selection || selection.system || !elementsForStartSelection(activeStartCollection(), selection).some(element => element.id === elementId)) return;
        if (selection.mode === 'manual') {
