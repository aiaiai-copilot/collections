<!doctype html>
<!-- Manual selections use the neutral accented treatment selected in prototype round 48. -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PROTOTYPE — путь от пустого приложения к коллекции</title>
  <!-- Progressive product prototype: the default route starts with no collections; the dense sorting workspace is preserved at ?stage=workspace. -->
  <style>
    :root {
      --ink: #17201b;
      --muted: #657067;
      --paper: #f5f2ea;
      --panel: #fffdf8;
      --line: #d9ddd5;
      --green: #23684b;
      --green-2: #d8eadf;
      --lime: #dff26f;
      --peach: #f0c9af;
      --blue: #c9ddec;
      --blue-ink: #315d86;
      --red: #963d34;
      --red-2: #f9e7e3;
      --yellow: #f5de85;
      --shadow: 0 18px 55px rgba(27, 43, 34, .10);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 0 0, rgba(223, 242, 111, .22), transparent 28rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
    }

    button, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, select:focus-visible, summary:focus-visible, [data-open-object-id]:focus-visible {
      outline: 3px solid rgba(35, 104, 75, .32);
      outline-offset: 3px;
    }

    .prototype-page { min-height: 100vh; padding-bottom: 106px; }
    .eyebrow {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .muted { color: var(--muted); }
    .dot { padding: 0 .25em; color: #a3aaa4; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(28px, 4vw, 48px); line-height: .98; letter-spacing: -.045em; }
    h2 { margin-bottom: 7px; font-size: clamp(20px, 2.3vw, 30px); line-height: 1.05; letter-spacing: -.025em; }
    h3 { margin-bottom: 4px; font-size: 16px; }

    .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 850; }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: var(--ink);
      color: white;
      font-family: Georgia, serif;
      font-size: 19px;
    }

    .icon-button, .ghost-button, .soft-button, .primary-button, .dark-button {
      border: 0;
      border-radius: 13px;
      cursor: pointer;
      font-weight: 780;
      transition: transform .16s ease, background .16s ease, opacity .16s ease;
    }
    .icon-button:hover, .ghost-button:hover, .soft-button:hover, .primary-button:hover, .dark-button:hover { transform: translateY(-1px); }
    .icon-button { width: 38px; height: 38px; background: #eceee8; }
    .ghost-button { padding: 10px 13px; background: transparent; }
    .soft-button { padding: 10px 14px; background: #e9ece5; }
    .primary-button { padding: 12px 17px; background: var(--green); color: white; }
    .dark-button { padding: 12px 17px; background: var(--ink); color: white; }
    .primary-button.large, .dark-button.large { min-height: 52px; padding-inline: 22px; }

    /* Progressive start — deliberately limited to the first collection */
    body[data-stage]:not([data-stage="workspace"]) { background: #e7ebe4; }
    body[data-stage]:not([data-stage="workspace"]) .prototype-page { min-height: 100dvh; padding: 0; }
    body[data-stage]:not([data-stage="workspace"]) .state-debug { display: none; }
    .start-flow { position: relative; display: flex; width: min(460px, 100%); min-height: 100dvh; margin: 0 auto; flex-direction: column; background: var(--panel); box-shadow: 0 0 60px rgba(23,32,27,.14); }
    .start-flow-header { display: flex; min-height: 72px; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .start-flow-header .brand { flex: 1; }
    .start-flow-header .icon-button { margin-left: auto; font-size: 21px; }
    .collection-level-header { position: relative; display: grid; grid-template-columns: 38px minmax(0,1fr) 38px; }
    .collection-level-header .start-level-title { overflow: hidden; align-self: center; font-size: 14px; font-weight: 850; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .collection-level-header .start-level-title.start-context-title { overflow: visible; line-height: 1.2; overflow-wrap: anywhere; text-overflow: clip; white-space: normal; }
    .collection-level-header .start-collection-menu { top: 60px; right: 18px; }
    .centered-flow-header { display: grid; grid-template-columns: 38px minmax(0,1fr) 38px; }
    .centered-flow-header .start-flow-header-title { overflow: hidden; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .centered-flow-header .start-flow-header-title.start-context-title { overflow: visible; line-height: 1.2; overflow-wrap: anywhere; text-overflow: clip; white-space: normal; }
    .start-context-title { color: #69756d; font-weight: 700; }
    .start-context-name { padding: 1px 5px; border-radius: 6px; background: #e4ebe3; color: var(--ink); font-weight: 900; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .start-flow-back { width: 38px; height: 38px; border: 0; border-radius: 12px; background: #eceee8; cursor: pointer; font-size: 20px; }
    .start-flow-header-title { font-size: 14px; font-weight: 850; }
    .start-flow-main { display: grid; min-height: 0; padding: 28px 24px calc(94px + env(safe-area-inset-bottom)); flex: 1; place-items: center; }
    .start-flow-main.list-screen { display: block; overflow-y: auto; padding-top: 18px; }
    .start-bottom-nav { position: fixed; z-index: 45; bottom: 0; left: 50%; display: flex; width: min(460px, 100%); min-height: 68px; align-items: stretch; justify-content: space-between; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); transform: translateX(-50%); border-top: 1px solid #c8cec7; background: rgba(255,253,248,.97); box-shadow: 0 -8px 26px rgba(23,32,27,.10); backdrop-filter: blur(14px); }
    .start-bottom-nav button { display: grid; min-width: 88px; min-height: 54px; padding: 5px 10px; place-items: center; align-content: center; gap: 3px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; }
    .start-bottom-nav button:active { background: #e8ece6; }
    .start-bottom-nav button[aria-current="page"] { background: #e8ece6; }
    .start-bottom-nav-icon { display: grid; height: 22px; place-items: center; font-size: 20px; font-weight: 800; line-height: 1; }
    .start-bottom-nav-icon svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    .start-bottom-nav-label { color: var(--ink); font-size: 9px; font-weight: 850; line-height: 1; }
    body[data-stage]:not([data-stage="workspace"]) .start-delete-confirm { bottom: calc(78px + env(safe-area-inset-bottom)); }
    .start-flow-card { width: min(100%, 330px); text-align: center; }
    .start-flow-card h1 { margin-bottom: 22px; font-size: 34px; line-height: 1.03; }
    .start-flow-card .primary-button { width: 100%; min-height: 52px; }
    .start-empty-mark { position: relative; width: 96px; height: 92px; margin: 0 auto 28px; }
    .start-empty-mark span { position: absolute; width: 74px; height: 56px; border: 2px solid var(--ink); border-radius: 15px; background: var(--panel); }
    .start-empty-mark span:nth-child(1) { top: 2px; left: 2px; opacity: .24; transform: rotate(-8deg); }
    .start-empty-mark span:nth-child(2) { top: 16px; left: 12px; opacity: .5; transform: rotate(4deg); }
    .start-empty-mark span:nth-child(3) { top: 29px; left: 21px; display: grid; place-items: center; background: var(--ink); color: white; font-family: Georgia, serif; font-size: 25px; }
    .start-collection-form { display: grid; width: min(100%, 340px); gap: 20px; }
    .start-collection-form h1 { margin: 0; overflow-wrap: anywhere; font-size: 34px; }
    .start-collection-form label, .start-collection-form label span { display: block; }
    .start-collection-form label span { margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .start-collection-form input { width: 100%; padding: 14px 15px; border: 1px solid #bfc8bf; border-radius: 13px; background: white; color: var(--ink); font: inherit; font-size: 16px; outline: 0; }
    .start-collection-form input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(35,104,75,.14); }
    .start-collection-form .primary-button { min-height: 52px; }
    .start-edit-actions { display: grid; gap: 8px; }
    .start-edit-actions .primary-button { width: 100%; }
    .start-danger-button { min-height: 48px; border: 0; border-radius: 13px; background: var(--red-2); color: var(--red); cursor: pointer; font-weight: 850; }
    .start-form-help { margin: -13px 0 0; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .start-collection-empty { width: min(100%, 360px); align-self: start; }
    .start-collection-title-row { position: relative; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: start; margin-bottom: 34px; }
    .start-collection-title-row h1 { min-width: 0; margin: 0; overflow-wrap: anywhere; font-size: 36px; }
    .start-collection-more { width: 38px; height: 38px; border: 0; border-radius: 12px; background: #eceee8; cursor: pointer; font-size: 20px; }
    .start-collection-menu { position: absolute; z-index: 3; top: 44px; right: 0; display: grid; min-width: 160px; gap: 4px; padding: 5px; border: 1px solid #d8c9c5; border-radius: 11px; background: white; box-shadow: 0 10px 28px rgba(23,32,27,.18); }
    .start-collection-menu button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #edf0ea; color: var(--ink); cursor: pointer; font-size: 11px; font-weight: 850; text-align: left; }
    .start-collection-menu button.danger { background: var(--red-2); color: var(--red); }
    .start-collection-empty-state { padding: 34px 24px; border: 1px dashed #bdc7bd; border-radius: 20px; background: #f8faf5; text-align: center; }
    .start-collection-empty-state h2 { margin: 0; font-size: 20px; }
    .start-collection-empty-state .primary-button { width: 100%; margin-top: 20px; }
    .start-elements-list { display: grid; gap: 8px; }
    .start-element-row { display: grid; width: 100%; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: #f8faf5; cursor: pointer; font-size: 14px; font-weight: 800; overflow-wrap: anywhere; text-align: left; }
    .start-add-element { width: 100%; margin-top: 12px; }
    .start-selection-block { margin-bottom: 26px; }
    .start-selection-heading { margin-bottom: 10px; }
    .start-selection-heading h2 { margin: 0; font-size: 18px; }
    .start-selection-heading span { color: var(--muted); font-size: 10px; font-weight: 800; }
    .start-selection-row { display: grid; width: 100%; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 14px; border: 1px solid #cbd4cb; border-radius: 14px; background: #f4f7f2; cursor: pointer; text-align: left; }
    .start-selection-row strong, .start-selection-row small { display: block; }
    .start-selection-row strong { font-size: 14px; }
    .start-selection-row small { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .start-selection-row > span:last-child { font-size: 18px; }
    .start-selection-row.start-unassigned-row { border-color: #e6aaa3; background: var(--red-2); }
    .start-selection-group { display: contents; }
    .start-selection-group-label { display: none; }
    .start-selection-name-line { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .start-selection-name-line strong { min-width: 0; overflow-wrap: anywhere; }
    .start-manual-badge { display: inline-flex; flex: 0 0 auto; align-items: center; padding: 3px 0; color: #5f5c54; font-size: 8px; font-weight: 900; letter-spacing: .04em; line-height: 1; text-transform: uppercase; }
    .start-selection-row.start-manual-row { position: relative; grid-template-columns: auto minmax(0,1fr) auto; border-color: #c9c3b6; background: #f7f5ef; box-shadow: inset 4px 0 0 #77736a; }
    .start-selection-row.start-manual-row::before { content: "✋"; align-self: center; font-size: 15px; }
    .start-selection-title-line { display: flex; min-width: 0; flex-wrap: wrap; align-items: center; gap: 8px; }
    .start-selection-title-line h1 { margin: 0; }
    .start-manual-note { display: block; margin: -11px 0 18px; color: #5f5c54; font-size: 10px; font-weight: 750; line-height: 1.4; }
    .start-selection-mode { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0; padding: 4px; border: 1px solid #c8cec5; border-radius: 13px; background: #eef0eb; }
    .start-selection-mode legend { position: absolute; overflow: hidden; width: 1px; height: 1px; clip: rect(0 0 0 0); }
    .start-selection-mode label { position: relative; }
    .start-selection-mode input { position: absolute; opacity: 0; pointer-events: none; }
    .start-selection-mode label span { display: block; margin: 0; padding: 10px 8px; border-radius: 9px; color: #59635c; cursor: pointer; font-size: 10px; font-weight: 850; text-align: center; }
    .start-selection-mode input:checked + span { background: white; color: var(--ink); box-shadow: 0 2px 9px rgba(23,32,27,.11); }
    .start-manual-confirm { border-color: #bcb5a7; background: #faf8f2; }
    .start-manual-confirm p { color: #5f5a50; }
    .start-selection-remove { width: 100%; margin-top: 14px; padding: 11px; border: 1px solid #c9c4ba; border-radius: 11px; background: #f2f0ea; color: #55524c; cursor: pointer; font-size: 10px; font-weight: 850; }
    .start-elements-heading { margin: 0 0 10px; font-size: 18px; }
    .start-collections { width: min(100%, 370px); align-self: start; }
    .start-collections h1 { margin-bottom: 24px; font-size: 36px; }
    .start-collections-list { display: grid; gap: 9px; }
    .start-collection-row { display: grid; width: 100%; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: #f8faf5; cursor: pointer; text-align: left; }
    .start-collection-row strong, .start-collection-row small { display: block; }
    .start-collection-row strong { font-size: 15px; }
    .start-collection-row small { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .start-collection-row span:last-child { font-size: 18px; }
    .start-breadcrumbs { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; width: min(100%, 370px); margin: 0 auto 22px; }
    .start-breadcrumb-main { display: flex; min-width: 0; align-items: center; gap: 4px; }
    .start-breadcrumb-trail { display: flex; overflow-x: auto; min-width: 0; align-items: center; gap: 7px; padding: 2px; scrollbar-width: none; white-space: nowrap; }
    .start-breadcrumb-trail a { color: #4f5e54; font-size: 11px; font-weight: 800; text-decoration: none; }
    .start-breadcrumb-trail a[aria-current="page"] { color: var(--ink); }
    .start-breadcrumb-trail span { color: #a0a9a1; font-size: 13px; }
    .start-copy-link { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: #f4f6f1; color: #536057; cursor: pointer; font-size: 16px; }
    .start-breadcrumb-actions { display: flex; align-items: center; gap: 6px; }
    .start-breadcrumb-add { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 10px; background: var(--green); color: white; cursor: pointer; font-size: 20px; font-weight: 800; line-height: 1; }
    .start-list-screen { width: min(100%, 370px); margin: 0 auto; }
    .start-list-head { position: relative; display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .start-list-head h1 { min-width: 0; margin: 0; overflow-wrap: anywhere; font-size: 36px; }
    .start-list-head .start-collection-more { flex: 0 0 auto; }
    .start-context-add { flex: 0 0 auto; max-width: 155px; padding: 10px 12px; border: 0; border-radius: 11px; background: var(--green); color: white; cursor: pointer; font-size: 11px; font-weight: 850; line-height: 1.15; }
    .start-list-title-copy small { display: block; margin-top: 7px; color: var(--muted); font-size: 11px; }
    .start-selection-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: -8px 0 18px; }
    .start-selection-tags span { padding: 5px 8px; border-radius: 999px; background: #ecefe9; color: #536057; font-size: 10px; font-weight: 750; }
    .start-selection-tags-label { margin: -8px 0 12px; color: var(--muted); font-size: 9px; font-weight: 850; letter-spacing: .05em; text-transform: uppercase; }
    .start-selection-tags-label + .start-selection-tags { margin-top: -5px; }
    .start-selection-empty { padding: 36px 22px; border: 1px dashed #bdc7bd; border-radius: 18px; background: #f8faf5; text-align: center; }
    .start-selection-empty h2 { margin: 0 0 7px; font-size: 19px; }
    .start-selection-empty p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .start-add-screen { width: min(100%, 370px); margin: 0 auto; }
    .start-existing-search { display: grid; gap: 12px; }
    .start-existing-search h1 { margin: 0; font-size: 24px; }
    .start-search-field span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .start-search-field input { width: 100%; padding: 14px 15px; border: 1px solid #bfc8bf; border-radius: 13px; background: white; color: var(--ink); font: inherit; font-size: 16px; outline: 0; }
    .start-search-field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(35,104,75,.14); }
    .start-search-results { display: grid; gap: 8px; }
    .start-existing-element-row { display: grid; width: 100%; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: #f8faf5; color: var(--ink); cursor: pointer; font: inherit; text-align: left; }
    .start-existing-element-row strong { overflow-wrap: anywhere; font-size: 14px; }
    .start-existing-element-row small { color: var(--green); font-size: 10px; font-weight: 850; }
    .start-existing-element-row:disabled { cursor: default; opacity: .62; }
    .start-existing-element-row:disabled small { color: var(--muted); }
    .start-search-empty { margin: 0; padding: 12px 14px; border-radius: 12px; background: #f0f2ed; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .start-context-search { display: grid; width: min(100%, 370px); gap: 15px; margin: 0 auto; }
    .start-context-search h1 { margin: 0; font-size: 28px; }
    .start-search-scope { margin: -6px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .start-search-options { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: #f4f6f1; }
    .start-search-option { display: flex; min-height: 38px; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; cursor: pointer; font-size: 11px; font-weight: 800; }
    .start-search-option:has(input:disabled) { cursor: default; opacity: .55; }
    .start-search-option input { width: 18px; height: 18px; margin: 0; accent-color: var(--green); }
    .start-search-section { display: grid; gap: 8px; }
    .start-search-section h2 { margin: 2px 2px 0; color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .start-context-search-result { display: grid; width: 100%; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 13px 14px; border: 1px solid var(--line); border-radius: 13px; background: #f8faf5; cursor: pointer; text-align: left; }
    .start-context-search-result strong, .start-context-search-result small { display: block; }
    .start-context-search-result strong { overflow-wrap: anywhere; font-size: 14px; }
    .start-context-search-result small { margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.35; }
    .start-context-search-result > span:last-child { font-size: 18px; }
    .start-element-detail { padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: #f8faf5; }
    .start-element-detail h1 { margin: 0; font-size: 32px; }
    .start-element-detail p { margin: 18px 0 0; color: var(--muted); font-size: 11px; }
    .start-delete-confirm { position: absolute; z-index: 8; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); left: 14px; padding: 15px; border: 1px solid #dc9b94; border-radius: 15px; background: #fff8f6; box-shadow: 0 16px 48px rgba(23,32,27,.28); }
    .start-delete-confirm strong { display: block; font-size: 15px; }
    .start-delete-confirm p { margin: 6px 0 13px; color: #6f514d; font-size: 10px; line-height: 1.4; }
    .start-delete-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .start-delete-actions button { padding: 11px; border: 0; border-radius: 10px; cursor: pointer; font-weight: 850; }

    .criterion-pill, .tag, .count-pill, .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .criterion-pill { padding: 7px 10px; background: #e8ece5; font-size: 12px; font-weight: 780; }
    .tag { padding: 4px 7px; background: #edf0ea; color: #536057; font-size: 10px; font-weight: 750; }
    .count-pill { padding: 5px 8px; background: #e8ece5; font-size: 11px; font-weight: 800; }
    .status-pill { padding: 6px 9px; background: var(--red-2); color: var(--red); font-size: 11px; font-weight: 820; }
    .status-pill.good { background: var(--green-2); color: var(--green); }

    .progress-track { overflow: hidden; height: 7px; border-radius: 999px; background: rgba(23, 32, 27, .12); }
    .progress-fill { width: var(--progress); height: 100%; border-radius: inherit; background: currentColor; transition: width .2s ease; }

    .filter-button {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 15px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .filter-button.activity-reflect { background: var(--activity-color); }
    .filter-button.active { border-color: rgba(23, 32, 27, .42); box-shadow: inset 3px 0 0 var(--ink); }

    .edit-filter-icon { display: grid; width: 25px; height: 25px; padding: 0; place-items: center; border: 1px solid #cbd2ca; border-radius: 8px; background: transparent; cursor: pointer; font-size: 14px; line-height: 1; }
    .more-tags-button { padding: 5px 8px; border: 1px solid #c6d2c8; border-radius: 999px; background: transparent; color: var(--green); cursor: pointer; font-size: 10px; font-weight: 850; }

    .merge-applied-notice { margin-top: 11px; padding: 10px 12px; border: 1px solid #b9cdbf; border-radius: 13px; background: var(--green-2); color: var(--green); font-size: 10px; line-height: 1.35; }

    .slice-actions { display: flex; gap: 8px; align-items: center; }

    /* Selected direction — mobile-first workspace at every viewport */
    body[data-variant="A"] { height: 100dvh; overflow: hidden; background: #dfe4dc; }
    body[data-variant="A"] .prototype-page { width: min(100%, 460px); height: 100dvh; min-height: 0; overflow: hidden; margin: 0 auto; padding-bottom: 0; background: var(--paper); box-shadow: 0 0 55px rgba(23,32,27,.16); }
    body[data-variant="A"] .variant-a { display: flex; height: 100%; min-height: 0; flex-direction: column; overflow: hidden; }
    body[data-variant="A"] .a-topbar { position: relative; z-index: 12; display: grid; flex: 0 0 62px; height: 62px; grid-template-columns: minmax(0, 1fr) 34px; gap: 9px; padding: 0 12px; }
    body[data-variant="A"] .a-topbar .brand { justify-self: end; }

    body[data-variant="A"] .a-main { display: flex; height: 100%; min-height: 0; padding: 22px 12px calc(76px + env(safe-area-inset-bottom)); flex-direction: column; overflow: hidden; }
    body[data-variant="A"] .state-debug { display: none; }
    body[data-variant="A"] .slice-head { display: block; }

    body[data-variant="A"] .a-order { height: 100%; overflow-y: auto; padding: 14px; overscroll-behavior: contain; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }

    body[data-variant="A"] .priority-panel { border-radius: 22px 22px 0 0; }

    /* Variant B — horizontal workbench */

    const routeParams = new URLSearchParams(location.search);

    const requestedStage = routeParams.get('stage');
    const hasWorkspaceContext = ['filter', 'filterContext', 'integration', 'review', 'object', 'assignTag', 'addFilterTag', 'createdTag'].some(name => routeParams.has(name));
    const initialAppStage = requestedStage === 'workspace' || (!requestedStage && hasWorkspaceContext)

      : requestedStage === 'hierarchy-prototype' || requestedStage === 'new-collection' || requestedStage === 'new-selection' || requestedStage === 'edit-selection' || requestedStage === 'rename-collection' || requestedStage === 'new-element' || requestedStage === 'edit-element' || requestedStage === 'collections' || requestedStage === 'collection' || requestedStage === 'collection-empty' || requestedStage === 'selection' || requestedStage === 'element' || requestedStage === 'search'
        ? requestedStage
        : 'empty';
    let initialStartCollections = [];
    try {
      const parsedCollections = JSON.parse(routeParams.get('collections'));
      if (Array.isArray(parsedCollections)) initialStartCollections = parsedCollections
        .filter(item => item && typeof item.id === 'string' && typeof item.name === 'string' && item.name.trim())
        .map(item => ({
          id: item.id,
          name: item.name.trim(),

            .filter(element => element && typeof element.id === 'string' && typeof element.title === 'string' && element.title.trim())
            .map(element => ({ id: element.id, title: element.title.trim(), tags: Array.isArray(element.tags) ? element.tags.map(String).map(tag => tag.trim()).filter(Boolean) : [] })) : [],
          selections: [
            { id: 'all', name: 'Вся коллекция', tags: [], system: true },
            ...(Array.isArray(item.selections) ? item.selections
              .filter(selection => selection && selection.id !== 'all' && selection.id !== START_UNASSIGNED_SELECTION_ID && typeof selection.id === 'string' && typeof selection.name === 'string' && selection.name.trim())
              .map(selection => ({
                id: selection.id,
                name: selection.name.trim(),
                tags: Array.isArray(selection.tags) ? selection.tags.map(String).map(tag => tag.trim()).filter(Boolean) : [],
                system: false,
                mode: selection.mode === 'manual' ? 'manual' : 'automatic',
                ...(selection.mode === 'manual' ? {
                  memberIds: Array.isArray(selection.memberIds) ? selection.memberIds.map(String) : [],
                  originTags: Array.isArray(selection.originTags) ? selection.originTags.map(String).map(tag => tag.trim()).filter(Boolean) : Array.isArray(selection.tags) ? selection.tags.map(String).map(tag => tag.trim()).filter(Boolean) : []
                } : {})
              })) : [])
          ]
        }));
    } catch {}
    if (!initialStartCollections.length && routeParams.get('collectionName')?.trim()) initialStartCollections = [{ id: 'collection-1', name: routeParams.get('collectionName').trim(), elements: [], selections: [{ id: 'all', name: 'Вся коллекция', tags: [], system: true }] }];
    const requestedStartCollectionId = routeParams.get('activeCollection');
    const initialActiveStartCollectionId = initialStartCollections.some(item => item.id === requestedStartCollectionId) ? requestedStartCollectionId : initialStartCollections[0]?.id || null;
    const initialActiveStartCollection = initialStartCollections.find(item => item.id === initialActiveStartCollectionId) || null;
    const requestedStartSelectionId = routeParams.get('activeSelection');
    const initialHasUnassignedElements = unassignedStartElements(initialActiveStartCollection).length > 0;
    const initialActiveStartSelectionId = requestedStartSelectionId === START_UNASSIGNED_SELECTION_ID && initialHasUnassignedElements
      ? START_UNASSIGNED_SELECTION_ID
      : initialActiveStartCollection?.selections.some(item => item.id === requestedStartSelectionId) ? requestedStartSelectionId : initialActiveStartCollection?.selections[0]?.id || null;
    const initialActiveStartSelection = initialActiveStartSelectionId === START_UNASSIGNED_SELECTION_ID

      : initialActiveStartCollection?.selections.find(item => item.id === initialActiveStartSelectionId) || null;
    const initialStartSelectionElements = elementsForStartSelection(initialActiveStartCollection, initialActiveStartSelection);
    const requestedStartElementId = routeParams.get('activeElement');
    const initialActiveStartElementId = initialStartSelectionElements.some(item => item.id === requestedStartElementId) ? requestedStartElementId : null;
    let resolvedInitialAppStage = initialAppStage === 'hierarchy-prototype' ? (initialStartCollections.length ? 'collections' : 'empty') : initialAppStage;
    if (['collections', 'collection', 'collection-empty', 'new-selection', 'edit-selection', 'rename-collection', 'new-element', 'edit-element', 'selection', 'element'].includes(resolvedInitialAppStage) && !initialStartCollections.length) resolvedInitialAppStage = 'empty';
    else if (resolvedInitialAppStage === 'selection' && !initialActiveStartSelection) resolvedInitialAppStage = initialActiveStartCollection?.elements.length ? 'collection' : 'collection-empty';

    const requestedIntegration = routeParams.get('integration')?.toUpperCase();
    const requestedFilter = savedFilters.find(filter => filter.id === routeParams.get('filter'));

    const requestedObject = objects.find(item => item.id === Number(routeParams.get('object')));
    const assignedObjectTagFromGlossary = routeParams.get('assignTag')?.trim();
    const assignedFilterTagFromGlossary = routeParams.get('addFilterTag')?.trim();
    const createdTagFromGlossary = routeParams.get('createdTag')?.trim();
    const filterReturnContext = routeParams.get('filterContext') === '1';
    const mergedSourceFromGlossary = routeParams.get('mergedSource')?.trim();
    const mergedTargetFromGlossary = routeParams.get('mergedTarget')?.trim();
    const preservedComparisonTasksFromMerge = [];
    if (mergedSourceFromGlossary && mergedTargetFromGlossary) applyMergedTagRoute();
    let requestedDraftTags = null;
    try {

      if (Array.isArray(parsedDraftTags)) requestedDraftTags = parsedDraftTags.map(tag => String(tag).trim()).filter(Boolean);
    } catch {}

    function priorityPairForFilter(filter) {
      const ordered = state.draftOrders[filter.id] || [];
      const unknown = state.draftUnordered[filter.id] || [];
      const index = state.duel.pairIndex;
      const reviewRemaining = state.priorityReviewRemaining[filter.id] ?? 0;
      if (reviewRemaining > 0) {
        const tied = equalGroupsFor(filter).find(group => group.length > 1);
        if (tied && index === 0) return [objectById(tied[0]), objectById(tied[1])];
        const ids = ordered.length > 1 ? ordered : filter.objectIds;
        return [objectById(ids[index % ids.length]), objectById(ids[(index + 1) % ids.length])];
      }
      if (unknown.length && ordered.length) {
        return [objectById(unknown[index % unknown.length]), objectById(ordered[(index * 2 + 1) % ordered.length])];
      }
      const ids = filter.objectIds;
      return [objectById(ids[index % ids.length]), objectById(ids[(index + 1) % ids.length])];
    }

    function storeEqualGroups(filter, groups) {
      const normalized = groups.map(group => [...new Set(group)]).filter(group => group.length > 1);
      state.equalGroups[filter.id] = normalized;
      if (!filter.dirty) state.equalGroups[filter.sourceId] = normalized.map(group => [...group]);
    }

    function applyPrototypePriorityDecision(filter, left, right, outcome) {
      const review = (state.priorityReviewRemaining[filter.id] ?? 0) > 0;
      const orderedBefore = [...(state.draftOrders[filter.id] || [])];
      const unknownBefore = [...(state.draftUnordered[filter.id] || [])];
      let ordered = [...orderedBefore];
      let unknown = [...unknownBefore];
      let equalGroups = equalGroupsFor(filter).map(group => [...group]);
      const leftUnknown = unknown.includes(left.id);
      const rightUnknown = unknown.includes(right.id);

      if (outcome === 'equal') {
        const touching = equalGroups.filter(group => group.includes(left.id) || group.includes(right.id));
        const merged = [...new Set([left.id, right.id, ...touching.flat()])];
        equalGroups = equalGroups.filter(group => !touching.includes(group));
        equalGroups.push(merged);
        const presentIndexes = merged.map(id => ordered.indexOf(id)).filter(index => index >= 0);
        const insertAt = presentIndexes.length ? Math.min(...presentIndexes) : ordered.length;
        ordered = ordered.filter(id => !merged.includes(id));
        ordered.splice(insertAt, 0, ...merged);
        unknown = unknown.filter(id => !merged.includes(id));
      } else {
        const winner = outcome === 'left' ? left.id : right.id;
        const loser = outcome === 'left' ? right.id : left.id;
        const unknownId = leftUnknown ? left.id : rightUnknown ? right.id : null;
        const anchorId = leftUnknown ? right.id : rightUnknown ? left.id : null;
        if (unknownId != null && anchorId != null) {
          const anchorGroup = equalGroups.find(group => group.includes(anchorId)) || [anchorId];
          const anchorIndexes = anchorGroup.map(id => ordered.indexOf(id)).filter(index => index >= 0);
          const firstAnchor = anchorIndexes.length ? Math.min(...anchorIndexes) : ordered.length;
          const lastAnchor = anchorIndexes.length ? Math.max(...anchorIndexes) : ordered.length - 1;
          ordered = ordered.filter(id => id !== unknownId);
          const unknownWins = winner === unknownId;
          ordered.splice(unknownWins ? firstAnchor : lastAnchor + 1, 0, unknownId);
          unknown = unknown.filter(id => id !== unknownId);
        } else if (review || (!leftUnknown && !rightUnknown)) {
          const sameGroup = equalGroups.find(group => group.includes(left.id) && group.includes(right.id));
          if (sameGroup) {
            equalGroups = equalGroups.filter(group => group !== sameGroup);
            const remainder = sameGroup.filter(id => id !== left.id && id !== right.id);
            if (remainder.length > 1) equalGroups.push(remainder);
          }
          const pairIndexes = [ordered.indexOf(left.id), ordered.indexOf(right.id)].filter(index => index >= 0);
          const insertAt = pairIndexes.length ? Math.min(...pairIndexes) : ordered.length;
          ordered = ordered.filter(id => id !== left.id && id !== right.id);
          ordered.splice(insertAt, 0, winner, loser);
        }
      }

      state.draftOrders[filter.id] = ordered;
      state.draftUnordered[filter.id] = unknown;
      filter.unorderedIds = [...unknown];
      storeEqualGroups(filter, equalGroups);
      const symbol = outcome === 'equal' ? '=' : outcome === 'left' ? '>' : '<';
      const historyItem = { leftId: left.id, rightId: right.id, outcome, symbol, review };
      state.priorityDecisionHistory[filter.id].push(historyItem);
      if (!filter.dirty) {
        state.priorityDecisionHistory[filter.sourceId] = [...state.priorityDecisionHistory[filter.id]];
        syncCurrentDraftToSource();
      }
      return {
        ...historyItem,
        leftTitle: left.title,
        rightTitle: right.title,
        versionId: taskVersionFor(filter)?.id || 'новая версия',
        equality: outcome === 'equal',
        placedObjectId: leftUnknown ? left.id : rightUnknown ? right.id : null,
        changedProjection: ordered.join(',') !== orderedBefore.join(',') || unknown.join(',') !== unknownBefore.join(',')
      };
    }

    function renderDuel() {
      const filter = activeFilter();
      if (!state.duel.open || filter.objectIds.length < 2) {
        state.duel.open = false;
        document.body.classList.remove('duel-open');
        duelBackdrop.classList.remove('open');
        duelBackdrop.setAttribute('aria-hidden', 'true');
        duelBackdrop.innerHTML = '';
        return;
      }
      document.body.classList.add('duel-open');
      const [left, right] = priorityPairForFilter(filter);
      const reviewRemaining = state.priorityReviewRemaining[filter.id] ?? 0;
      const remaining = reviewRemaining || (state.maxRemainingComparisons[filter.id] ?? estimateRemainingComparisonUpperBound(filter.objectIds, state.draftUnordered[filter.id] ?? []));
      const duelProgress = `<div class="duel-progress ${remaining > 0 ? 'incomplete' : 'complete'}"><strong>${remaining > 0 ? reviewRemaining ? `Осталось ${pluralDecisions(remaining)}` : `Осталось не более ${pluralLimitedComparisons(remaining)}` : 'Порядок определён'}</strong></div>`;
      const choiceMarkup = (item, outcome, side) => {
        const choice = `<button class="duel-choice" type="button" data-duel-outcome="${outcome}" aria-label="Выбрать «${escapeHTML(item.title)}»"><span class="duel-object">${poster(item)}</span></button>`;
        return `<div class="duel-choice-wrap ${side}">${choice}<button class="duel-expand" type="button" data-open-duel-object-id="${item.id}" aria-label="Открыть детальную форму «${escapeHTML(item.title)}»" title="Открыть детали">⛶</button></div>`;
      };
      taskVersionFor(filter) || ensureTaskVersion(filter, reviewRemaining ? 'review' : 'sorting');
      duelBackdrop.innerHTML = `<div class="duel" data-integration="${state.integrationVariant}" role="dialog" aria-modal="true" aria-label="Попарная сортировка">
        <header class="duel-header">
          <button class="icon-button" type="button" data-close-duel aria-label="Закрыть">×</button>
          <div class="duel-title"><strong>${escapeHTML(state.criterion)}</strong></div>
          ${duelProgress}
        </header>
        <div class="duel-stage">
          ${choiceMarkup(left, 'left', 'left')}
          <div class="duel-rail"><span>или</span><button type="button" data-duel-outcome="equal" aria-label="Равноценны" title="Равноценны">=</button><button type="button" data-duel-outcome="defer" aria-label="Отложить" title="Отложить">↓</button></div>
          ${choiceMarkup(right, 'right', 'right')}
        </div>
        <footer class="duel-footer"><span>«=» — равноценны · «↓» — отложить</span></footer>
      </div>`;
      duelBackdrop.classList.add('open');
      duelBackdrop.setAttribute('aria-hidden', 'false');
    }

    function renderGlossary() {
      if (!state.glossaryOpen) {
        document.body.classList.remove('glossary-open');
        glossaryBackdrop.classList.remove('open');
        glossaryBackdrop.setAttribute('aria-hidden', 'true');
        glossaryBackdrop.innerHTML = '';
        return;
      }
      const tagCounts = Object.entries(objects.reduce((counts, item) => {
        item.tags.forEach(tag => { counts[tag] = (counts[tag] ?? 0) + 1; });
        return counts;
      }, {})).sort(([left], [right]) => left.localeCompare(right, 'ru'));
      glossaryBackdrop.innerHTML = `<aside class="glossary-panel" role="dialog" aria-modal="true" aria-label="Глоссарий тегов коллекции"><header class="glossary-head"><div><p class="eyebrow">Коллекция «Фильмы на вечер»</p><h2>Глоссарий тегов</h2><p>Управляемый словарь помогает не создавать случайные синонимы. Число показывает, сколько объектов коллекции используют тег.</p></div><button class="icon-button" type="button" data-close-glossary aria-label="Закрыть глоссарий">×</button></header><div class="glossary-list">${tagCounts.map(([tag, count]) => `<div class="glossary-row"><div><strong>#${escapeHTML(tag)}</strong><small>Используется в коллекции</small></div><span class="glossary-count">${count}</span></div>`).join('')}</div><button class="primary-button glossary-add" type="button" data-toast="Добавление тега не входит в вопрос этой итерации">Добавить тег</button></aside>`;
      document.body.classList.add('glossary-open');
      glossaryBackdrop.classList.add('open');
      glossaryBackdrop.setAttribute('aria-hidden', 'false');
    }

    function renderCollections() {
      if (!state.collectionMenuOpen) {
        document.body.classList.remove('collection-open');
        collectionBackdrop.classList.remove('open');
        collectionBackdrop.setAttribute('aria-hidden', 'true');
        collectionBackdrop.innerHTML = '';
        return;
      }
      collectionBackdrop.innerHTML = `<section class="collection-panel" role="dialog" aria-modal="true" aria-label="Выбор коллекции"><header class="collection-head"><div><p class="eyebrow">Пространства сравнения</p><h2>Коллекции</h2><p>В одной коллекции находятся объекты, которые можно адекватно сравнивать попарно по одному критерию. Поэтому изображения и короткие тексты здесь разделены.</p></div><button class="icon-button" type="button" data-close-collections aria-label="Закрыть выбор коллекции">×</button></header><div class="collection-list">${collections.map(collection => `<button class="collection-choice ${collection.current ? 'active' : ''}" type="button" ${collection.current ? 'data-close-collections' : `data-toast="Переход в коллекцию «${escapeHTML(collection.name)}» не входит в эту итерацию прототипа"`}><span><strong>${escapeHTML(collection.name)}</strong><small>Формат · ${escapeHTML(collection.format)} · ${pluralObjects(collection.count)}</small></span><span class="collection-choice-state">${collection.current ? 'Открыта' : 'Перейти'}</span></button>`).join('')}</div><button class="ghost-button collection-create" type="button" data-toast="Создание коллекции не входит в эту итерацию прототипа">Создать коллекцию</button></section>`;
      document.body.classList.add('collection-open');
      collectionBackdrop.classList.add('open');
      collectionBackdrop.setAttribute('aria-hidden', 'false');
    }

    function renderFilterPanel() {
      if (!state.filterPanelOpen) {
        document.body.classList.remove('filter-open');
        filterBackdrop.classList.remove('open');
        filterBackdrop.setAttribute('aria-hidden', 'true');
        filterBackdrop.innerHTML = '';
        return;
      }
      const filter = activeFilter();
      const contextTitle = filter.showName ? filter.name : filterRule(filter);
      const contextRule = `${filter.dirty ? 'Не сохранён · ' : ''}${filter.tags.length ? filterRule(filter) : 'Показаны все объекты коллекции'}`;
      const pendingDelete = savedFilters.find(item => item.id === state.pendingDeleteFilterId && !item.system);
      const deleteConfirmation = pendingDelete ? `<div class="filter-delete-confirm" role="alertdialog" aria-modal="true" aria-labelledby="filter-delete-title"><strong id="filter-delete-title">Удалить «${escapeHTML(pendingDelete.name)}»?</strong><p>Исчезнет только сохранённый фильтр. Коллекция и общий порядок не изменятся.</p><div class="filter-delete-confirm-actions"><button class="filter-delete-cancel" type="button" data-cancel-delete-filter>Отмена</button><button class="filter-delete-submit" type="button" data-confirm-delete-filter="${pendingDelete.id}">Удалить</button></div></div>` : '';
      filterBackdrop.innerHTML = `<aside class="filter-panel" role="dialog" aria-modal="true" aria-label="Сохранённые фильтры"><header class="filter-panel-head"><div><p class="eyebrow">Навигация по срезам</p><h2>Сохранённые фильтры</h2><p>${userSavedFilters().length} сохранённых в текущей коллекции</p></div><div class="filter-panel-head-actions"><button class="icon-button filter-add-button" type="button" data-start-new-filter aria-label="Добавить фильтр">+</button><button class="icon-button" type="button" data-close-filter-panel aria-label="Закрыть сохранённые фильтры">×</button></div></header><div class="filter-panel-context"><strong>${escapeHTML(contextTitle)}</strong><small>${escapeHTML(contextRule)}</small></div><div class="a-filter-toolbar"><div class="filter-toolbar-actions"><button class="filter-order-toggle ${state.filterOrderMode === 'pinned' ? 'active' : ''}" type="button" data-toggle-filter-order>${state.filterOrderMode === 'pinned' ? '◆ Открепить' : 'Закрепить'}</button></div><div class="activity-legend">Зелёный — сортировка завершена; красный — не завершена. Темнее — фильтр использовался активнее. Перетаскивание за ⠿ закрепляет ручной порядок.</div></div><nav class="a-filter-list" aria-label="Фильтры текущей коллекции">${filterListA()}</nav>${filter.dirty ? '<button class="ghost-button a-new-filter" type="button" data-save-current-filter>Сохранить текущий фильтр</button>' : ''}${deleteConfirmation}</aside>`;
      document.body.classList.add('filter-open');
      filterBackdrop.classList.add('open');
      filterBackdrop.setAttribute('aria-hidden', 'false');
    }

    function taskVersionFor(filter) {
      return state.taskVersions[filter.id] || (!filter.dirty ? state.taskVersions[filter.sourceId] : null);
    }

    function ensureTaskVersion(filter, kind = 'sorting') {
      const existing = taskVersionFor(filter);
      if (existing && existing.kind !== 'completed') return existing;
      const version = {
        id: `slice-${String(Date.now()).slice(-4)}`,
        fixedAt: '31 августа 2026, сейчас',
        objectIds: [...filter.objectIds],
        criterion: state.criterion,
        kind
      };
      state.taskVersions[filter.id] = version;
      if (!filter.dirty) state.taskVersions[filter.sourceId] = { ...version, objectIds: [...version.objectIds] };
      return version;
    }

    function equalGroupsFor(filter) {
      return state.equalGroups[filter.id] || (!filter.dirty ? state.equalGroups[filter.sourceId] : []) || [];
    }

    function priorityProjection(filter, explicitIds = null) {
      const orderedIds = explicitIds ? [...explicitIds] : [...(state.draftOrders[filter.id] || [])];
      const allowed = new Set(explicitIds || filter.objectIds);
      const equalGroups = equalGroupsFor(filter)
        .map(group => group.filter(id => allowed.has(id)))
        .filter(group => group.length > 1);
      const groupById = new Map();
      equalGroups.forEach(group => group.forEach(id => groupById.set(id, group)));
      const seen = new Set();
      const groups = [];
      orderedIds.forEach(id => {
        if (!allowed.has(id) || seen.has(id)) return;
        const group = (groupById.get(id) || [id]).filter(memberId => orderedIds.includes(memberId));
        group.forEach(memberId => seen.add(memberId));
        groups.push(group);
      });
      const unknown = explicitIds ? [] : (state.draftUnordered[filter.id] || []).filter(id => allowed.has(id));
      return { groups, unknown };
    }

    function priorityOrderMapMarkup(filter, options = {}) {
      const { compact = false, explicitIds = null, title = 'Проекция общего порядка' } = options;
      const projection = priorityProjection(filter, explicitIds);
      let rank = 1;
      const visibleGroups = compact ? projection.groups.slice(0, 4) : projection.groups;
      const rows = visibleGroups.map(group => {
        const rowRank = rank;
        rank += group.length;
        const members = group.map((id, index) => {
          const item = objectById(id);
          return `${index ? '<span class="priority-order-equals">=</span>' : ''}<span class="priority-order-member">${item ? escapeHTML(item.title) : id}</span>`;
        }).join('');
        return `<div class="priority-order-group"><span class="priority-order-rank">${rowRank}</span><span class="priority-order-members">${members}</span></div>`;
      }).join('');
      const hiddenCount = projection.groups.length - visibleGroups.length;
      const unknown = projection.unknown.map(id => `<span>${escapeHTML(objectById(id)?.title || id)}</span>`).join('');
      return `<section class="priority-order-map"><header class="priority-order-map-head"><span><strong>${escapeHTML(title)}</strong><small>Коллекция · ${escapeHTML(state.criterion)}</small></span><span class="count-pill">${pluralPlaces(projection.groups.length)}</span></header><div class="priority-order-groups">${rows || '<div class="priority-order-group"><span class="priority-order-rank">—</span><span class="priority-order-member">Порядок пока пуст</span></div>'}${hiddenCount > 0 ? `<div class="priority-order-group"><span class="priority-order-rank">…</span><span class="priority-order-member">Ещё ${pluralPlaces(hiddenCount)}</span></div>` : ''}</div>${unknown ? `<div class="priority-order-unknown"><strong>Отношение к части порядка ещё неизвестно</strong><div class="priority-order-unknown-list">${unknown}</div></div>` : ''}<div class="priority-order-legend"><span><b>=</b> явно выбрано общее место</span><span><b>пунктир</b> отношение ещё не установлено</span></div></section>`;
    }

    function priorityResultVersionMarkup(result) {
      return `<article class="priority-version-card result"><strong>Версия ${escapeHTML(result.versionId || result.id)} · ${pluralObjects(result.objectIds.length)}</strong><small>Зафиксирована для завершённого сравнения<br>Критерий: ${escapeHTML(state.criterion)}</small></article>`;
    }

    function priorityReviewRelationMarkup(filter) {
      const ids = filter.result?.objectIds || state.draftOrders[filter.id] || filter.objectIds;
      const left = objectById(ids[0]);
      const right = objectById(ids[1]);
      if (!left || !right) return '';
      return `<div class="priority-review-relation"><span>${escapeHTML(left.title)}</span><b>&gt;</b><span>${escapeHTML(right.title)}</span></div>`;
    }

    function priorityActionsMarkup({ primaryLabel, result, remaining, reviewRemaining, comparisonsAvailable }) {
      return `<div class="priority-actions">${primaryLabel ? `<button class="primary-button" type="button" data-start-priority-task>${escapeHTML(primaryLabel)}</button>` : ''}${reviewRemaining > 0 ? '<button class="soft-button" type="button" data-finish-priority-review>Завершить пересмотр</button>' : ''}${remaining === 0 && comparisonsAvailable && reviewRemaining === 0 ? '<button class="ghost-button priority-review-button" type="button" data-confirm-priority-review>Пересмотреть решения</button>' : ''}</div>`;
    }

    function renderPriorityPanel() {
      const filter = activeFilter();
      if (!state.priorityPanelOpen) {
        document.body.classList.remove('priorities-open');
        priorityBackdrop.classList.remove('open');
        priorityBackdrop.setAttribute('aria-hidden', 'true');
        priorityBackdrop.innerHTML = '';
        return;
      }
      const remaining = state.maxRemainingComparisons[filter.id] ?? estimateRemainingComparisonUpperBound(filter.objectIds, state.draftUnordered[filter.id] ?? []);
      const reviewRemaining = state.priorityReviewRemaining[filter.id] ?? 0;
      const comparisonsAvailable = filter.objectIds.length >= 2;
      const hasTask = state.taskProgress[filter.id] != null;
      const orderedCount = state.draftOrders[filter.id]?.length ?? 0;
      const source = savedFilters.find(item => item.id === filter.sourceId);
      const sourceRemaining = filter.dirty && source ? state.maxRemainingComparisons[source.id] ?? source.maxRemainingComparisons ?? 0 : 0;
      const result = filter.result;
      let tone = 'incomplete';
      let title = 'Приоритеты ещё не определены';
      let description = 'Следующая необходимая пара дополнит общий порядок коллекции. Уже известные отношения не повторяются.';
      let primaryLabel = comparisonsAvailable ? 'Зафиксировать версию и начать' : '';
      let showFacts = true;
      if (!comparisonsAvailable) {
        tone = 'neutral';
        title = 'Сравнения не нужны';
        description = filter.objectIds.length === 1 ? 'В срезе один объект — его положение однозначно.' : 'В текущем срезе нет объектов для сравнения.';
      } else if (reviewRemaining > 0) {
        tone = 'incomplete';
        title = `Осталось не более ${pluralLimitedDecisions(reviewRemaining)}`;
        description = '';
        primaryLabel = 'Продолжить пересмотр';
        showFacts = false;
      } else if (filter.dirty && remaining > 0) {
        title = 'Живой срез изменился';
        description = 'Для нового состава нужна отдельная зафиксированная версия. Прежнее сравнение не изменено.';
        primaryLabel = 'Зафиксировать текущий состав';
      } else if (remaining > 0 && hasTask) {
        title = `Осталось не более ${pluralLimitedComparisons(remaining)}`;
        description = '';
        primaryLabel = 'Продолжить сравнение';
        showFacts = false;
      } else if (remaining === 0) {
        tone = 'complete';
        title = 'Полный порядок';
        description = '';
        primaryLabel = '';
        showFacts = false;
      }
      const versionNote = filter.dirty && sourceRemaining > 0 ? `<div class="priority-version-note"><strong>Прежнее сравнение сохранено</strong><br>Оно относится к фильтру «${escapeHTML(source.name)}» и содержит не более ${pluralLimitedComparisons(sourceRemaining)}. Вернуться к нему можно через «Фильтры».</div>` : '';
      const summary = `<div class="priority-summary ${tone}"><strong>${escapeHTML(title)}</strong>${description ? `<p>${escapeHTML(description)}</p>` : ''}</div>`;
      const remainingFact = reviewRemaining > 0
        ? `<strong>Осталось не более ${pluralLimitedDecisions(reviewRemaining)}</strong><small>для пересмотра</small>`
        : remaining > 0
          ? `<strong>Осталось не более ${pluralLimitedComparisons(remaining)}</strong>`
          : '<strong>Порядок определён</strong>';
      const facts = showFacts ? `<div class="priority-facts"><div class="priority-fact"><strong>У ${orderedCount} из ${filter.objectIds.length}</strong><small>место определено</small></div><div class="priority-fact">${remainingFact}</div></div>` : '';
      const actions = priorityActionsMarkup({ primaryLabel, result, remaining, reviewRemaining, comparisonsAvailable });
      const resultAction = result && remaining === 0 && reviewRemaining === 0 ? '<div class="priority-actions"><button class="soft-button" type="button" data-open-priority-result>Открыть неизменяемый результат</button></div>' : '';

      const resultRows = result?.objectIds.map((id, index) => {
        const item = objectById(id);
        return item ? `<li class="priority-result-row"><span class="priority-result-rank">${index + 1}</span><span><strong>${escapeHTML(item.title)}</strong><small>${item.year}</small></span></li>` : '';
      }).join('') ?? '';
      const resultContent = result ? `<div class="priority-result"><button class="priority-result-back" type="button" data-close-priority-result>← К состоянию приоритетов</button><div class="priority-result-version">${priorityResultVersionMarkup(result)}</div><div class="priority-result-head"><strong>Неизменяемый результат</strong><small>${escapeHTML(result.completedAt)} · ${pluralObjects(result.objectIds.length)} · ${escapeHTML(state.criterion)}</small></div>${priorityOrderMapMarkup(filter, { compact: true, explicitIds: result.objectIds, title: 'Порядок в результате' })}<ol class="priority-result-list">${resultRows}</ol><div class="priority-result-note">Этот снимок не изменится при пересмотре общего порядка.</div></div>` : '';
      const reviewContent = `<div class="priority-confirm"><h3>Явно пересмотреть отношение?</h3><p>Обычное сравнение не перезаписывает действующее отношение молча. При отдельном пересмотре выбранное решение будет отозвано и заменено новым.</p>${priorityReviewRelationMarkup(filter)}<ul><li>изменение атомарно: при конфликте прежний порядок останется;</li><li>группу общего места можно разделить только таким пересмотром;</li><li>завершённые результаты не изменятся.</li></ul></div><div class="priority-actions"><button class="soft-button" type="button" data-cancel-priority-review>Отмена</button><button class="primary-button" type="button" data-start-priority-review>Начать отдельный пересмотр</button></div>`;

      const variantContent = `<div class="priority-integration">${summary}${facts}${versionNote}${actions}${resultAction}</div>`;

      const mainContent = state.priorityResultOpen && result ? resultContent : state.priorityReviewConfirmation ? reviewContent : variantContent;
      priorityBackdrop.innerHTML = `<section class="priority-panel" data-integration="C" role="dialog" aria-modal="true" aria-label="Состояние приоритетов"><header class="priority-panel-head"><div><p class="eyebrow">${escapeHTML(filter.name)}</p><h2>Приоритеты</h2><p>${escapeHTML(state.criterion)}</p></div><button class="icon-button" type="button" data-close-priorities aria-label="Закрыть">×</button></header>${mainContent}</section>`;
      document.body.classList.add('priorities-open');
      priorityBackdrop.classList.add('open');
      priorityBackdrop.setAttribute('aria-hidden', 'false');
    }

    function openPriorityTask() {
      const filter = activeFilter();
      if (filter.objectIds.length < 2) return;
      ensureTaskVersion(filter, (state.priorityReviewRemaining[filter.id] ?? 0) > 0 ? 'review' : 'sorting');
      if ((state.priorityReviewRemaining[filter.id] ?? 0) === 0 && state.taskProgress[filter.id] == null) state.taskProgress[filter.id] = 0;
      state.priorityPanelOpen = false;
      state.priorityReviewConfirmation = false;
      state.priorityResultOpen = false;
      state.duel.open = true;
      render();
    }

    function startPriorityReview() {
      const filter = activeFilter();
      if (filter.objectIds.length < 2) return;
      state.priorityReviewRemaining[filter.id] = Math.max(1, filter.objectIds.length - 1);
      if (!filter.dirty) state.priorityReviewRemaining[filter.sourceId] = state.priorityReviewRemaining[filter.id];
      state.taskVersions[filter.id] = null;
      if (!filter.dirty) state.taskVersions[filter.sourceId] = null;
      state.duel.pairIndex = 0;
      state.priorityReviewConfirmation = false;
      state.priorityResultOpen = false;
      syncPriorityReviewRoute(filter);
      openPriorityTask();
    }

    function finishPriorityReview() {
      const filter = activeFilter();
      if ((state.priorityReviewRemaining[filter.id] ?? 0) === 0) return;
      state.priorityReviewRemaining[filter.id] = 0;
      if (!filter.dirty) state.priorityReviewRemaining[filter.sourceId] = 0;
      const version = taskVersionFor(filter);
      if (version) version.kind = 'completed';
      if (!filter.dirty && state.taskVersions[filter.sourceId]) state.taskVersions[filter.sourceId].kind = 'completed';
      projectCompletedOrderToSavedFilters(filter);
      state.duel.open = false;
      state.priorityPanelOpen = true;
      state.priorityReviewConfirmation = false;
      state.priorityResultOpen = false;
      clearPriorityReviewRoute();
      render();
      showToast('Пересмотр завершён');
    }

    function renderObjectDetail() {
      const item = objectById(state.objectDetailId);
      if (!item) {
        document.body.classList.remove('object-detail-open');
        objectDetailBackdrop.classList.remove('open');
        objectDetailBackdrop.setAttribute('aria-hidden', 'true');
        objectDetailBackdrop.innerHTML = '';
        return;
      }
      if (!state.objectDetailDraft || state.objectDetailDraft.objectId !== item.id) {
        state.objectDetailDraft = { objectId: item.id, title: item.title, year: item.year, tags: [...item.tags] };
        state.objectTagQuery = '';
      }
      const draft = state.objectDetailDraft;
      const rawQuery = state.objectTagQuery.trim().replace(/^#+/, '').trim();
      const query = normalizeTag(rawQuery);
      const selected = new Set(draft.tags.map(normalizeTag));
      const exactEntry = query ? glossaryEntries.find(entry => [entry.name, ...entry.synonyms].some(label => normalizeTag(label) === query)) : null;
      const suggestions = query ? glossaryEntries.filter(entry => entry.status === 'active' && !selected.has(normalizeTag(entry.name)) && [entry.name, ...entry.synonyms].some(label => normalizeTag(label).includes(query))).slice(0, 5) : [];
      const chips = draft.tags.map(tag => {
        const entry = glossaryEntries.find(item => normalizeTag(item.name) === normalizeTag(tag));
        const archived = entry?.status === 'archived';
        return `<span class="object-tag-chip ${archived ? 'archived' : ''}">#${escapeHTML(tag)}${archived ? ' · в архиве' : ''}<button type="button" data-remove-object-tag="${escapeHTML(tag)}" aria-label="Удалить тег ${escapeHTML(tag)}">×</button></span>`;
      }).join('');
      const suggestionRows = suggestions.map(entry => {
        const synonym = entry.synonyms.find(label => normalizeTag(label).includes(query));
        return `<button type="button" class="object-tag-option" data-add-object-tag="${escapeHTML(entry.name)}">Добавить #${escapeHTML(entry.name)}${synonym && normalizeTag(synonym) !== normalizeTag(entry.name) ? `<small>Найдено по синониму «${escapeHTML(synonym)}»</small>` : ''}</button>`;
      }).join('');
      let queryAction = '';
      if (query && exactEntry?.status === 'archived' && !selected.has(normalizeTag(exactEntry.name))) queryAction = `<div class="object-tag-state archived">#${escapeHTML(exactEntry.name)} находится в архиве и недоступен для нового назначения</div>`;
      else if (query && exactEntry && selected.has(normalizeTag(exactEntry.name))) queryAction = `<div class="object-tag-state">#${escapeHTML(exactEntry.name)} уже назначен объекту</div>`;
      else if (query && !exactEntry) queryAction = `<button type="button" class="object-tag-create" data-create-object-tag="${escapeHTML(rawQuery)}">Создать #${escapeHTML(rawQuery)} в глоссарии и назначить объекту</button>`;
      const tagResults = query ? `<div class="object-tag-results">${suggestionRows}${queryAction || (!suggestions.length ? '<div class="object-tag-state">Совпадений нет</div>' : '')}</div>` : '';
      const previewItem = { ...item, title: draft.title || item.title, year: draft.year || item.year, tags: draft.tags };
      objectDetailBackdrop.innerHTML = `<aside class="object-detail-panel" role="dialog" aria-modal="true" aria-label="Детальная форма элемента"><header class="object-detail-head"><div><p class="eyebrow">Элемент коллекции</p><h2>Детальная форма</h2><p>Изменения сохраняются только в памяти прототипа.</p></div><button class="icon-button" type="button" data-close-object-detail aria-label="Закрыть детальную форму">×</button></header><form class="object-detail-form" data-object-detail-form data-object-id="${item.id}"><div class="object-detail-fields"><div class="object-detail-preview">${poster(previewItem)}</div><label class="object-detail-field"><span>Название</span><input type="text" name="title" value="${escapeHTML(draft.title)}" required></label><label class="object-detail-field"><span>Год</span><input type="number" name="year" value="${draft.year}" min="1888" max="2100" required></label><div class="object-detail-field"><span>Теги</span><div class="object-tag-editor"><div class="object-tag-chips">${chips || '<span class="object-tag-state">Пока нет тегов</span>'}</div><input class="object-tag-search" data-object-tag-search type="search" value="${escapeHTML(state.objectTagQuery)}" placeholder="Найти или добавить тег" aria-describedby="object-tags-help">${tagResults}</div><small id="object-tags-help">Поиск использует названия и синонимы глоссария. Для неизвестного обозначения сначала откроется форма новой записи.</small></div></div><footer class="object-detail-actions"><button class="soft-button" type="button" data-close-object-detail>Отмена</button><button class="primary-button" type="submit">Сохранить</button></footer></form></aside>`;
      document.body.classList.add('object-detail-open');
      objectDetailBackdrop.classList.add('open');
      objectDetailBackdrop.setAttribute('aria-hidden', 'false');
    }

    function rerenderObjectDetailPreservingScroll(focusSearch = false) {
      const scrollTop = objectDetailBackdrop.querySelector('.object-detail-fields')?.scrollTop ?? 0;
      renderObjectDetail();
      const fields = objectDetailBackdrop.querySelector('.object-detail-fields');
      if (fields) fields.scrollTop = scrollTop;
      if (focusSearch) {
        const search = objectDetailBackdrop.querySelector('[data-object-tag-search]');
        search?.focus();
        search?.setSelectionRange(search.value.length, search.value.length);
      }
    }

    function openObjectDetail(id, context = 'workspace') {
      if (!objectById(id)) return;
      state.objectDetailId = Number(id);
      state.objectDetailContext = context;
      const item = objectById(id);
      state.objectDetailDraft = { objectId: item.id, title: item.title, year: item.year, tags: [...item.tags] };
      state.objectTagQuery = '';
      renderObjectDetail();
      renderState();
    }

    function closeObjectDetail() {
      state.objectDetailId = null;
      state.objectDetailContext = null;
      state.objectDetailDraft = null;
      state.objectTagQuery = '';
      renderObjectDetail();
      renderState();
    }

    function reconcileFilterMembership(filter) {
      const previousIds = [...filter.objectIds];
      const nextIds = objects.filter(item => filter.tags.every(tag => item.tags.includes(tag))).map(item => item.id);
      const previousOrdered = state.draftOrders[filter.id] ?? [];
      const previousUnordered = state.draftUnordered[filter.id] ?? [];
      const nextOrdered = previousOrdered.filter(id => nextIds.includes(id));
      const orderedSet = new Set(nextOrdered);
      const nextUnordered = previousUnordered.filter(id => nextIds.includes(id) && !orderedSet.has(id));
      const known = new Set([...nextOrdered, ...nextUnordered]);
      nextIds.forEach(id => { if (!known.has(id)) nextUnordered.push(id); });
      if (nextIds.length <= 1) {
        state.draftOrders[filter.id] = [...nextIds];
        state.draftUnordered[filter.id] = [];
      } else {
        state.draftOrders[filter.id] = nextOrdered;
        state.draftUnordered[filter.id] = nextUnordered;
      }
      filter.objectIds = nextIds;
      filter.unorderedIds = [...state.draftUnordered[filter.id]];
      if (previousIds.join(',') !== nextIds.join(',')) {
        filter.task = null;
        state.taskProgress[filter.id] = null;
        const upperBound = estimateRemainingComparisonUpperBound(filter.objectIds, state.draftUnordered[filter.id]);
        filter.maxRemainingComparisons = upperBound;
        state.maxRemainingComparisons[filter.id] = upperBound;
      }
    }

    function refreshFilterMemberships() {
      savedFilters.forEach(reconcileFilterMembership);
      const filter = activeFilter();
      if (filter.dirty) {
        reconcileFilterMembership(filter);
        return;
      }
      const source = savedFilters.find(item => item.id === filter.sourceId);
      filter.objectIds = [...source.objectIds];
      filter.unorderedIds = [...source.unorderedIds];
      filter.task = source.task ? { ...source.task } : null;
      state.draftOrders[filter.id] = [...state.draftOrders[source.id]];
      state.draftUnordered[filter.id] = [...state.draftUnordered[source.id]];
      state.taskProgress[filter.id] = state.taskProgress[source.id] ?? null;
      state.maxRemainingComparisons[filter.id] = state.maxRemainingComparisons[source.id] ?? 0;
    }

    function saveObjectDetail(form) {
      const item = objectById(form.dataset.objectId);
      const draft = state.objectDetailDraft;
      if (!item || !draft) return;
      const detailContext = state.objectDetailContext;
      item.title = draft.title.trim();
      item.year = Number(draft.year);
      item.tags = [...new Set(draft.tags.map(tag => tag.trim()).filter(Boolean))];
      refreshFilterMemberships();
      const remainsInCurrentFilter = activeFilter().objectIds.includes(item.id);
      state.objectDetailId = null;
      state.objectDetailContext = null;
      state.objectDetailDraft = null;
      state.objectTagQuery = '';
      render();
      showToast(detailContext === 'duel' && !remainsInCurrentFilter ? 'Элемент больше не входит в текущий фильтр' : 'Изменения элемента сохранены в прототипе');
    }

    function renderState() {
      const filter = activeFilter();
      stateOutput.textContent = JSON.stringify({
        variant: state.variant,
        sortingIntegrationVariant: state.integrationVariant,
        layoutFocus: 'mobile-first',
        collection: 'Фильмы на вечер',
        currentFilter: { sourceId: filter.sourceId, dirty: filter.dirty, name: filter.name, showName: Boolean(filter.showName), tags: filter.tags },
        savedFilterNavigation: {
          orderMode: state.filterOrderMode,
          order: orderedSavedFilters().map(item => item.id),
          activity: Object.fromEntries(userSavedFilters().map(item => [item.id, item.activity]))
        },
        liveSliceSize: filter.objectIds.length,
        appliedTagMerge: mergedSourceFromGlossary && mergedTargetFromGlossary ? { source: mergedSourceFromGlossary, target: mergedTargetFromGlossary } : null,
        preservedComparisonTasks: state.preservedComparisonTasks,
        priorityPanelOpen: state.priorityPanelOpen,
        priorityReviewRemaining: state.priorityReviewRemaining[filter.id] ?? 0,
        fixedSliceVersion: taskVersionFor(filter),
        equalityGroups: equalGroupsFor(filter),
        activePriorityDecisions: state.priorityDecisionHistory[filter.id],
        priorityResult: filter.result ? { id: filter.result.id, completedAt: filter.result.completedAt, objectIds: filter.result.objectIds } : null,
        objectDetailId: state.objectDetailId,
        objectDetailContext: state.objectDetailContext,
        criterion: state.criterion,
        draftVisibleOrder: state.draftOrders[filter.id],
        unorderedInSlice: state.draftUnordered[filter.id],
        comparisonTask: { status: state.maxRemainingComparisons[filter.id] > 0 ? 'unfinished' : 'complete', maxRemainingComparisons: state.maxRemainingComparisons[filter.id] ?? 0 }
      }, null, 2);
    }

    function startBrandMarkup() {
      return `<span class="brand-mark" aria-hidden="true">К</span><span class="start-flow-header-title">Коллекции</span>`;
    }

    function startBottomNavigationMarkup() {
      return `<nav class="start-bottom-nav" aria-label="Основные действия">
        <button type="button" data-toast="Настройки пока не реализованы" aria-label="Настройки">
          <span class="start-bottom-nav-icon" aria-hidden="true">⚙</span>
          <span class="start-bottom-nav-label">Настройки</span>
        </button>
        <button type="button" data-open-start-search aria-label="Поиск" ${state.appStage === 'search' ? 'aria-current="page"' : ''}>
          <span class="start-bottom-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></span>
          <span class="start-bottom-nav-label">Поиск</span>
        </button>
      </nav>`;
    }

    function activeStartCollection() {
      return state.startCollections.find(item => item.id === state.activeStartCollectionId) || null;
    }

    function activeStartCollectionStage() {
      const collection = activeStartCollection();
      return collection?.elements.length ? 'collection' : collection ? 'collection-empty' : state.startCollections.length ? 'collections' : 'empty';
    }

    function userStartSelections(collection) {
      return collection?.selections.filter(selection => !selection.system) || [];
    }

    function startElementMatchesTags(element, tags) {
      return tags.every(tag => element.tags.some(value => normalizeTag(value) === normalizeTag(tag)));
    }

    function startSelectionHasElement(selection, element) {
      if (selection?.mode === 'manual') return selection.memberIds.includes(element.id);
      return startElementMatchesTags(element, selection?.tags || []);
    }

    function unassignedStartElements(collection) {
      if (!collection) return [];
      const selections = userStartSelections(collection);
      return collection.elements.filter(element => !selections.some(selection => startSelectionHasElement(selection, element)));
    }

    function activeStartSelection() {
      const collection = activeStartCollection();
      if (collection && state.activeStartSelectionId === START_UNASSIGNED_SELECTION_ID) {
        return { id: START_UNASSIGNED_SELECTION_ID, name: 'Без подборки', tags: [], system: true, derived: 'unassigned' };
      }
      return collection?.selections.find(item => item.id === state.activeStartSelectionId) || null;
    }

    function elementsForStartSelection(collection, selection) {
      if (!collection || !selection) return [];
      if (selection.derived === 'unassigned') return unassignedStartElements(collection);
      return collection.elements.filter(element => startSelectionHasElement(selection, element));
    }

    function activeStartElement() {
      return elementsForStartSelection(activeStartCollection(), activeStartSelection()).find(item => item.id === state.activeStartElementId) || null;
    }

    function startingFlowURL(stage, { collectionId = null, selectionId = null, elementId = null } = {}) {
      const url = new URL(location.href);
      url.search = '';
      if (stage !== 'empty') url.searchParams.set('stage', stage);
      if (state.startCollections.length) url.searchParams.set('collections', JSON.stringify(state.startCollections));
      if (collectionId) url.searchParams.set('activeCollection', collectionId);
      if (selectionId) url.searchParams.set('activeSelection', selectionId);
      if (elementId) url.searchParams.set('activeElement', elementId);
      return url.href;
    }

    function manualBadgeMarkup(selection) {
      return selection?.mode === 'manual' ? '<span class="start-manual-badge">Ручная</span>' : '';
    }

    function manualConversionConfirmationMarkup() {
      const pending = state.pendingStartManualConversion;
      if (!pending) return '';
      const action = pending.action === 'remove' ? 'исключить элемент только из неё' : 'добавить элемент, не меняя его теги';
      return `<div class="start-delete-confirm start-manual-confirm" role="alertdialog" aria-modal="true" aria-labelledby="start-manual-confirm-title"><strong id="start-manual-confirm-title">Сделать подборку ручной?</strong><p>Чтобы ${action}, нужно зафиксировать нынешний состав. Новые элементы, подходящие фильтру, больше не будут добавляться автоматически.</p><div class="start-delete-actions"><button class="filter-delete-cancel" type="button" data-cancel-start-manual-conversion>Отмена</button><button class="primary-button" type="button" data-confirm-start-manual-conversion>Сделать ручной</button></div></div>`;
    }

    function startBreadcrumbsMarkup(parts, trailingAction = '') {
      const trail = parts.map((part, index) => `${index ? '<span aria-hidden="true">›</span>' : ''}<a href="${escapeHTML(part.href)}" ${index === parts.length - 1 ? 'aria-current="page"' : ''}>${escapeHTML(part.label)}</a>`).join('');
      const current = parts.at(-1);
      return `<nav class="start-breadcrumbs" aria-label="Хлебные крошки"><div class="start-breadcrumb-main"><div class="start-breadcrumb-trail">${trail}</div><button class="start-copy-link" type="button" data-copy-share-link="${escapeHTML(current.href)}" aria-label="Скопировать ссылку на «${escapeHTML(current.label)}»">⧉</button></div>${trailingAction ? `<div class="start-breadcrumb-actions">${trailingAction}</div>` : ''}</nav>`;
    }

    function parseStartSelectionTags(value) {
      return value.split(/[,;\n]/).map(tag => tag.trim().replace(/^#+\s*/, '').trim()).filter(Boolean).reduce((tags, tag) => {
        if (!tags.some(existing => normalizeTag(existing) === normalizeTag(tag))) tags.push(tag);
        return tags;
      }, []);
    }

    function matchingStartElements(collection, value) {
      const query = normalizeTag(value);
      return collection && query ? collection.elements.filter(element => normalizeTag(element.title).includes(query)) : [];
    }

    function startSearchScope() {
      const collection = activeStartCollection();
      const selection = activeStartSelection();
      const selectionStages = ['selection', 'element', 'edit-selection', 'edit-element', 'new-element'];
      const collectionStages = ['collection', 'collection-empty', 'new-selection', 'rename-collection'];
      const selectionScoped = Boolean(collection && selection && selectionStages.includes(state.startSearchReturnStage));
      const collectionScoped = Boolean(collection && (selectionScoped || collectionStages.includes(state.startSearchReturnStage)));
      return { collection: collectionScoped ? collection : null, selection: selectionScoped ? selection : null, contextual: collectionScoped };
    }

    function startSearchResults() {
      const queryTags = parseStartSelectionTags(state.startSearchQuery);
      const scope = startSearchScope();
      const global = state.startSearchGlobal || !scope.contextual;
      const collectionsToSearch = global ? state.startCollections : scope.collection ? [scope.collection] : [];
      const elements = collectionsToSearch.flatMap(collection => {
        const source = !global && scope.selection ? elementsForStartSelection(collection, scope.selection) : collection.elements;
        const selectionId = !global && scope.selection ? scope.selection.id : 'all';
        return source
          .filter(element => startElementMatchesTags(element, queryTags))
          .map(element => ({ collection, selection: !global && scope.selection ? scope.selection : null, selectionId, element }));
      });
      return { queryTags, scope, global, elements };
    }

    function startSearchScreenMarkup() {
      const { queryTags, scope, global, elements } = startSearchResults();
      const hasContext = scope.contextual;
      const scopeText = global
        ? 'Поиск по всем коллекциям'
        : scope.selection
          ? `В подборке «${escapeHTML(scope.selection.name)}» из коллекции «${escapeHTML(scope.collection.name)}»`
          : `В коллекции «${escapeHTML(scope.collection.name)}»`;
      const baseTags = !global && scope.selection?.mode !== 'manual' && scope.selection?.tags.length
        ? `<p class="start-search-scope">Фильтр подборки: ${scope.selection.tags.map(tag => `#${escapeHTML(tag)}`).join(' · ')}. Введённые теги уточняют его.</p>`
        : !global && scope.selection?.mode === 'manual'
          ? '<p class="start-search-scope">Поиск ограничен фактическим составом ручной подборки.</p>'
          : '';
      const elementRows = elements.map(({ collection, selection, selectionId, element }) => {
        const context = selection ? `${collection.name} › ${selection.name}` : collection.name;
        const tags = element.tags.length ? element.tags.map(tag => `#${tag}`).join(' · ') : 'без тегов';
        return `<button class="start-context-search-result" type="button" data-open-start-search-element="${escapeHTML(element.id)}" data-search-collection-id="${escapeHTML(collection.id)}" data-search-selection-id="${escapeHTML(selectionId)}"><span><strong>${escapeHTML(element.title)}</strong><small>${escapeHTML(context)} · ${escapeHTML(tags)}</small></span><span aria-hidden="true">›</span></button>`;
