<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PROTOTYPE — основной интерфейс коллекции</title>
  <!-- Mobile-first collection workspace plus two preserved historical variants, switchable via ?variant=. -->
  <style>
    :root {
      --ink: #17201b;
      --muted: #657067;
      --paper: #f5f2ea;
      --panel: #fffdf8;
      --line: #d9ddd5;
      --green: #23684b;
      --green-2: #d8eadf;
      --lime: #dff26f;
      --peach: #f0c9af;
      --blue: #c9ddec;
      --yellow: #f5de85;
      --shadow: 0 18px 55px rgba(27, 43, 34, .10);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 0 0, rgba(223, 242, 111, .22), transparent 28rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
    }

    button, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, select:focus-visible, summary:focus-visible, [data-open-object-id]:focus-visible {
      outline: 3px solid rgba(35, 104, 75, .32);
      outline-offset: 3px;
    }

    .prototype-page { min-height: 100vh; padding-bottom: 106px; }
    .eyebrow {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .muted { color: var(--muted); }
    .dot { padding: 0 .25em; color: #a3aaa4; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(28px, 4vw, 48px); line-height: .98; letter-spacing: -.045em; }
    h2 { margin-bottom: 7px; font-size: clamp(20px, 2.3vw, 30px); line-height: 1.05; letter-spacing: -.025em; }
    h3 { margin-bottom: 4px; font-size: 16px; }

    .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 850; }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: var(--ink);
      color: white;
      font-family: Georgia, serif;
      font-size: 19px;
    }

    .icon-button, .ghost-button, .soft-button, .primary-button, .dark-button {
      border: 0;
      border-radius: 13px;
      cursor: pointer;
      font-weight: 780;
      transition: transform .16s ease, background .16s ease, opacity .16s ease;
    }
    .icon-button:hover, .ghost-button:hover, .soft-button:hover, .primary-button:hover, .dark-button:hover { transform: translateY(-1px); }
    .icon-button { width: 38px; height: 38px; background: #eceee8; }
    .ghost-button { padding: 10px 13px; background: transparent; }
    .soft-button { padding: 10px 14px; background: #e9ece5; }
    .primary-button { padding: 12px 17px; background: var(--green); color: white; }
    .dark-button { padding: 12px 17px; background: var(--ink); color: white; }
    .primary-button.large, .dark-button.large { min-height: 52px; padding-inline: 22px; }

    .criterion-pill, .tag, .count-pill, .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .criterion-pill { padding: 7px 10px; background: #e8ece5; font-size: 12px; font-weight: 780; }
    .tag { padding: 4px 7px; background: #edf0ea; color: #536057; font-size: 10px; font-weight: 750; }
    .count-pill { padding: 5px 8px; background: #e8ece5; font-size: 11px; font-weight: 800; }
    .status-pill { padding: 6px 9px; background: var(--yellow); font-size: 11px; font-weight: 820; }
    .status-pill.good { background: var(--green-2); color: var(--green); }

    .progress-track { overflow: hidden; height: 7px; border-radius: 999px; background: rgba(23, 32, 27, .12); }
    .progress-fill { width: var(--progress); height: 100%; border-radius: inherit; background: currentColor; transition: width .2s ease; }

    .filter-button {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 15px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .filter-button.activity-reflect { background: var(--activity-color); }
    .filter-button.active { border-color: rgba(35, 104, 75, .45); box-shadow: inset 3px 0 0 var(--green); }
    .filter-name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .filter-name { min-width: 0; font-weight: 820; }
    .filter-meta { color: var(--muted); font-size: 11px; }
    .filter-rule { display: block; overflow: hidden; margin-top: 5px; color: #4f5e54; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .slice-state { display: inline-flex; flex: 0 0 auto; min-width: 24px; height: 24px; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; font-size: 12px; font-weight: 900; }
    .slice-state.complete { background: #cfe9d8; color: #11613d; }
    .slice-state.incomplete { border: 2px dashed #b88a2b; background: #fff6d8; color: #8a641a; }
    .slice-state.with-label { min-width: 0; height: 32px; padding: 0 10px; font-size: 11px; }

    .poster {
      position: relative;
      isolation: isolate;
      display: flex;
      overflow: hidden;
      min-height: 150px;
      align-items: flex-end;
      border-radius: 16px;
      background: var(--poster, #d9ddd5);
      color: #101612;
    }
    .poster::before, .poster::after { content: ""; position: absolute; z-index: -1; border-radius: 999px; }
    .poster::before { inset: 10% 45% 38% -15%; background: rgba(255, 255, 255, .6); transform: rotate(-18deg); }
    .poster::after { right: -15%; bottom: -20%; width: 70%; aspect-ratio: 1; background: rgba(23, 32, 27, .16); }
    .poster-index { position: absolute; top: 11px; left: 12px; font-size: 11px; font-weight: 900; }
    .poster-copy { width: 100%; padding: 22px 13px 13px; background: linear-gradient(transparent, rgba(255,255,255,.87) 34%); }
    .poster-copy strong { display: block; font-family: Georgia, serif; font-size: 17px; line-height: 1.03; }
    .poster-copy small { display: block; margin-top: 5px; color: #4e5a52; font-size: 10px; font-weight: 700; }

    .ordered-card {
      position: relative;
      display: grid;
      grid-template-columns: 32px minmax(72px, 96px) 1fr auto;
      gap: 12px;
      align-items: center;
      min-width: 0;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel);
      box-shadow: 0 5px 16px rgba(23, 32, 27, .045);
    }
    .ordered-card[draggable="true"] { cursor: grab; }
    .ordered-card.is-dragging { opacity: .42; }
    .ordered-rank { color: var(--green); font-family: Georgia, serif; font-size: 22px; font-weight: 800; text-align: center; }
    .ordered-card .poster { min-height: 88px; border-radius: 11px; }
    .ordered-card .poster-copy { padding: 25px 8px 8px; }
    .ordered-card .poster-copy strong { font-size: 11px; }
    .ordered-card .poster-copy small { display: none; }
    .ordered-copy { min-width: 0; }
    .ordered-copy strong { display: block; overflow: hidden; margin-bottom: 7px; text-overflow: ellipsis; white-space: nowrap; }
    .ordered-copy .tags { display: flex; overflow: hidden; gap: 4px; }
    .drag-handle { display: grid; width: 32px; height: 36px; place-items: center; border-radius: 10px; background: #edf0ea; color: #657067; cursor: grab; font-size: 18px; font-weight: 900; touch-action: none; user-select: none; }
    .drag-handle:active { cursor: grabbing; }
    .drag-target { outline: 2px solid rgba(35,104,75,.55); outline-offset: 2px; }

    .unordered-card {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 10px;
      align-items: center;
      padding: 8px;
      border: 1px dashed #aeb7ae;
      border-radius: 16px;
      background: rgba(255, 253, 248, .72);
    }
    .unordered-card .poster { min-height: 76px; border-radius: 11px; }
    .unordered-card .poster-copy { padding: 26px 7px 7px; }
    .unordered-card .poster-copy strong { font-size: 10px; }
    .unordered-card .poster-copy small { display: none; }
    .unordered-copy strong { display: block; margin-bottom: 7px; font-size: 13px; }
    .place-button { padding: 7px 9px; border: 0; border-radius: 9px; background: var(--green-2); color: var(--green); cursor: pointer; font-size: 11px; font-weight: 800; }

    .prototype-warning {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 10px 12px;
      border: 1px solid #e8d59a;
      border-radius: 13px;
      background: #fff7d9;
      color: #655728;
      font-size: 11px;
      line-height: 1.35;
    }

    /* Variant A — route rail */
    .variant-a { min-height: calc(100vh - 106px); }
    .a-topbar {
      display: flex;
      height: 66px;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, .84);
      backdrop-filter: blur(16px);
    }
    .a-top-actions { display: flex; align-items: center; gap: 10px; }
    .a-shell { display: grid; grid-template-columns: 285px minmax(0, 1fr); min-height: calc(100vh - 172px); }
    .a-rail { position: sticky; top: 0; overflow: hidden; max-height: calc(100vh - 106px); padding: 28px 18px; border-right: 1px solid var(--line); background: rgba(246, 245, 238, .82); }
    .a-rail-heading { padding: 0 10px 20px; }
    .a-rail-heading h2 { font-size: 22px; }
    .a-filter-toolbar { padding: 0 10px 10px; }
    .a-filter-toolbar-top { display: block; }
    .a-filter-toolbar .eyebrow { margin: 0; }
    .filter-toolbar-actions { display: grid; grid-template-columns: 1fr; gap: 4px; margin-top: 8px; }
    .filter-order-toggle { padding: 6px 8px; border: 1px solid #cfd5cd; border-radius: 9px; background: transparent; cursor: pointer; font-size: 10px; font-weight: 820; }
    .filter-order-toggle.active { border-color: var(--green); background: var(--green-2); color: var(--green); }
    .activity-legend { margin-top: 8px; color: var(--muted); font-size: 9px; }
    .a-filter-list { display: grid; overflow-y: auto; max-height: calc(100vh - 390px); gap: 5px; padding-right: 3px; scrollbar-width: thin; }
    .a-filter-row { min-width: 0; }
    .a-filter-row[draggable="true"] { cursor: grab; }
    .a-filter-row.is-dragging { opacity: .42; }
    .a-filter-list .filter-button { padding: 11px 10px; }
    .a-filter-list .filter-button.active { padding-block: 13px; }
    .a-new-filter { width: 100%; margin-top: 12px; text-align: left; }
    .a-main { min-width: 0; padding: 34px clamp(20px, 4vw, 58px) 58px; }
    .slice-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .slice-head-copy p { max-width: 680px; margin-bottom: 0; color: var(--muted); font-size: 13px; }
    .slice-context-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 11px; font-weight: 760; }
    .slice-condition { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 11px; }
    .slice-condition .tag { background: var(--green-2); color: var(--green); font-size: 11px; }
    .slice-condition .empty-filter-state { border: 1px solid #d7bd68; background: #fff2bf; color: #745715; font-weight: 880; }
    .filter-tag-remove { display: grid; width: 18px; height: 18px; margin: -2px -4px -2px 0; padding: 0; place-items: center; border: 0; border-radius: 99px; background: rgba(35,104,75,.12); color: var(--green); cursor: pointer; font-size: 13px; font-weight: 900; line-height: 1; }
    .filter-tag-remove:active { background: rgba(35,104,75,.24); }
    .filter-tag-edit-group { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .edit-filter-icon { display: grid; width: 25px; height: 25px; padding: 0; place-items: center; border: 1px solid #cbd2ca; border-radius: 8px; background: transparent; cursor: pointer; font-size: 14px; line-height: 1; }
    .more-tags-button { padding: 5px 8px; border: 1px solid #c6d2c8; border-radius: 999px; background: transparent; color: var(--green); cursor: pointer; font-size: 10px; font-weight: 850; }
    .edit-filter-button { padding: 7px 10px; border: 1px solid #cbd2ca; border-radius: 10px; background: transparent; cursor: pointer; font-size: 11px; font-weight: 820; }
    .current-filter-name { overflow: hidden; max-width: 180px; color: var(--ink); font-size: 12px; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
    button.current-filter-name { padding: 6px 9px; border: 1px solid #cbd2ca; border-radius: 10px; background: transparent; cursor: pointer; }
    .filter-editor { margin: 15px 0 0; padding: 15px; border: 1px solid #bfc9bf; border-radius: 17px; background: #f8faf5; }
    .filter-editor-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .filter-editor-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .filter-editor-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-editor-tags button { padding: 7px 9px; border: 1px solid #cbd2ca; border-radius: 999px; background: white; cursor: pointer; font-size: 11px; }
    .filter-editor-tags button.active { border-color: var(--green); background: var(--green-2); color: var(--green); font-weight: 820; }
    .filter-name-field { display: grid; gap: 5px; margin-bottom: 13px; }
    .filter-name-field span { font-size: 10px; font-weight: 850; }
    .filter-name-field input { width: 100%; padding: 10px 11px; border: 1px solid #bfc9bf; border-radius: 11px; background: white; color: var(--ink); font: inherit; font-size: 13px; font-weight: 760; }
    .filter-name-field small { color: var(--muted); font-size: 9px; }
    .slice-actions { display: flex; gap: 8px; align-items: center; }
    .continue-banner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 15px;
      align-items: center;
      margin: 26px 0;
      padding: 15px;
      border-radius: 18px;
      background: var(--ink);
      color: white;
    }
    .continue-symbol { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: var(--lime); color: var(--ink); font-size: 19px; }
    .continue-banner strong { display: block; font-size: 14px; }
    .continue-banner p { margin: 4px 0 0; color: #bcc8bf; font-size: 11px; }
    .continue-banner .progress-track { width: min(200px, 26vw); margin-top: 8px; color: var(--lime); background: rgba(255,255,255,.15); }
    .continue-actions { display: flex; gap: 7px; align-items: center; }
    .continue-actions .soft-button { background: rgba(255,255,255,.12); color: white; }
    .a-workspace { display: block; }
    .a-order, .a-unordered { padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,253,248,.7); }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .section-head p { margin-bottom: 0; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .ordered-list, .unordered-list { display: grid; gap: 9px; }
    .a-unordered .unordered-list { margin-bottom: 12px; }

    /* Selected direction — mobile-first workspace at every viewport */
    body[data-variant="A"] { height: 100dvh; overflow: hidden; background: #dfe4dc; }
    body[data-variant="A"] .prototype-page { width: min(100%, 460px); height: 100dvh; min-height: 0; overflow: hidden; margin: 0 auto; padding-bottom: 0; background: var(--paper); box-shadow: 0 0 55px rgba(23,32,27,.16); }
    body[data-variant="A"] .variant-a { display: flex; height: 100%; min-height: 0; flex-direction: column; overflow: hidden; }
    body[data-variant="A"] .a-topbar { position: relative; z-index: 12; display: grid; flex: 0 0 62px; height: 62px; grid-template-columns: 34px minmax(0, 1fr); gap: 9px; padding: 0 12px; }
    body[data-variant="A"] .a-topbar .brand span:last-child { display: none; }
    body[data-variant="A"] .a-top-filter { min-width: 0; overflow-x: auto; scrollbar-width: none; }
    body[data-variant="A"] .a-top-filter::-webkit-scrollbar { display: none; }
    body[data-variant="A"] .a-top-filter .slice-condition { width: max-content; margin-top: 0; flex-wrap: nowrap; }
    body[data-variant="A"] .a-top-actions { min-width: 0; flex: 1; justify-content: flex-end; }
    body[data-variant="A"] .a-top-actions .ghost-button { display: none; }
    body[data-variant="A"] .a-shell { display: block; min-height: 0; flex: 1 1 auto; overflow: hidden; }
    .a-bottom-nav { position: fixed; z-index: 45; bottom: 0; left: 50%; display: grid; width: min(460px, 100%); grid-template-columns: repeat(5, minmax(0,1fr)); padding: 7px 6px calc(7px + env(safe-area-inset-bottom)); transform: translateX(-50%); border-top: 1px solid #c8cec7; background: rgba(250,249,243,.97); box-shadow: 0 -8px 26px rgba(23,32,27,.12); backdrop-filter: blur(14px); }
    .a-bottom-nav button { position: relative; display: grid; min-width: 0; min-height: 52px; padding: 5px 1px; place-items: center; align-content: center; gap: 3px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); cursor: pointer; }
    .a-bottom-nav button:active { background: var(--green-2); }
    .a-bottom-nav button:disabled { cursor: default; opacity: .42; }
    .a-bottom-nav-icon { font-size: 19px; font-weight: 900; line-height: 1; }
    .a-bottom-nav-label { overflow: hidden; max-width: 100%; font-size: 9px; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
    .a-bottom-nav-count { position: absolute; top: 3px; left: calc(50% + 6px); display: grid; min-width: 17px; height: 17px; padding: 0 3px; place-items: center; border: 2px solid #faf9f3; border-radius: 99px; background: var(--green); color: white; font-size: 7px; font-weight: 900; }
    body[data-variant="A"] .a-main { display: flex; height: 100%; min-height: 0; padding: 22px 12px calc(76px + env(safe-area-inset-bottom)); flex-direction: column; overflow: hidden; }
    body[data-variant="A"] .switcher, body[data-variant="A"] .state-debug { display: none; }
    body[data-variant="A"] .slice-head { display: block; }
    body[data-variant="A"] .slice-condition { margin-top: 0; }
    body[data-variant="A"] .slice-actions { margin-top: 13px; }
    body[data-variant="A"] .continue-banner { grid-template-columns: auto 1fr; gap: 12px; margin: 20px 0; padding: 14px; }
    body[data-variant="A"] .continue-actions { grid-column: 1 / -1; align-items: stretch; flex-direction: column; }
    body[data-variant="A"] .continue-actions button, body[data-variant="A"] .continue-banner .progress-track { width: 100%; }
    body[data-variant="A"] .a-workspace { min-height: 0; flex: 1 1 auto; overflow: hidden; }
    body[data-variant="A"] .a-order { height: 100%; overflow-y: auto; padding: 14px; overscroll-behavior: contain; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
    body[data-variant="A"] .ordered-card { grid-template-columns: 28px minmax(0,1fr) 32px; gap: 8px; cursor: pointer; }
    body[data-variant="A"] .ordered-card .poster { display: none; }
    body[data-variant="A"] .ordered-copy .tags { display: none; }
    body[data-variant="A"] .ordered-rank { font-size: 19px; }
    body[data-variant="A"] .collection-backdrop { padding: 0; place-items: end center; }
    body[data-variant="A"] .collection-panel { width: min(430px, 100%); border-radius: 22px 22px 0 0; }
    body[data-variant="A"] .glossary-backdrop { justify-content: center; }
    body[data-variant="A"] .glossary-panel { min-height: 100dvh; }
    body[data-variant="A"] .duel-backdrop { padding: 0; }
    body[data-variant="A"] .duel { width: min(460px, 100%); min-height: 100dvh; border-radius: 0; }
    body[data-variant="A"] .duel-header { grid-template-columns: auto 1fr; }
    body[data-variant="A"] .duel-progress { grid-column: 1 / -1; }
    body[data-variant="A"] .duel-stage { grid-template-columns: 1fr 1fr; min-height: calc(100vh - 190px); }
    body[data-variant="A"] .duel-choice { padding: 12px; }
    body[data-variant="A"] .duel-choice-wrap { position: relative; display: flex; min-width: 0; }
    body[data-variant="A"] .duel-choice-wrap .duel-choice { width: 100%; }
    body[data-variant="A"] .duel-choice-wrap.left .duel-choice { background: #dce8db; }
    body[data-variant="A"] .duel-choice-wrap.right .duel-choice { background: #e6d7c9; }
    body[data-variant="A"] .duel-expand { position: absolute; z-index: 4; top: 20px; right: 20px; display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid rgba(23,32,27,.32); border-radius: 13px; background: rgba(255,253,248,.92); color: var(--ink); cursor: pointer; box-shadow: 0 5px 18px rgba(23,32,27,.16); font-size: 20px; font-weight: 900; }
    body[data-variant="A"] .duel-object .poster { min-height: 45vh; border-radius: 17px; box-shadow: 5px 5px 0 rgba(23,32,27,.82); }
    body[data-variant="A"] .duel-object .poster-copy { padding: 50px 12px 14px; }
    body[data-variant="A"] .duel-object .poster-copy strong { font-size: 19px; }
    body[data-variant="A"] .duel-rail { position: absolute; z-index: 3; right: 50%; bottom: 68px; flex-direction: row; transform: translateX(50%); border: 0; border-radius: 99px; background: rgba(242,240,233,.93); box-shadow: 0 7px 25px rgba(0,0,0,.18); }
    body[data-variant="A"] .duel-rail span, body[data-variant="A"] .duel-footer span:last-child { display: none; }

    /* Variant B — horizontal workbench */
    .variant-b { min-height: calc(100vh - 106px); background: #e7ebe4; }
    .b-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 17px clamp(18px, 4vw, 52px); background: var(--ink); color: white; }
    .b-header .brand-mark { background: var(--lime); color: var(--ink); }
    .b-collection { text-align: center; }
    .b-collection strong { display: block; }
    .b-collection small { color: #aebbb2; }
    .b-collection .criterion-pill { color: var(--ink); }
    .b-header-actions { display: flex; align-items: center; gap: 7px; }

    /* Collection switcher */

    /* Object detail — mobile-first form */
    .object-detail-backdrop { position: fixed; z-index: 58; inset: 0; display: none; justify-content: center; background: rgba(13,18,15,.64); backdrop-filter: blur(8px); }

    /* Collection tag glossary */

      z-index: 50;

    /* Prototype-only chrome */
    .switcher {

    body.duel-open .switcher, body.duel-open .state-debug, body.glossary-open .switcher, body.glossary-open .state-debug, body.collection-open .switcher, body.collection-open .state-debug, body.filter-open .switcher, body.filter-open .state-debug, body.object-detail-open .switcher, body.object-detail-open .state-debug { display: none; }

      .c-focus-head { display: block; }
      .c-focus-head .criterion-pill { margin-bottom: 15px; }
      .c-next { margin: 23px 0; padding: 22px; border-radius: 20px; }
      .c-next-row { align-items: stretch; flex-direction: column; }
      .c-next-row .dark-button { width: 100%; }
      .c-route { padding: 24px 18px; }
      .c-compact-row { grid-template-columns: 32px 1fr auto; }
      .c-compact-copy small { display: none; }

      .collection-backdrop { padding: 0; align-items: end; }
      .collection-panel { border-radius: 22px 22px 0 0; }

      .duel-backdrop { padding: 0; }
      .duel { min-height: 100vh; border-radius: 0; }
      .duel-header { grid-template-columns: auto 1fr; }
      .duel-progress { grid-column: 1 / -1; }
      .duel-stage { grid-template-columns: 1fr 1fr; min-height: calc(100vh - 190px); }
      .duel-choice { padding: 12px; }
      .duel-object .poster { min-height: 45vh; border-radius: 17px; box-shadow: 5px 5px 0 rgba(23,32,27,.82); }
      .duel-object .poster-copy { padding: 50px 12px 14px; }
      .duel-object .poster-copy strong { font-size: 19px; }
      .duel-rail { position: absolute; z-index: 3; right: 50%; bottom: 68px; flex-direction: row; transform: translateX(50%); border: 0; border-radius: 99px; background: rgba(242,240,233,.93); box-shadow: 0 7px 25px rgba(0,0,0,.18); }
      .duel-rail span { display: none; }
      .duel-footer { padding-bottom: 17px; }
      .prototype-stamp { display: none; }
      .state-debug { bottom: 68px; left: 10px; }
      .switcher { bottom: 10px; grid-template-columns: 39px minmax(145px, auto) 39px; }
      .switcher button { width: 39px; height: 39px; }
    }
  </style>
</head>
<body>
  <main id="app" class="prototype-page"></main>

  <section id="duelBackdrop" class="duel-backdrop" aria-hidden="true"></section>
  <section id="glossaryBackdrop" class="glossary-backdrop" aria-hidden="true"></section>
  <section id="collectionBackdrop" class="collection-backdrop" aria-hidden="true"></section>
  <section id="filterBackdrop" class="filter-backdrop" aria-hidden="true"></section>
  <section id="objectDetailBackdrop" class="object-detail-backdrop" aria-hidden="true"></section>

  <details class="state-debug">
    <summary>Состояние прототипа</summary>
    <pre id="stateOutput"></pre>
  </details>

  <nav class="switcher" aria-label="Переключатель вариантов прототипа">
    <button type="button" data-cycle="-1" aria-label="Предыдущий вариант">←</button>
    <div class="switcher-label"><strong id="variantLabel"></strong><small>Prototype · ← варианты →</small></div>
    <button type="button" data-cycle="1" aria-label="Следующий вариант">→</button>
  </nav>

  <div class="prototype-stamp">Не production</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const variants = [
      { id: 'A', name: 'Mobile-first интерфейс' },
      { id: 'B', name: 'Лента порядка' },
      { id: 'C', name: 'Сначала продолжение' }
    ];

    const collections = [
      { id: 'movies', name: 'Фильмы на вечер', format: 'карточки фильмов', count: 12, current: true },
      { id: 'covers', name: 'Обложки выпусков', format: 'изображения', count: 86 },
      { id: 'copy', name: 'Формулировки миссии', format: 'короткие тексты', count: 34 }
    ];

    const objects = [
      { id: 1, title: 'Перед рассветом', year: 1995, tags: ['романтика', 'разговоры', 'Европа'], color: '#e7bf91' },
      { id: 2, title: 'Любовное настроение', year: 2000, tags: ['романтика', 'классика', 'спокойное'], color: '#d68b72' },
      { id: 3, title: 'Идеальные дни', year: 2023, tags: ['спокойное', 'Япония', 'до 130 минут', 'одному', 'медленное', 'после работы'], color: '#b9d1bf' },
      { id: 4, title: 'Милая Фрэнсис', year: 2012, tags: ['компания', 'лёгкое', 'до 100 минут'], color: '#d9d4c7' },
      { id: 5, title: 'Прибытие', year: 2016, tags: ['фантастика', 'серьёзное', 'компания'], color: '#b4cbd4' },
      { id: 6, title: 'Коламбус', year: 2017, tags: ['архитектура', 'спокойное', 'до 130 минут', 'одному', 'медленное', 'после работы'], color: '#c5cfb5' },
      { id: 7, title: 'Патерсон', year: 2016, tags: ['спокойное', 'поэзия', 'до 130 минут', 'одному', 'медленное', 'после работы'], color: '#d9c9a8' },
      { id: 8, title: 'Отель «Гранд Будапешт»', year: 2014, tags: ['компания', 'комедия', 'Европа'], color: '#e6a9b3' },
      { id: 9, title: 'Солнце моё', year: 2022, tags: ['семья', 'серьёзное', 'до 100 минут'], color: '#e8d584' },
      { id: 10, title: 'Маленькая мисс Счастье', year: 2006, tags: ['компания', 'семья', 'до 100 минут'], color: '#f0c863' },
      { id: 11, title: 'Ла-Ла Ленд', year: 2016, tags: ['романтика', 'музыка', 'компания'], color: '#9fb7db' },
      { id: 12, title: 'Оставленные', year: 2023, tags: ['компания', 'зима', 'серьёзное'], color: '#c3aa82' }
    ];

    const savedFilters = [
      { id: 'all', name: 'Все фильмы', tags: [], objectIds: objects.map(item => item.id), unorderedIds: [4, 7, 10, 11], activity: 100, system: true, task: { progress: 38, comparisons: 12 } },
      { id: 'friends', name: 'Для компании', tags: ['компания'], objectIds: [4, 5, 8, 10, 11, 12], unorderedIds: [10, 11], activity: 84, task: { progress: 63, comparisons: 7 } },
      { id: 'quiet', name: 'Тихий вечер', tags: ['спокойное', 'до 130 минут', 'одному', 'медленное', 'после работы'], objectIds: [3, 6, 7], unorderedIds: [6, 7], activity: 71, task: { progress: 22, comparisons: 3 } },
      { id: 'short', name: 'До 100 минут', tags: ['до 100 минут'], objectIds: [4, 9, 10], unorderedIds: [10], activity: 62, task: null },
      { id: 'europe', name: 'Европейское', tags: ['Европа'], objectIds: [1, 8], unorderedIds: [8], activity: 54, task: null },
      { id: 'family', name: 'С семьёй', tags: ['семья'], objectIds: [9, 10], unorderedIds: [10], activity: 47, task: null },
      { id: 'romance', name: 'Романтика', tags: ['романтика'], objectIds: [1, 2, 11], unorderedIds: [], activity: 39, task: null },
      { id: 'serious', name: 'Серьёзное', tags: ['серьёзное'], objectIds: [5, 9, 12], unorderedIds: [12], activity: 28, task: null },
      { id: 'comedy', name: 'Комедии', tags: ['комедия'], objectIds: [8], unorderedIds: [], activity: 17, task: null },
      { id: 'music', name: 'Музыкальное', tags: ['музыка'], objectIds: [11], unorderedIds: [], activity: 8, task: null }
    ];

    const requestedVariant = new URLSearchParams(location.search).get('variant')?.toUpperCase();
    const initialFilter = savedFilters.find(filter => filter.id === 'all');
    const state = {
      variant: variants.some(item => item.id === requestedVariant) ? requestedVariant : 'A',
      activeFilterId: 'all',
      currentFilter: currentFilterFrom(initialFilter),
      criterion: 'Пересмотреть первым',
      filterOrderMode: 'activity',
      filterOrder: savedFilters.filter(filter => !filter.system).map(filter => filter.id),
      filterEditorOpen: false,
      expandedTags: false,
      glossaryOpen: false,
      collectionMenuOpen: false,
      filterPanelOpen: false,
      objectDetailId: null,
      objectDetailContext: null,
      draftOrders: Object.fromEntries([...savedFilters.map(filter => [filter.id, filter.objectIds.filter(id => !filter.unorderedIds.includes(id))]), ['current', initialFilter.objectIds.filter(id => !initialFilter.unorderedIds.includes(id))]]),
      draftUnordered: Object.fromEntries([...savedFilters.map(filter => [filter.id, [...filter.unorderedIds]]), ['current', [...initialFilter.unorderedIds]]]),
      duel: { open: false, pairIndex: 0 },
      taskProgress: Object.fromEntries([...savedFilters.filter(filter => filter.task).map(filter => [filter.id, filter.task.progress]), ['current', initialFilter.task?.progress ?? null]])
    };

    const app = document.querySelector('#app');
    const duelBackdrop = document.querySelector('#duelBackdrop');
    const glossaryBackdrop = document.querySelector('#glossaryBackdrop');
    const collectionBackdrop = document.querySelector('#collectionBackdrop');
    const filterBackdrop = document.querySelector('#filterBackdrop');
    const objectDetailBackdrop = document.querySelector('#objectDetailBackdrop');
    const stateOutput = document.querySelector('#stateOutput');
    const variantLabel = document.querySelector('#variantLabel');
    const toast = document.querySelector('#toast');
    let toastTimer;
    let draggedId = null;
    let draggedSavedFilterId = null;
    let suppressNextClick = false;

    function currentFilterFrom(source) {
      return { ...source, id: 'current', sourceId: source.id, dirty: false, tags: [...source.tags], objectIds: [...source.objectIds], unorderedIds: [...source.unorderedIds], task: source.task ? { ...source.task } : null };
    }
    function activeFilter() { return state.currentFilter; }
    function userSavedFilters() { return savedFilters.filter(filter => !filter.system); }
    function objectById(id) { return objects.find(item => item.id === Number(id)); }
    function orderedObjects() { return state.draftOrders[activeFilter().id].map(objectById); }
    function unorderedObjects() { return state.draftUnordered[activeFilter().id].map(objectById); }
    function escapeHTML(value = '') {
      return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' })[char]);
    }
    function pluralObjects(count) {
      const tail = count % 10;
      const teens = count % 100 >= 11 && count % 100 <= 14;
      if (!teens && tail === 1) return `${count} объект`;
      if (!teens && tail >= 2 && tail <= 4) return `${count} объекта`;
      return `${count} объектов`;
    }
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
    }
    function poster(item, index = '') {
      return `<div class="poster" style="--poster:${item.color}">
        <span class="poster-index">${index || String(item.id).padStart(2, '0')}</span>
        <div class="poster-copy"><strong>${escapeHTML(item.title)}</strong><small>${item.year} · ${escapeHTML(item.tags[0])}</small></div>
      </div>`;
    }
    function tagsMarkup(tags, limit = 2) {
      return `<span class="tags">${tags.slice(0, limit).map(tag => `<span class="tag">${escapeHTML(tag)}</span>`).join('')}</span>`;
    }
    function criterionMarkup() { return `<span class="criterion-pill">Критерий · ${escapeHTML(state.criterion)}</span>`; }
    function prototypeWarning() {
      return `<div class="prototype-warning"><strong>◇</strong><span>Здесь проверяется место прямой расстановки. Как она дополняет общий порядок и влияет на скрытые объекты, пока не решено.</span></div>`;
    }
    function filterRule(filter) {
      if (!filter.tags.length) return 'Без фильтра · все фильмы';
      const visible = filter.tags.slice(0, 2).map(tag => `#${tag}`).join(' ∩ ');
      return filter.tags.length > 2 ? `${visible} · ещё ${filter.tags.length - 2}` : visible;
    }
    function filterConditionMarkup(filter) {
      const editButton = '<button class="edit-filter-icon" type="button" data-toggle-filter-editor aria-label="Изменить фильтр" title="Изменить фильтр">✎</button>';
      if (!filter.tags.length) return `<div class="slice-condition"><span class="filter-tag-edit-group"><span class="tag empty-filter-state">Без фильтра</span>${editButton}</span></div>`;
      const limit = state.expandedTags ? filter.tags.length : 3;
      const visible = filter.tags.slice(0, limit);
      const hiddenCount = filter.tags.length - visible.length;
      const tagMarkup = tag => `<span class="tag">#${escapeHTML(tag)}<button class="filter-tag-remove" type="button" data-remove-slice-tag="${escapeHTML(tag)}" aria-label="Удалить тег ${escapeHTML(tag)} из фильтра" title="Удалить тег">×</button></span>`;
      const tags = visible.map((tag, index) => index === visible.length - 1 ? `<span class="filter-tag-edit-group">${tagMarkup(tag)}${editButton}</span>` : tagMarkup(tag)).join('');
      return `<div class="slice-condition">${tags}${hiddenCount ? `<button class="more-tags-button" type="button" data-toggle-all-tags>ещё ${hiddenCount}</button>` : state.expandedTags && filter.tags.length > 3 ? '<button class="more-tags-button" type="button" data-toggle-all-tags>свернуть</button>' : ''}</div>`;
    }
    function currentFilterNameMarkup(filter) {
      if (!filter.showName) return filter.dirty ? '<button class="edit-filter-button" type="button" data-focus-filter-name>Назвать</button>' : '';
      if (filter.dirty) return `<button class="current-filter-name" type="button" data-current-filter-display data-focus-filter-name aria-label="Изменить название фильтра">${escapeHTML(filter.name)}</button>`;
      return `<strong class="current-filter-name" data-current-filter-display>${escapeHTML(filter.name)}</strong>`;
    }
    function filterStatusMarkup(filter, withLabel = false) {
      const unorderedCount = state.draftUnordered[filter.id]?.length ?? 0;
      if (unorderedCount === 0) return `<span class="slice-state complete ${withLabel ? 'with-label' : ''}" aria-label="Срез упорядочен">✓${withLabel ? '<span>Упорядочено</span>' : ''}</span>`;
      return `<span class="slice-state incomplete ${withLabel ? 'with-label' : ''}" aria-label="Срез не завершён: ${unorderedCount} без места">◔${withLabel ? `<span>Не завершено · ${unorderedCount} без места</span>` : ''}</span>`;
    }
    function orderedSavedFilters() {
      if (state.filterOrderMode === 'activity') return [...userSavedFilters()].sort((left, right) => right.activity - left.activity);
      return state.filterOrder.map(id => savedFilters.find(filter => filter.id === id)).filter(Boolean);
    }
    function filterButton(filter, extra = '', detailed = false, rule = filterRule(filter)) {
      const taskProgress = state.taskProgress[filter.id];
      const meta = taskProgress != null ? `${pluralObjects(filter.objectIds.length)} · сравнения ${taskProgress}%` : pluralObjects(filter.objectIds.length);
      const lightness = (96 - filter.activity * .27).toFixed(1);
      const active = filter.id === state.activeFilterId && !state.currentFilter.dirty;
      return `<button class="filter-button ${active ? 'active' : ''} ${detailed && !filter.system ? 'activity-reflect' : ''} ${extra}" ${detailed && !filter.system ? `style="--activity-color:hsl(145 31% ${lightness}%)"` : ''} type="button" data-filter-id="${filter.id}" aria-pressed="${active}">
        <span class="filter-name-row"><span class="filter-name">${escapeHTML(filter.name)}</span>${detailed ? filterStatusMarkup(filter) : ''}</span>
        <span class="filter-meta">${meta}</span>
        ${detailed && rule ? `<span class="filter-rule">${escapeHTML(rule)}</span>` : ''}
      </button>`;
    }
    function filterList(extra = '') { return savedFilters.map(filter => filterButton(filter, extra)).join(''); }
    function filterListA() {
      const all = savedFilters.find(filter => filter.system);
      return `<div class="a-filter-row fixed-filter">${filterButton({ ...all, name: 'Без фильтра' }, '', true, '')}</div><p class="filter-panel-section-label">Сохранённые · ${userSavedFilters().length}</p>${orderedSavedFilters().map(filter => `<div class="a-filter-row" draggable="true" data-saved-filter-id="${filter.id}"><span class="drag-handle filter-drag-handle" aria-label="Перетащить фильтр «${escapeHTML(filter.name)}»">⠿</span>${filterButton(filter, '', true)}</div>`).join('')}`;
    }
    function orderedCard(item, index) {
      return `<article class="ordered-card" data-order-id="${item.id}" data-open-object-id="${item.id}" role="button" tabindex="0" aria-haspopup="dialog" aria-label="Открыть детали «${escapeHTML(item.title)}»">
        <span class="ordered-rank">${index + 1}</span>
        ${poster(item, String(index + 1).padStart(2, '0'))}
        <div class="ordered-copy"><strong>${escapeHTML(item.title)}</strong>${tagsMarkup(item.tags)}</div>
        <span class="drag-handle order-drag-handle" aria-label="Перетащить «${escapeHTML(item.title)}»">⠿</span>
      </article>`;
    }
    function unorderedCard(item) {
      return `<article class="unordered-card">
        ${poster(item)}
        <div class="unordered-copy"><strong>${escapeHTML(item.title)}</strong><button class="place-button" type="button" data-place-id="${item.id}">Поставить в конец</button></div>
      </article>`;
    }
    function continueBanner(filter) {
      if (filter.objectIds.length < 2) {
        return `<div class="continue-banner"><span class="continue-symbol">✓</span><div><strong>Попарные сравнения не нужны</strong><p>В этом срезе меньше двух объектов. Прямой порядок уже полный.</p></div></div>`;
      }
      const progress = state.taskProgress[filter.id];
      if (progress == null) {
        return `<div class="continue-banner">
          <span class="continue-symbol">↗</span>
          <div><strong>Попарные сравнения</strong><p>Прямая расстановка уже доступна ниже. Этот режим позволяет принимать решения по одной паре и остановиться в любой момент.</p></div>
          <div class="continue-actions"><button class="primary-button" type="button" data-open-duel>Сравнивать попарно</button></div>
        </div>`;
      }
      return `<div class="continue-banner">
        <span class="continue-symbol">↗</span>
        <div><strong>Незавершённые попарные сравнения</strong><p>${filter.task.comparisons} решений сохранено · известные отношения из других срезов уже учтены</p><div class="progress-track" style="--progress:${progress}%"><div class="progress-fill"></div></div></div>
        <div class="continue-actions"><button class="primary-button" type="button" data-open-duel>Продолжить сравнения · ${progress}%</button></div>
      </div>`;
    }

    function filterEditorMarkup(filter) {
      if (!state.filterEditorOpen) return '';
      const availableTags = [...new Set(objects.flatMap(item => item.tags))].sort((left, right) => left.localeCompare(right, 'ru'));
      const editorTitle = filter.dirty ? filter.showName ? `Фильтр «${escapeHTML(filter.name)}»` : 'Текущий фильтр' : filter.sourceId === 'all' ? 'Без фильтра' : `Фильтр «${escapeHTML(filter.name)}»`;
      return `<section class="filter-editor" aria-label="Редактор текущего фильтра"><div class="filter-editor-head"><div><strong>${editorTitle}</strong><p>Срез содержит объекты со всеми включёнными тегами. Изменения применяются сразу в этом прототипе.</p></div><button class="icon-button" type="button" data-toggle-filter-editor aria-label="Закрыть редактор">×</button></div>${filter.dirty ? `<label class="filter-name-field"><span>Название текущего фильтра</span><input type="text" value="${escapeHTML(filter.name)}" data-current-filter-name aria-label="Название текущего фильтра"><small>Оно будет использовано при сохранении; исходный сохранённый фильтр не изменится.</small></label>` : ''}<div class="filter-editor-tags">${availableTags.map(tag => `<button class="${filter.tags.includes(tag) ? 'active' : ''}" type="button" data-toggle-slice-tag="${escapeHTML(tag)}" aria-pressed="${filter.tags.includes(tag)}">${filter.tags.includes(tag) ? '✓ ' : ''}#${escapeHTML(tag)}</button>`).join('')}</div></section>`;
    }

    function bottomNavigationMarkup(filter) {
      const progress = state.taskProgress[filter.id];
      const comparisonsAvailable = filter.objectIds.length >= 2;
      const priorityLabel = !comparisonsAvailable ? 'Приоритеты недоступны: недостаточно объектов' : progress == null ? 'Начать определение приоритетов' : `Продолжить определение приоритетов, ${progress}%`;
      return `<nav class="a-bottom-nav" aria-label="Основные действия">
        <button type="button" data-open-collections aria-haspopup="dialog"><span class="a-bottom-nav-icon">▱</span><span class="a-bottom-nav-label">Коллекции</span><span class="a-bottom-nav-count">${collections.length}</span></button>
        <button type="button" data-open-filter-panel aria-haspopup="dialog"><span class="a-bottom-nav-icon">☰</span><span class="a-bottom-nav-label">Фильтры</span><span class="a-bottom-nav-count">${userSavedFilters().length}</span></button>
        <button type="button" data-open-glossary aria-haspopup="dialog"><span class="a-bottom-nav-icon">#</span><span class="a-bottom-nav-label">Глоссарий</span></button>
        <button type="button" ${comparisonsAvailable ? 'data-open-duel' : 'disabled'} aria-label="${priorityLabel}"><span class="a-bottom-nav-icon">⇅</span><span class="a-bottom-nav-label">Приоритеты</span>${progress != null && comparisonsAvailable ? `<span class="a-bottom-nav-count">${progress}%</span>` : ''}</button>
        <button type="button" data-toast="Настройки коллекции появятся в следующей итерации"><span class="a-bottom-nav-icon">⚙</span><span class="a-bottom-nav-label">Настройки</span></button>
      </nav>`;
    }

    function renderVariantA() {
      const filter = activeFilter();
      const ordered = orderedObjects();
      const unordered = unorderedObjects();
      return `<section class="variant-a">
        <header class="a-topbar">
          <div class="brand"><span class="brand-mark">К</span><span>Коллекции</span></div>
          <div class="a-top-filter" aria-label="Текущий фильтр">${filterConditionMarkup(filter)}</div>
        </header>
        <div class="a-shell">
          <main class="a-main">
            <div class="slice-head">
              <div class="slice-head-copy"><div class="slice-context-meta">${filterStatusMarkup(filter, true)}<span>${pluralObjects(filter.objectIds.length)}</span>${currentFilterNameMarkup(filter)}</div>${filterEditorMarkup(filter)}</div>
              <div class="slice-actions">${criterionMarkup()}</div>
            </div>
            ${continueBanner(filter)}
            <div class="a-workspace">
              <section class="a-order" data-order-section>
                <div class="ordered-list" data-order-lane>${ordered.map(orderedCard).join('')}</div>
                <div style="margin-top:14px">${prototypeWarning()}</div>
              </section>
            </div>
          </main>
        </div>
      </section>${bottomNavigationMarkup(filter)}`;
    }

    function renderVariantB() {
      const filter = activeFilter();
      const ordered = orderedObjects();
      const unordered = unorderedObjects();
      const progress = state.taskProgress[filter.id];
      return `<section class="variant-b">
        <header class="b-header">
          <div class="brand"><span class="brand-mark">К</span><span>Коллекции</span></div>
          <div class="b-collection"><strong>Фильмы на вечер</strong><small>${criterionMarkup()}</small></div>

              <div class="b-ribbon" data-order-lane>${ordered.map((item, index) => `<article class="b-ribbon-item" draggable="true" data-order-id="${item.id}"><span class="b-ribbon-rank">${index + 1}</span>${poster(item)}<div class="b-ribbon-actions"><button type="button" data-move-id="${item.id}" data-direction="-1">← выше</button><button type="button" data-move-id="${item.id}" data-direction="1">ниже →</button></div></article>`).join('')}</div>

    function renderVariantC() {

    function renderDuel() {
      const filter = activeFilter();
      if (!state.duel.open || filter.objectIds.length < 2) {
        state.duel.open = false;
        document.body.classList.remove('duel-open');
        duelBackdrop.classList.remove('open');
        duelBackdrop.setAttribute('aria-hidden', 'true');
        duelBackdrop.innerHTML = '';
        return;
      }
      document.body.classList.add('duel-open');
      const ids = filter.objectIds;
      const left = objectById(ids[state.duel.pairIndex % ids.length]);
      const right = objectById(ids[(state.duel.pairIndex + 2) % ids.length]);
      const progress = state.taskProgress[filter.id] ?? 0;
      const choiceMarkup = (item, outcome, side) => {
        const choice = `<button class="duel-choice" type="button" data-duel-outcome="${outcome}"><span class="duel-object">${poster(item)}<strong>Выбрать «${escapeHTML(item.title)}»</strong></span></button>`;
        if (state.variant !== 'A') return choice;
        return `<div class="duel-choice-wrap ${side}">${choice}<button class="duel-expand" type="button" data-open-duel-object-id="${item.id}" aria-label="Открыть детальную форму «${escapeHTML(item.title)}»" title="Открыть детали">⛶</button></div>`;
      };
      duelBackdrop.innerHTML = `<div class="duel" role="dialog" aria-modal="true" aria-label="Попарная сортировка">
        <header class="duel-header">
          <button class="icon-button" type="button" data-close-duel aria-label="Закрыть">×</button>
          <div class="duel-title"><strong>${escapeHTML(filter.name)}</strong><small>${escapeHTML(state.criterion)}</small></div>
          <div class="duel-progress"><div class="duel-progress-copy"><span>Прогресс</span><strong>${progress}%</strong></div><div class="progress-track" style="--progress:${progress}%"><div class="progress-fill"></div></div></div>
        </header>
        <div class="duel-stage">
          ${choiceMarkup(left, 'left', 'left')}
          <div class="duel-rail"><span>или</span><button type="button" data-duel-outcome="equal" aria-label="Равноценны" title="Равноценны">=</button><button type="button" data-duel-outcome="defer" aria-label="Отложить" title="Отложить">↓</button></div>

      </div>`;

    function renderGlossary() {
      if (!state.glossaryOpen) {
        document.body.classList.remove('glossary-open');
        glossaryBackdrop.classList.remove('open');
        glossaryBackdrop.setAttribute('aria-hidden', 'true');
        glossaryBackdrop.innerHTML = '';
        return;
      }
      const tagCounts = Object.entries(objects.reduce((counts, item) => {
        item.tags.forEach(tag => { counts[tag] = (counts[tag] ?? 0) + 1; });
        return counts;
      }, {})).sort(([left], [right]) => left.localeCompare(right, 'ru'));
      glossaryBackdrop.innerHTML = `<aside class="glossary-panel" role="dialog" aria-modal="true" aria-label="Глоссарий тегов коллекции"><header class="glossary-head"><div><p class="eyebrow">Коллекция «Фильмы на вечер»</p><h2>Глоссарий тегов</h2><p>Управляемый словарь помогает не создавать случайные синонимы. Число показывает, сколько объектов коллекции используют тег.</p></div><button class="icon-button" type="button" data-close-glossary aria-label="Закрыть глоссарий">×</button></header><div class="glossary-list">${tagCounts.map(([tag, count]) => `<div class="glossary-row"><div><strong>#${escapeHTML(tag)}</strong><small>Используется в коллекции</small></div><span class="glossary-count">${count}</span></div>`).join('')}</div><button class="primary-button glossary-add" type="button" data-toast="Добавление тега не входит в вопрос этой итерации">Добавить тег</button></aside>`;
      document.body.classList.add('glossary-open');
      glossaryBackdrop.classList.add('open');
      glossaryBackdrop.setAttribute('aria-hidden', 'false');
    }

    function renderCollections() {
      if (!state.collectionMenuOpen) {
        document.body.classList.remove('collection-open');
        collectionBackdrop.classList.remove('open');
        collectionBackdrop.setAttribute('aria-hidden', 'true');
        collectionBackdrop.innerHTML = '';
        return;
      }
      collectionBackdrop.innerHTML = `<section class="collection-panel" role="dialog" aria-modal="true" aria-label="Выбор коллекции"><header class="collection-head"><div><p class="eyebrow">Пространства сравнения</p><h2>Коллекции</h2><p>В одной коллекции находятся объекты, которые можно адекватно сравнивать попарно по одному критерию. Поэтому изображения и короткие тексты здесь разделены.</p></div><button class="icon-button" type="button" data-close-collections aria-label="Закрыть выбор коллекции">×</button></header><div class="collection-list">${collections.map(collection => `<button class="collection-choice ${collection.current ? 'active' : ''}" type="button" ${collection.current ? 'data-close-collections' : `data-toast="Переход в коллекцию «${escapeHTML(collection.name)}» не входит в эту итерацию прототипа"`}><span><strong>${escapeHTML(collection.name)}</strong><small>Формат · ${escapeHTML(collection.format)} · ${pluralObjects(collection.count)}</small></span><span class="collection-choice-state">${collection.current ? 'Открыта' : 'Перейти'}</span></button>`).join('')}</div><button class="ghost-button collection-create" type="button" data-toast="Создание коллекции не входит в эту итерацию прототипа">Создать коллекцию</button></section>`;
      document.body.classList.add('collection-open');
      collectionBackdrop.classList.add('open');
      collectionBackdrop.setAttribute('aria-hidden', 'false');
    }

    function renderFilterPanel() {
      if (!state.filterPanelOpen) {
        document.body.classList.remove('filter-open');
        filterBackdrop.classList.remove('open');
        filterBackdrop.setAttribute('aria-hidden', 'true');
        filterBackdrop.innerHTML = '';
        return;
      }
      const filter = activeFilter();
      const contextTitle = filter.tags.length ? filter.name : 'Без фильтра';
      const contextRule = filter.tags.length ? `${filter.dirty ? 'Не сохранён · ' : ''}${filterRule(filter)}` : 'Показаны все объекты коллекции';
      filterBackdrop.innerHTML = `<aside class="filter-panel" role="dialog" aria-modal="true" aria-label="Сохранённые фильтры"><header class="filter-panel-head"><div><p class="eyebrow">Навигация по срезам</p><h2>Сохранённые фильтры</h2><p>${userSavedFilters().length} сохранённых в текущей коллекции</p></div><button class="icon-button" type="button" data-close-filter-panel aria-label="Закрыть сохранённые фильтры">×</button></header><div class="filter-panel-context"><strong>${escapeHTML(contextTitle)}</strong><small>${escapeHTML(contextRule)}</small></div><div class="a-filter-toolbar"><div class="filter-toolbar-actions"><button class="filter-order-toggle ${state.filterOrderMode === 'pinned' ? 'active' : ''}" type="button" data-toggle-filter-order>${state.filterOrderMode === 'pinned' ? '◆ Открепить' : 'Закрепить'}</button></div><div class="activity-legend">Темнее — использовался активнее. Перетаскивание за ⠿ закрепляет ручной порядок.</div></div><nav class="a-filter-list" aria-label="Фильтры текущей коллекции">${filterListA()}</nav>${filter.dirty ? '<button class="ghost-button a-new-filter" type="button" data-save-current-filter>Сохранить текущий фильтр</button>' : ''}</aside>`;
      document.body.classList.add('filter-open');
      filterBackdrop.classList.add('open');
      filterBackdrop.setAttribute('aria-hidden', 'false');
    }

    function renderObjectDetail() {
      const item = objectById(state.objectDetailId);
      if (!item || state.variant !== 'A') {
        document.body.classList.remove('object-detail-open');
        objectDetailBackdrop.classList.remove('open');
        objectDetailBackdrop.setAttribute('aria-hidden', 'true');
        objectDetailBackdrop.innerHTML = '';
        return;
      }
      objectDetailBackdrop.innerHTML = `<aside class="object-detail-panel" role="dialog" aria-modal="true" aria-label="Детальная форма элемента"><header class="object-detail-head"><div><p class="eyebrow">Элемент коллекции</p><h2>Детальная форма</h2><p>Изменения сохраняются только в памяти прототипа.</p></div><button class="icon-button" type="button" data-close-object-detail aria-label="Закрыть детальную форму">×</button></header><form class="object-detail-form" data-object-detail-form data-object-id="${item.id}"><div class="object-detail-fields"><div class="object-detail-preview">${poster(item)}</div><label class="object-detail-field"><span>Название</span><input type="text" name="title" value="${escapeHTML(item.title)}" required></label><label class="object-detail-field"><span>Год</span><input type="number" name="year" value="${item.year}" min="1888" max="2100" required></label><label class="object-detail-field"><span>Теги</span><textarea name="tags" aria-describedby="object-tags-help">${escapeHTML(item.tags.join(', '))}</textarea><small id="object-tags-help">Разделяйте теги запятыми. Изменение тегов может изменить состав текущего и сохранённых фильтров.</small></label></div><footer class="object-detail-actions"><button class="soft-button" type="button" data-close-object-detail>Отмена</button><button class="primary-button" type="submit">Сохранить</button></footer></form></aside>`;
      document.body.classList.add('object-detail-open');
      objectDetailBackdrop.classList.add('open');
      objectDetailBackdrop.setAttribute('aria-hidden', 'false');
    }

    function openObjectDetail(id, context = 'workspace') {
      if (state.variant !== 'A' || !objectById(id)) return;
      state.objectDetailId = Number(id);
      state.objectDetailContext = context;
      renderObjectDetail();
      renderState();
    }

    function closeObjectDetail() {
      state.objectDetailId = null;
      state.objectDetailContext = null;
      renderObjectDetail();
      renderState();
    }

    function reconcileFilterMembership(filter) {
      const previousIds = [...filter.objectIds];
      const nextIds = objects.filter(item => filter.tags.every(tag => item.tags.includes(tag))).map(item => item.id);
      const previousOrdered = state.draftOrders[filter.id] ?? [];
      const previousUnordered = state.draftUnordered[filter.id] ?? [];
      const nextOrdered = previousOrdered.filter(id => nextIds.includes(id));
      const orderedSet = new Set(nextOrdered);
      const nextUnordered = previousUnordered.filter(id => nextIds.includes(id) && !orderedSet.has(id));
      const known = new Set([...nextOrdered, ...nextUnordered]);
      nextIds.forEach(id => { if (!known.has(id)) nextUnordered.push(id); });
      if (nextIds.length <= 1) {
        state.draftOrders[filter.id] = [...nextIds];
        state.draftUnordered[filter.id] = [];
      } else {
        state.draftOrders[filter.id] = nextOrdered;
        state.draftUnordered[filter.id] = nextUnordered;
      }
      filter.objectIds = nextIds;
      filter.unorderedIds = [...state.draftUnordered[filter.id]];
      if (previousIds.join(',') !== nextIds.join(',')) {
        filter.task = null;
        state.taskProgress[filter.id] = null;
      }
    }

    function refreshFilterMemberships() {
      savedFilters.forEach(reconcileFilterMembership);
      const filter = activeFilter();
      if (filter.dirty) {
        reconcileFilterMembership(filter);
        return;
      }
      const source = savedFilters.find(item => item.id === filter.sourceId);
      filter.objectIds = [...source.objectIds];
      filter.unorderedIds = [...source.unorderedIds];
      filter.task = source.task ? { ...source.task } : null;
      state.draftOrders[filter.id] = [...state.draftOrders[source.id]];
      state.draftUnordered[filter.id] = [...state.draftUnordered[source.id]];
      state.taskProgress[filter.id] = state.taskProgress[source.id] ?? null;
    }

    function saveObjectDetail(form) {
      const item = objectById(form.dataset.objectId);
      if (!item) return;
      const detailContext = state.objectDetailContext;
      const data = new FormData(form);
      item.title = String(data.get('title')).trim();
      item.year = Number(data.get('year'));
      item.tags = [...new Set(String(data.get('tags')).split(',').map(tag => tag.trim()).filter(Boolean))];
      refreshFilterMemberships();
      const remainsInCurrentFilter = activeFilter().objectIds.includes(item.id);
      state.objectDetailId = null;
      state.objectDetailContext = null;
      render();
      showToast(detailContext === 'duel' && !remainsInCurrentFilter ? 'Элемент больше не входит в текущий фильтр' : 'Изменения элемента сохранены в прототипе');
    }

    function renderState() {
      const filter = activeFilter();
      stateOutput.textContent = JSON.stringify({
        variant: state.variant,
        layoutFocus: state.variant === 'A' ? 'mobile-first' : 'historical-variant',
        collection: 'Фильмы на вечер',
        currentFilter: { sourceId: filter.sourceId, dirty: filter.dirty, name: filter.name, showName: Boolean(filter.showName), tags: filter.tags },
        savedFilterNavigation: {
          orderMode: state.filterOrderMode,
          order: orderedSavedFilters().map(item => item.id),
          activity: Object.fromEntries(userSavedFilters().map(item => [item.id, item.activity]))
        },
        liveSliceSize: filter.objectIds.length,
        objectDetailId: state.objectDetailId,
        objectDetailContext: state.objectDetailContext,
        criterion: state.criterion,
        draftVisibleOrder: state.draftOrders[filter.id],
        unorderedInSlice: state.draftUnordered[filter.id],
        comparisonTask: state.taskProgress[filter.id] == null ? null : { status: 'unfinished', progress: state.taskProgress[filter.id] }
      }, null, 2);
    }

    function render() {
      document.body.dataset.variant = state.variant;
      app.innerHTML = state.variant === 'A' ? renderVariantA() : state.variant === 'B' ? renderVariantB() : renderVariantC();
      const descriptor = variants.find(item => item.id === state.variant);
      variantLabel.textContent = `${descriptor.id} · ${descriptor.name}`;
      renderDuel();
      renderGlossary();
      renderCollections();
      renderFilterPanel();
      renderObjectDetail();
      renderState();
      wireDragAndDrop();
      wireSavedFilterDragAndDrop();
      if (state.variant === 'A') {
        wirePointerReorder('.order-drag-handle', '[data-order-id]', 'orderId', moveRelative);
        wirePointerReorder('.filter-drag-handle', '[data-saved-filter-id]', 'savedFilterId', moveSavedFilterRelative);
      }
    }

    function setVariant(direction) {
      const current = variants.findIndex(item => item.id === state.variant);
      state.variant = variants[(current + direction + variants.length) % variants.length].id;
      const url = new URL(location.href);
      url.searchParams.set('variant', state.variant);
      history.replaceState({}, '', url);
      render();
    }

    function setFilter(id) {
      const source = savedFilters.find(filter => filter.id === id);
      if (!source) return;
      state.activeFilterId = id;
      state.currentFilter = currentFilterFrom(source);
      state.draftOrders.current = [...state.draftOrders[source.id]];
      state.draftUnordered.current = [...state.draftUnordered[source.id]];
      state.taskProgress.current = state.taskProgress[source.id] ?? null;
      state.duel.pairIndex = 0;
      state.filterEditorOpen = false;
      state.expandedTags = false;
      state.filterPanelOpen = false;
      render();
    }

    function toggleFilterOrder() {
      if (state.filterOrderMode === 'activity') {
        state.filterOrder = orderedSavedFilters().map(filter => filter.id);
        state.filterOrderMode = 'pinned';
        showToast('Порядок сохранённых фильтров закреплён');
      } else {
        state.filterOrderMode = 'activity';
        showToast('Автоматический порядок по активности включён');
      }
      render();
    }

    function ensurePinnedFilterOrder() {
      if (state.filterOrderMode === 'pinned') return;
      state.filterOrder = orderedSavedFilters().map(filter => filter.id);
      state.filterOrderMode = 'pinned';
    }

    function reorderRelative(order, id, targetId, after = false) {
      if (id === targetId) return false;
      const from = order.indexOf(id);
      if (from < 0 || !order.includes(targetId)) return false;
      const [moved] = order.splice(from, 1);
      const target = order.indexOf(targetId);
      order.splice(target + (after ? 1 : 0), 0, moved);
      return true;
    }

    function moveSavedFilterRelative(id, targetId, after = false) {
      if (id === targetId) return;
      ensurePinnedFilterOrder();
      if (!reorderRelative(state.filterOrder, id, targetId, after)) return;
      showToast('Перетаскивание закрепило новый порядок фильтров');
      render();
    }

    function sameTags(left, right) {
      return left.length === right.length && left.every(tag => right.includes(tag));
    }

    function renameCurrentFilter(value) {
      const filter = activeFilter();
      if (!filter.dirty) return;
      const name = value.trim();
      filter.name = name || 'Несохранённый фильтр';
      filter.showName = Boolean(name);
    }

    function saveCurrentFilter() {
      const filter = activeFilter();
      if (!filter.dirty) return;
      let suffix = savedFilters.length;
      while (savedFilters.some(item => item.id === `custom-${suffix}`)) suffix += 1;
      const id = `custom-${suffix}`;
      const saved = {
        id,
        name: filter.name,
        showName: Boolean(filter.showName),
        tags: [...filter.tags],
        objectIds: [...filter.objectIds],
        unorderedIds: [...state.draftUnordered[filter.id]],
        activity: Math.min(100, Math.max(0, ...userSavedFilters().map(item => item.activity)) + 1),
        task: filter.task ? { ...filter.task } : null
      };
      savedFilters.push(saved);
      state.activeFilterId = id;
      state.filterOrder.push(id);
      state.draftOrders[id] = [...state.draftOrders[filter.id]];
      state.draftUnordered[id] = [...state.draftUnordered[filter.id]];
      state.taskProgress[id] = state.taskProgress[filter.id] ?? null;
      state.currentFilter = currentFilterFrom(saved);
      state.draftOrders.current = [...state.draftOrders[id]];
      state.draftUnordered.current = [...state.draftUnordered[id]];
      state.taskProgress.current = state.taskProgress[id];
      state.filterEditorOpen = false;
      render();
      showToast(`Фильтр «${saved.name}» сохранён`);
    }

    function syncCurrentDraftToSource() {
      const filter = activeFilter();
      if (filter.dirty) return;
      state.draftOrders[filter.sourceId] = [...state.draftOrders[filter.id]];
      state.draftUnordered[filter.sourceId] = [...state.draftUnordered[filter.id]];
      const source = savedFilters.find(item => item.id === filter.sourceId);
      if (source) source.unorderedIds = [...state.draftUnordered[filter.id]];
    }

    function toggleActiveFilterTag(tag) {
      const filter = activeFilter();
      const wasDirty = filter.dirty;
      filter.tags = filter.tags.includes(tag) ? filter.tags.filter(value => value !== tag) : [...filter.tags, tag];
      const source = savedFilters.find(item => item.id === filter.sourceId);
      filter.dirty = !sameTags(filter.tags, source.tags);
      if (!filter.dirty) {
        filter.name = source.name;
        filter.showName = Boolean(source.showName);
      } else if (!wasDirty) {
        filter.name = 'Несохранённый фильтр';
        filter.showName = false;
      }
      if (!filter.dirty) {
        filter.objectIds = [...source.objectIds];
        filter.unorderedIds = [...source.unorderedIds];
        filter.task = source.task ? { ...source.task } : null;
        state.draftOrders[filter.id] = [...state.draftOrders[source.id]];
        state.draftUnordered[filter.id] = [...state.draftUnordered[source.id]];
        state.taskProgress[filter.id] = state.taskProgress[source.id] ?? null;
        state.expandedTags = false;
        showToast('Текущий фильтр снова совпадает с исходным');
        render();
        return;
      }
      const newIds = objects.filter(item => filter.tags.every(value => item.tags.includes(value))).map(item => item.id);
      const previousOrdered = state.draftOrders[filter.id] ?? [];
      const nextOrdered = previousOrdered.filter(id => newIds.includes(id));
      const nextUnordered = newIds.filter(id => !nextOrdered.includes(id));
      filter.objectIds = newIds;
      if (newIds.length <= 1) {
        state.draftOrders[filter.id] = [...newIds];
        state.draftUnordered[filter.id] = [];
      } else {
        state.draftOrders[filter.id] = nextOrdered;
        state.draftUnordered[filter.id] = nextUnordered;
      }
      filter.unorderedIds = [...state.draftUnordered[filter.id]];
      filter.task = null;
      state.taskProgress[filter.id] = null;
      state.expandedTags = false;
      showToast('Текущий фильтр изменён; прежняя задача осталась у прежней версии среза');
      render();
    }

    function moveOrdered(id, direction) {
      const order = state.draftOrders[activeFilter().id];
      const index = order.indexOf(Number(id));
      const target = Math.max(0, Math.min(order.length - 1, index + Number(direction)));
      if (index < 0 || index === target) return;
      const [moved] = order.splice(index, 1);
      order.splice(target, 0, moved);
      syncCurrentDraftToSource();
      showToast('Черновая расстановка изменена');
      render();
    }

    function moveRelative(id, targetId, after = false) {
      const order = state.draftOrders[activeFilter().id];
      if (!reorderRelative(order, Number(id), Number(targetId), after)) return;
      syncCurrentDraftToSource();
      showToast('Черновая расстановка изменена');
      render();
    }

    function placeUnordered(id) {
      const numericId = Number(id);
      const filterId = activeFilter().id;
      const unordered = state.draftUnordered[filterId];
      const index = unordered.indexOf(numericId);
      if (index < 0) return;
      unordered.splice(index, 1);
      state.draftOrders[filterId].push(numericId);
      syncCurrentDraftToSource();
      showToast('Объект добавлен в черновую расстановку');
      render();
    }

    function wireDragAndDrop() {
      document.querySelectorAll('[data-order-id]').forEach(card => {
        card.addEventListener('dragstart', event => {
          draggedId = Number(card.dataset.orderId);
          card.classList.add('is-dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', String(draggedId));
        });
        card.addEventListener('dragend', () => { draggedId = null; card.classList.remove('is-dragging'); });
        card.addEventListener('dragover', event => { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; });
        card.addEventListener('drop', event => {
          event.preventDefault();
          const bounds = card.getBoundingClientRect();
          const after = state.variant === 'A' && event.clientY > bounds.top + bounds.height / 2;
          if (draggedId != null) moveRelative(draggedId, Number(card.dataset.orderId), after);
        });
      });
    }

    function wireSavedFilterDragAndDrop() {
      document.querySelectorAll('[data-saved-filter-id]').forEach(row => {
        row.addEventListener('dragstart', event => {
          draggedSavedFilterId = row.dataset.savedFilterId;
          row.classList.add('is-dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', draggedSavedFilterId);
        });
        row.addEventListener('dragend', () => { draggedSavedFilterId = null; row.classList.remove('is-dragging'); });
        row.addEventListener('dragover', event => { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; });
        row.addEventListener('drop', event => {
          event.preventDefault();
          const bounds = row.getBoundingClientRect();
          if (draggedSavedFilterId != null) moveSavedFilterRelative(draggedSavedFilterId, row.dataset.savedFilterId, event.clientY > bounds.top + bounds.height / 2);
        });
      });
    }

    function wirePointerReorder(handleSelector, rowSelector, dataKey, onDrop) {
      document.querySelectorAll(handleSelector).forEach(handle => {
        handle.addEventListener('pointerdown', event => {
          if (event.pointerType === 'mouse' && event.button !== 0) return;
          const row = handle.closest(rowSelector);
          if (!row) return;
          event.preventDefault();
          handle.setPointerCapture(event.pointerId);
          const startY = event.clientY;
          const scrollArea = row.closest('.a-filter-list, .a-order');
          let targetRow = null;
          let after = false;
          let moved = false;
          row.classList.add('is-dragging');
          row.style.position = 'relative';
          row.style.zIndex = '2';

          const update = moveEvent => {
            const delta = moveEvent.clientY - startY;
            moved ||= Math.abs(delta) > 5;
            row.style.transform = `translateY(${delta}px)`;
            if (scrollArea) {
              const scrollBounds = scrollArea.getBoundingClientRect();
              if (moveEvent.clientY < scrollBounds.top + 48) scrollArea.scrollTop -= 14;
              else if (moveEvent.clientY > scrollBounds.bottom - 48) scrollArea.scrollTop += 14;
            }
            targetRow?.classList.remove('drag-target');
            const candidates = [...document.querySelectorAll(rowSelector)].filter(candidate => candidate !== row);
            targetRow = candidates.reduce((nearest, candidate) => {
              const center = candidate.getBoundingClientRect().top + candidate.getBoundingClientRect().height / 2;
              const distance = Math.abs(moveEvent.clientY - center);
              return !nearest || distance < nearest.distance ? { candidate, center, distance } : nearest;
            }, null)?.candidate ?? null;
            if (targetRow) {
              const bounds = targetRow.getBoundingClientRect();
              after = moveEvent.clientY > bounds.top + bounds.height / 2;
              targetRow.classList.add('drag-target');
            }
          };

          const finish = finishEvent => {
            handle.removeEventListener('pointermove', update);
            handle.removeEventListener('pointerup', finish);
            handle.removeEventListener('pointercancel', finish);
            targetRow?.classList.remove('drag-target');
            row.classList.remove('is-dragging');
            row.style.removeProperty('position');
            row.style.removeProperty('z-index');
            row.style.removeProperty('transform');
            if (handle.hasPointerCapture(finishEvent.pointerId)) handle.releasePointerCapture(finishEvent.pointerId);
            if (moved && targetRow) {
              suppressNextClick = true;
              setTimeout(() => { suppressNextClick = false; }, 0);
              onDrop(row.dataset[dataKey], targetRow.dataset[dataKey], after);
            }
          };

          handle.addEventListener('pointermove', update);
          handle.addEventListener('pointerup', finish);
          handle.addEventListener('pointercancel', finish);
        });
      });
    }

    document.addEventListener('click', event => {
      if (suppressNextClick) { event.preventDefault(); suppressNextClick = false; return; }
      const objectCard = event.target.closest('[data-open-object-id]');
      if (objectCard && !event.target.closest('.drag-handle')) {
        openObjectDetail(objectCard.dataset.openObjectId);
        return;
      }
      const target = event.target.closest('button');
      if (!target) return;
      if (target.matches('[data-cycle]')) setVariant(Number(target.dataset.cycle));
      else if (target.matches('[data-toggle-filter-order]')) toggleFilterOrder();
      else if (target.matches('[data-filter-id]')) setFilter(target.dataset.filterId);
      else if (target.matches('[data-toggle-all-tags]')) { state.expandedTags = !state.expandedTags; render(); }
      else if (target.matches('[data-toggle-filter-editor]')) { state.filterEditorOpen = !state.filterEditorOpen; render(); }
      else if (target.matches('[data-focus-filter-name]')) {
        state.filterEditorOpen = true;
        render();
        requestAnimationFrame(() => {
          const field = document.querySelector('[data-current-filter-name]');
          field?.focus();
          field?.select();
        });
      }
      else if (target.matches('[data-remove-slice-tag]')) toggleActiveFilterTag(target.dataset.removeSliceTag);
      else if (target.matches('[data-toggle-slice-tag]')) toggleActiveFilterTag(target.dataset.toggleSliceTag);
      else if (target.matches('[data-save-current-filter]')) saveCurrentFilter();
      else if (target.matches('[data-open-filter-panel]')) { state.filterPanelOpen = true; render(); }
      else if (target.matches('[data-close-filter-panel]')) { state.filterPanelOpen = false; renderFilterPanel(); }
      else if (target.matches('[data-close-object-detail]')) closeObjectDetail();
      else if (target.matches('[data-open-glossary]')) { state.filterPanelOpen = false; renderFilterPanel(); state.glossaryOpen = true; renderGlossary(); }
      else if (target.matches('[data-close-glossary]')) { state.glossaryOpen = false; renderGlossary(); }
      else if (target.matches('[data-open-collections]')) { state.collectionMenuOpen = true; renderCollections(); }
      else if (target.matches('[data-close-collections]')) { state.collectionMenuOpen = false; renderCollections(); }
      else if (target.matches('[data-move-id]')) moveOrdered(target.dataset.moveId, target.dataset.direction);
      else if (target.matches('[data-place-id]')) placeUnordered(target.dataset.placeId);
      else if (target.matches('[data-open-duel]')) { state.duel.open = true; renderDuel(); renderState(); }
      else if (target.matches('[data-close-duel]')) { state.duel.open = false; renderDuel(); }
      else if (target.matches('[data-open-duel-object-id]')) openObjectDetail(target.dataset.openDuelObjectId, 'duel');
      else if (target.matches('[data-duel-outcome]')) {
        const outcome = target.dataset.duelOutcome;
        if (outcome === 'defer') showToast('Пара отложена и вернётся позже');
        else showToast(outcome === 'equal' ? 'Равноценность сохранена' : 'Решение сохранено в общем порядке');
        const filter = activeFilter();
        const current = state.taskProgress[filter.id] ?? 0;
        state.taskProgress[filter.id] = Math.min(96, current + (outcome === 'defer' ? 0 : 4));
        if (!filter.dirty) state.taskProgress[filter.sourceId] = state.taskProgress[filter.id];
        state.duel.pairIndex += 1;
        renderDuel();
        renderState();
      } else if (target.dataset.toast) showToast(target.dataset.toast);
    });

    document.addEventListener('change', event => {
      if (event.target.matches('[data-select-filter]')) setFilter(event.target.value);
    });

    document.addEventListener('submit', event => {
      if (!event.target.matches('[data-object-detail-form]')) return;
      event.preventDefault();
      saveObjectDetail(event.target);
    });

    document.addEventListener('input', event => {
      if (!event.target.matches('[data-current-filter-name]')) return;
      renameCurrentFilter(event.target.value);
      const filter = activeFilter();
      document.querySelector('.filter-editor-head strong')?.replaceChildren(filter.showName ? `Фильтр «${filter.name}»` : 'Текущий фильтр');
      renderState();
    });

    document.addEventListener('focusout', event => {
      if (event.target.matches('[data-current-filter-name]') && !event.target.value.trim()) event.target.value = activeFilter().name;
    });

    document.addEventListener('keydown', event => {
      const editing = event.target.matches('input, textarea, select, [contenteditable="true"]');
      const objectCard = event.target.closest('[data-open-object-id]');
      if (objectCard && !editing && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        openObjectDetail(objectCard.dataset.openObjectId);
        return;
      }
      if (!editing && !state.duel.open && !state.glossaryOpen && !state.collectionMenuOpen && !state.filterPanelOpen && state.objectDetailId == null && event.key === 'ArrowLeft') setVariant(-1);
      if (!editing && !state.duel.open && !state.glossaryOpen && !state.collectionMenuOpen && !state.filterPanelOpen && state.objectDetailId == null && event.key === 'ArrowRight') setVariant(1);
      if (event.key === 'Escape' && state.objectDetailId != null) closeObjectDetail();
      else if (event.key === 'Escape' && state.duel.open) { state.duel.open = false; renderDuel(); }
      else if (event.key === 'Escape' && state.glossaryOpen) { state.glossaryOpen = false; renderGlossary(); }
      else if (event.key === 'Escape' && state.collectionMenuOpen) { state.collectionMenuOpen = false; renderCollections(); }
      else if (event.key === 'Escape' && state.filterPanelOpen) { state.filterPanelOpen = false; renderFilterPanel(); }
    });

    render();
  </script>
</body>
</html>
