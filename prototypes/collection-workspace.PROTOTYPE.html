          state.pendingStartManualConversion = { selectionId: selection.id, elementId, action: 'remove' };
          render();
        }
      }
      else if (target.matches('[data-cancel-start-manual-conversion]')) {
        state.pendingStartManualConversion = null;
        render();
      }
      else if (target.matches('[data-confirm-start-manual-conversion]')) convertStartSelectionToManual();
      else if (target.matches('[data-request-delete-start-element]')) {
        if (!activeStartElement()) return;
        state.pendingStartElementDeleteId = target.dataset.requestDeleteStartElement;
        render();
      }
      else if (target.matches('[data-cancel-delete-start-element]')) {
        state.pendingStartElementDeleteId = null;
        render();
      }
      else if (target.matches('[data-confirm-delete-start-element]')) deleteStartElement(target.dataset.confirmDeleteStartElement);
      else if (target.matches('[data-toggle-filter-order]')) toggleFilterOrder();
      else if (target.matches('[data-start-new-filter]')) startNewFilter();
      else if (target.matches('[data-toggle-filter-menu]')) toggleFilterActionMenu(target.dataset.toggleFilterMenu);
      else if (target.matches('[data-request-delete-filter]')) requestDeleteFilter(target.dataset.requestDeleteFilter);
      else if (target.matches('[data-cancel-delete-filter]')) { state.pendingDeleteFilterId = null; render(); }
      else if (target.matches('[data-confirm-delete-filter]')) deleteSavedFilter(target.dataset.confirmDeleteFilter);
      else if (target.matches('[data-filter-id]')) setFilter(target.dataset.filterId);
      else if (target.matches('[data-toggle-all-tags]')) { state.expandedTags = !state.expandedTags; render(); }
      else if (target.matches('[data-toggle-filter-editor]')) { state.filterEditorOpen = !state.filterEditorOpen; if (!state.filterEditorOpen) state.filterTagQuery = ''; render(); }
      else if (target.matches('[data-focus-filter-name]')) {
        state.filterEditorOpen = true;
        render();
        requestAnimationFrame(() => {
          const field = document.querySelector('[data-current-filter-name]');
          field?.focus();
          field?.select();
        });
      }
      else if (target.matches('[data-remove-slice-tag]')) toggleActiveFilterTag(target.dataset.removeSliceTag);
      else if (target.matches('[data-remove-filter-editor-tag]')) toggleActiveFilterTag(target.dataset.removeFilterEditorTag);
      else if (target.matches('[data-add-filter-tag]')) {
        state.filterTagQuery = '';
        toggleActiveFilterTag(target.dataset.addFilterTag);
      }
      else if (target.matches('[data-create-filter-tag]')) location.href = filterCreationURL(target.dataset.createFilterTag);
      else if (target.matches('[data-save-current-filter]')) saveCurrentFilter();
      else if (target.matches('[data-open-filter-panel]')) { state.filterPanelOpen = true; state.filterActionMenuId = null; state.pendingDeleteFilterId = null; render(); }
      else if (target.matches('[data-close-filter-panel]')) { state.filterPanelOpen = false; state.filterActionMenuId = null; state.pendingDeleteFilterId = null; renderFilterPanel(); }
      else if (target.matches('[data-open-priorities]')) { state.priorityPanelOpen = true; state.priorityReviewConfirmation = false; state.priorityResultOpen = false; renderPriorityPanel(); renderState(); }
      else if (target.matches('[data-close-priorities]')) { state.priorityPanelOpen = false; state.priorityReviewConfirmation = false; state.priorityResultOpen = false; renderPriorityPanel(); renderState(); }
      else if (target.matches('[data-start-priority-task]')) openPriorityTask();
      else if (target.matches('[data-open-priority-result]')) { state.priorityResultOpen = true; state.priorityReviewConfirmation = false; renderPriorityPanel(); renderState(); }
      else if (target.matches('[data-close-priority-result]')) { state.priorityResultOpen = false; renderPriorityPanel(); renderState(); }
      else if (target.matches('[data-confirm-priority-review]')) { state.priorityReviewConfirmation = true; renderPriorityPanel(); }
      else if (target.matches('[data-cancel-priority-review]')) { state.priorityReviewConfirmation = false; renderPriorityPanel(); }
      else if (target.matches('[data-start-priority-review]')) startPriorityReview();
      else if (target.matches('[data-finish-priority-review]')) finishPriorityReview();
      else if (target.matches('[data-remove-object-tag]')) {
        state.objectDetailDraft.tags = state.objectDetailDraft.tags.filter(tag => normalizeTag(tag) !== normalizeTag(target.dataset.removeObjectTag));
        rerenderObjectDetailPreservingScroll(true);
      }
      else if (target.matches('[data-add-object-tag]')) {
        if (!state.objectDetailDraft.tags.some(tag => normalizeTag(tag) === normalizeTag(target.dataset.addObjectTag))) state.objectDetailDraft.tags.push(target.dataset.addObjectTag);
        state.objectTagQuery = '';
        rerenderObjectDetailPreservingScroll(true);
      }
      else if (target.matches('[data-create-object-tag]')) location.href = glossaryCreationURL(target.dataset.createObjectTag);
      else if (target.matches('[data-close-object-detail]')) closeObjectDetail();
      else if (target.matches('[data-open-glossary]')) { state.filterPanelOpen = false; renderFilterPanel(); state.glossaryOpen = true; renderGlossary(); }
      else if (target.matches('[data-close-glossary]')) { state.glossaryOpen = false; renderGlossary(); }
      else if (target.matches('[data-open-collections]')) { state.collectionMenuOpen = true; renderCollections(); }
      else if (target.matches('[data-close-collections]')) { state.collectionMenuOpen = false; renderCollections(); }
      else if (target.matches('[data-move-id]')) moveOrdered(target.dataset.moveId, target.dataset.direction);
      else if (target.matches('[data-place-id]')) placeUnordered(target.dataset.placeId);
      else if (target.matches('[data-open-duel]')) { ensureTaskVersion(activeFilter()); state.duel.open = true; renderDuel(); renderState(); }
      else if (target.matches('[data-close-duel]')) { state.duel.open = false; renderDuel(); }
      else if (target.matches('[data-open-duel-object-id]')) openObjectDetail(target.dataset.openDuelObjectId, 'duel');
      else if (target.matches('[data-duel-outcome]')) {
        const outcome = target.dataset.duelOutcome;
        const filter = activeFilter();
        const [left, right] = priorityPairForFilter(filter);
        if (outcome === 'defer') {
          state.duel.pairIndex += 1;
          showToast('Пара отложена: отношение остаётся неизвестным');
          render();
          return;
        }
        applyPrototypePriorityDecision(filter, left, right, outcome);
        const decisionToast = outcome === 'equal' ? 'Равноценны — сохранено одно общее место' : 'Выбор сохранён — порядок обновлён';
        const reviewRemaining = state.priorityReviewRemaining[filter.id] ?? 0;
        if (reviewRemaining > 0) {
          state.priorityReviewRemaining[filter.id] = Math.max(0, reviewRemaining - 1);
          if (!filter.dirty) state.priorityReviewRemaining[filter.sourceId] = state.priorityReviewRemaining[filter.id];
          state.duel.pairIndex += 1;
          if (state.priorityReviewRemaining[filter.id] === 0) {
            projectCompletedOrderToSavedFilters(filter);
            state.duel.open = false;
            state.priorityPanelOpen = true;
            clearPriorityReviewRoute();
            showToast('Пересмотр завершён');
          } else {
            syncPriorityReviewRoute(filter);
            showToast(decisionToast);
          }
          render();
          return;
        }
        const current = state.taskProgress[filter.id] ?? 0;
        state.taskProgress[filter.id] = Math.min(96, current + 4);
        state.maxRemainingComparisons[filter.id] = state.draftUnordered[filter.id].length === 0 ? 0 : Math.max(0, (state.maxRemainingComparisons[filter.id] ?? 1) - 1);
        if (state.maxRemainingComparisons[filter.id] === 0 && state.draftUnordered[filter.id].length) {
          state.draftOrders[filter.id].push(...state.draftUnordered[filter.id]);
          state.draftUnordered[filter.id] = [];
          filter.unorderedIds = [];
        }
        if (!filter.dirty) {
          state.taskProgress[filter.sourceId] = state.taskProgress[filter.id];
          syncCurrentDraftToSource();
        }
        state.duel.pairIndex += 1;
        if (state.maxRemainingComparisons[filter.id] === 0) {
          projectCompletedOrderToSavedFilters(filter);
          const completedResult = { id: `result-${Date.now()}`, versionId: taskVersionFor(filter)?.id, completedAt: new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date()), objectIds: [...state.draftOrders[filter.id]] };
          filter.result = completedResult;
          if (!filter.dirty) {
            const source = savedFilters.find(item => item.id === filter.sourceId);
            if (source) source.result = { ...completedResult, objectIds: [...completedResult.objectIds] };
          }
          const completedVersion = taskVersionFor(filter);
          if (completedVersion) {
            completedVersion.kind = 'completed';
            if (!filter.dirty && state.taskVersions[filter.sourceId]) state.taskVersions[filter.sourceId].kind = 'completed';
          }
          state.duel.open = false;
          state.priorityPanelOpen = true;
          state.priorityResultOpen = true;
          showToast('Сравнение завершено');
        } else {
          showToast(decisionToast);
        }
        render();
      } else if (target.dataset.toast) showToast(target.dataset.toast);
    });

    document.addEventListener('change', event => {
      if (event.target.matches('[data-select-filter]')) setFilter(event.target.value);
      else if (event.target.matches('[data-start-search-global]')) {
        state.startSearchGlobal = event.target.checked;
        syncStartingFlowRoute();
        render();
      }
      else if (event.target.matches('[data-new-start-selection-form] [name="mode"]')) {
        state.startSelectionMode = event.target.value === 'manual' ? 'manual' : 'automatic';
        render();
      }
    });

    document.addEventListener('submit', event => {
      if (event.target.matches('[data-new-start-selection-form]')) {
        event.preventDefault();
        const collection = activeStartCollection();
        const nameField = event.target.elements.name;
        const name = nameField.value.trim();
        if (!collection || !name) { nameField.focus(); return; }
        const manual = state.startSelectionMode === 'manual';
        const selection = {
          id: `selection-${state.nextStartSelectionId++}`,
          name,
          tags: manual ? [] : parseStartSelectionTags(event.target.elements.tags?.value || ''),
          system: false,
          mode: manual ? 'manual' : 'automatic',
          ...(manual ? { memberIds: [], originTags: [] } : {})
        };
        collection.selections.push(selection);
        state.activeStartSelectionId = selection.id;
        state.activeStartElementId = null;
        state.startSelectionName = '';
        state.startSelectionTags = '';
        state.startSelectionMode = 'automatic';
        state.appStage = activeStartCollectionStage();
        syncStartingFlowRoute();
        render();
        return;
      }
      if (event.target.matches('[data-edit-start-selection-form]')) {
        event.preventDefault();
        const collection = activeStartCollection();
        const selection = activeStartSelection();
        const nameField = event.target.elements.name;
        const name = nameField.value.trim();
        if (!collection || !selection || selection.system || !name) { nameField.focus(); return; }
        state.startSelectionName = name;
        const tagValue = event.target.elements.tags?.value || state.startSelectionTags;
        state.startSelectionTags = tagValue;
        const tags = selection.mode === 'manual' ? selection.tags : parseStartSelectionTags(tagValue);
        const removedIds = selection.mode === 'manual' ? [] : elementsForStartSelection(collection, selection)
          .filter(element => !startElementMatchesTags(element, tags))
          .map(element => element.id);
        if (removedIds.length) {
          state.pendingStartSelectionDeleteId = null;
          state.pendingStartSelectionFilterChange = { selectionId: selection.id, name, tags, removedIds };
          render();
          return;
        }
        applyStartSelectionChange(selection, name, tags);
        return;
      }
      if (event.target.matches('[data-edit-start-element-form]')) {
        event.preventDefault();
        const element = activeStartElement();
        const selection = activeStartSelection();
        const titleField = event.target.elements.title;
        const title = titleField.value.trim();
        if (!element || !selection || !title) { titleField.focus(); return; }
        element.title = title;
        element.tags = parseStartSelectionTags(event.target.elements.tags.value);
        const remainsInSelection = elementsForStartSelection(activeStartCollection(), selection).some(item => item.id === element.id);
        state.startElementName = '';
        state.startElementTags = '';
        state.pendingStartElementDeleteId = null;
        state.appStage = remainsInSelection ? 'element' : 'selection';
        if (!remainsInSelection) state.activeStartElementId = null;
        syncStartingFlowRoute();
        render();
        if (!remainsInSelection) showToast('Элемент больше не входит в подборку');
        return;
      }
      if (event.target.matches('[data-new-start-element-form]')) {
        event.preventDefault();
        const field = event.target.elements.title;
        const title = field.value.trim();
        if (!title) { field.focus(); return; }
        createStartElement(title);
        return;
      }
      if (event.target.matches('[data-rename-start-collection-form]')) {
        event.preventDefault();
        const collection = activeStartCollection();
        const field = event.target.elements.name;
        const name = field.value.trim();
        if (!collection || !name) { field.focus(); return; }
        collection.name = name;
        state.appStage = activeStartCollectionStage();
        syncStartingFlowRoute();
        render();
        return;
      }
      if (event.target.matches('[data-first-collection-form]')) {
        event.preventDefault();
        const field = event.target.elements.name;
        const name = field.value.trim();
        if (!name) { field.focus(); return; }
        const collection = { id: `collection-${state.nextStartCollectionId++}`, name, elements: [], selections: [{ id: 'all', name: 'Вся коллекция', tags: [], system: true }] };
        state.startCollections.push(collection);
        state.activeStartCollectionId = collection.id;
        state.activeStartSelectionId = 'all';
        state.activeStartElementId = null;
        state.firstCollectionName = '';
        state.startCollectionMenuOpen = false;
        state.pendingStartCollectionDeleteId = null;
        state.appStage = 'collections';
        syncStartingFlowRoute();
        render();
        return;
      }
      if (!event.target.matches('[data-object-detail-form]')) return;
      event.preventDefault();
      saveObjectDetail(event.target);
    });

    document.addEventListener('input', event => {
      if (event.target.matches('[data-new-start-element-form] [name="title"]')) {
        state.startElementName = event.target.value;
        return;
      }
      if (event.target.matches('[data-start-element-search]')) {
        state.startElementSearch = event.target.value;
        const position = event.target.selectionStart;
        render();
        const input = document.querySelector('[data-start-element-search]');
        input?.focus();
        input?.setSelectionRange(position, position);
        return;
      }
      if (event.target.matches('[data-start-search-tags]')) {
        state.startSearchQuery = event.target.value;
        const position = event.target.selectionStart;
        syncStartingFlowRoute();
        render();
        const input = document.querySelector('[data-start-search-tags]');
        input?.focus();
        input?.setSelectionRange(position, position);
        return;
      }
      if (event.target.matches('[data-new-start-selection-form] [name="name"]')) {
        state.startSelectionName = event.target.value;
        return;
      }
      if (event.target.matches('[data-new-start-selection-form] [name="tags"]')) {
        state.startSelectionTags = event.target.value;
        return;
      }
      if (event.target.matches('[data-edit-start-selection-form] [name="name"]')) {
        state.startSelectionName = event.target.value;
        return;
      }
      if (event.target.matches('[data-edit-start-selection-form] [name="tags"]')) {
        state.startSelectionTags = event.target.value;
        return;
      }
      if (event.target.matches('[data-edit-start-element-form] [name="title"]')) {
        state.startElementName = event.target.value;
        return;
      }
      if (event.target.matches('[data-edit-start-element-form] [name="tags"]')) {
        state.startElementTags = event.target.value;
        return;
      }
      if (event.target.matches('[data-object-detail-form] [name="title"]')) {
        state.objectDetailDraft.title = event.target.value;
        return;
      }
      if (event.target.matches('[data-object-detail-form] [name="year"]')) {
        state.objectDetailDraft.year = event.target.value;
        return;
      }
      if (event.target.matches('[data-object-tag-search]')) {
        state.objectTagQuery = event.target.value;
        rerenderObjectDetailPreservingScroll(true);
        return;
      }
      if (event.target.matches('[data-filter-tag-search]')) {
        state.filterTagQuery = event.target.value;
        const position = event.target.selectionStart;
        render();
        const input = document.querySelector('[data-filter-tag-search]');
        input?.focus();
        input?.setSelectionRange(position, position);
        return;
      }
      if (event.target.matches('[data-current-filter-name]')) {
        renameCurrentFilter(event.target.value);
        renderState();
      }
    });

    document.addEventListener('focusout', event => {
      if (event.target.matches('[data-current-filter-name]') && !event.target.value.trim()) event.target.value = '';
    });

    document.addEventListener('keydown', event => {
      const editing = event.target.matches('input, textarea, select, [contenteditable="true"]');
      const objectCard = event.target.closest('[data-open-object-id]');
      if (event.key === 'Enter' && event.target.matches('[data-start-element-search]')) {
        event.preventDefault();
        const collection = activeStartCollection();
        const title = event.target.value.trim();
        if (title && collection && matchingStartElements(collection, title).length === 0) createStartElement(title);
        return;
      }
      if (objectCard && !editing && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        openObjectDetail(objectCard.dataset.openObjectId);
        return;
      }
      if (event.key === 'Escape' && state.appStage === 'search') closeStartSearch();
      else if (event.key === 'Escape' && state.pendingStartManualConversion) {
        state.pendingStartManualConversion = null;
        render();
      }
      else if (event.key === 'Escape' && state.appStage === 'new-collection') {
        state.appStage = state.startCollections.length ? state.startReturnStage : 'empty';
        if (['collection', 'collection-empty'].includes(state.appStage) && !activeStartCollection()) state.appStage = 'collections';
        state.firstCollectionName = '';
        syncStartingFlowRoute();
        render();
      }
      else if (event.key === 'Escape' && state.appStage === 'new-selection') {
        state.startSelectionName = '';
        state.startSelectionTags = '';
        state.startSelectionMode = 'automatic';
        state.appStage = activeStartCollectionStage();
        syncStartingFlowRoute();
        render();
      }
      else if (event.key === 'Escape' && state.pendingStartSelectionFilterChange) {
        state.pendingStartSelectionFilterChange = null;
        render();
      }
      else if (event.key === 'Escape' && state.pendingStartSelectionDeleteId) {
        state.pendingStartSelectionDeleteId = null;
        render();
      }
      else if (event.key === 'Escape' && state.appStage === 'edit-selection') {
        state.startSelectionName = '';
        state.startSelectionTags = '';
        state.appStage = 'selection';
        syncStartingFlowRoute();
        render();
      }
      else if (event.key === 'Escape' && state.pendingStartElementDeleteId) {
        state.pendingStartElementDeleteId = null;
        render();
      }
      else if (event.key === 'Escape' && state.appStage === 'edit-element') {
        state.startElementName = '';
        state.startElementTags = '';
        state.appStage = 'element';
        syncStartingFlowRoute();
        render();
      }
      else if (event.key === 'Escape' && state.appStage === 'new-element') {
        state.startElementName = '';
        state.startElementSearch = '';
        state.appStage = state.startElementReturnStage;
        syncStartingFlowRoute();
        render();
      }
      else if (event.key === 'Escape' && state.appStage === 'rename-collection') {
        state.appStage = activeStartCollectionStage();
        syncStartingFlowRoute();
        render();
      }
      else if (event.key === 'Escape' && state.pendingStartCollectionDeleteId) { state.pendingStartCollectionDeleteId = null; render(); }
      else if (event.key === 'Escape' && state.startCollectionMenuOpen) { state.startCollectionMenuOpen = false; render(); }
      else if (event.key === 'Escape' && state.objectDetailId != null) closeObjectDetail();
      else if (event.key === 'Escape' && state.duel.open) { state.duel.open = false; renderDuel(); }
      else if (event.key === 'Escape' && state.glossaryOpen) { state.glossaryOpen = false; renderGlossary(); }
      else if (event.key === 'Escape' && state.collectionMenuOpen) { state.collectionMenuOpen = false; renderCollections(); }
      else if (event.key === 'Escape' && state.filterPanelOpen) { state.filterPanelOpen = false; renderFilterPanel(); }
      else if (event.key === 'Escape' && state.priorityPanelOpen && state.priorityResultOpen) { state.priorityResultOpen = false; renderPriorityPanel(); }
      else if (event.key === 'Escape' && state.priorityPanelOpen) { state.priorityPanelOpen = false; state.priorityReviewConfirmation = false; renderPriorityPanel(); }
    });

    if (routeParams.get('stage') === 'hierarchy-prototype') syncStartingFlowRoute();
    render();
  </script>
</body>
</html>
